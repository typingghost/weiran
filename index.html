"id":7,"title":"自私自利的小算盘，迟早把自己算进死胡同","points":[{"text":"算盘精的短视：整天满脑子只有“我能赚多少”、“我能不能占便宜”，把算盘珠子崩到别人脸上，最后所有人都在防着他，路越走越窄。","details":[]},{"text":"天地长寿的底层逻辑：天地之所以永恒，是因为它从来不为自己谋私利（不自生），它只负责托起生态。","details":[]},{"text":"高维博弈策略：","details":["把自己的利益放在后面，别人反而推举你走在前面（后其身而身先）；","把个人安危置之度外，你的精神与成果反而永远存续（外其身而身存）。"]},{"text":"言哥心法：最高阶的“利己”，恰恰是“利他”（非以其无私邪？故能成其私）。搭好平台、赋能他人，你的价值自然坚不可摧。","details":[]}]},{"id":8,"title":"水系选手的降维打击——天下最强，是没人能跟你卷","points":[{"text":"内卷狂人的盲区：所有人都在抢风口、挤独木桥，往金字塔尖上硬爬，爬得头破血流；水偏偏往没人愿意去的低洼流。这不是怂，这叫错峰沉淀，积蓄最恐怖的势能。","details":[]},{"text":"水系“七善”技能树：","details":["居善地（选对生态位，扎根稳）；","心善渊（心像深潭，波澜不惊）；","与善仁（真诚待人，分寸极佳）；","言善信（守时守诺，绝不画饼）；","正善治（梳理混乱，自带条理）；","事善能（随物赋形，极速适配）；","动善时（顺应时势，谋定后动）。"]},{"text":"言哥心法：“夫唯不争，故无尤。” 不把能量浪费在跟烂人烂事的摩擦上，绕过障碍奔向你的终极目标，天下就没人能拦得住你。","details":[]}]},{"id":9,"title":"赚够了还不收手，迟早连本带利全吐出来","points":[{"text":"贪婪赌徒的执念：水倒满了还要往里溢，刀磨得太锋利碰一下就卷刃（揣而锐之）。赚到了钱还要疯狂加杠杆，非要把油门踩进油箱里。","details":[]},{"text":"暴发户的下场：家里堆满金玉，连睡觉都要防着贼；稍微有点地位就翘尾巴，老子冷冷断言：你自己给自己挖好了坟墓（自遗其咎）！","details":[]},{"text":"言哥心法：懂得在最高点获利了结（功遂身退）。适可而止是顶级大智慧，守住胜利果实，别让贪婪吞噬了你的底盘。","details":[]}]},{"id":10,"title":"脑子在开会身体在抗议，整个人分裂得像个精神病","points":[{"text":"当代人的身心失联状态：肉体坐在工位上，灵魂在焦虑明天，精神和肉体完全分家（营魄相离）；浑身肌肉绷得像铁块，呼吸浅得像快断气。","details":[]},{"text":"控制狂巨婴的通病：生了个孩子就想控制他一生，带个团队就想当全知全能的上帝。","details":[]},{"text":"老子的六连暴击拷问：","details":["你的灵魂和肉体能合二为一吗？","你的呼吸和体魄能像婴儿一样柔软通畅吗？","做出成绩你能不居功、当了领袖你能不搞霸权控制吗？"]},{"text":"言哥心法：“生而不有，为而不恃，长而不宰。” 把身心重新连接起来，以最柔软沉静的姿态，驾驭最复杂的事情。","details":[]}]},{"id":11,"title":"别把日程和脑子塞得像个垃圾桶","points":[{"text":"人类迷惑行为：当代人总有一种“空间焦虑症”，买个房子恨不得把柜子打满，排个日程恨不得精确到每5分钟一条，写个代码恨不得把内存占满。","details":[]},{"text":"老子一针见血：车轮能转是因为轴心是空的；碗能装饭是因为中间是空的；房子能住人是因为里面没砌实心砖。实体只是个工具人，真正起作用的是“留白”。","details":[]},{"text":"言哥心法：脑子里塞满焦虑、日程塞满破事，你的系统就离死机不远了。学会留白，留出中空，系统才能喘气。","details":[]}]},{"id":12,"title":"刷短视频刷到脑干缺失的古典诊断书","points":[{"text":"老子两千年前就预判了多巴胺陷阱：天天五颜六色的短视频、震耳欲聋的土嗨神曲、重油重糖的外卖、天天刺激多巴胺的商场促销。老子直接挑明——你这不是在享受，你是在主动把自己的感官搞报废。","details":[]},{"text":"为腹不为目：“目”是外界无穷无尽的视觉刺激与虚荣泡沫，“腹”是身体最基础扎实的需求。","details":[]},{"text":"言哥心法：别天天当算法的提线木偶。少盯那些刺激神经的垃圾信息，吃顿干净健康的饭，比什么虚幻多巴胺都养人。","details":[]}]},{"id":13,"title":"你的玻璃心，纯粹是因为把自己太当回事","points":[{"text":"戏精综合征：老板夸你一句你当场飘上天，别人斜你一眼你回家失眠整宿——老子管这叫“得之若惊，失之若惊”。","details":[]},{"text":"为什么你总觉得受伤害？：老子冷冷一笑：“因为你把自己看得比宇宙还大。” 你身上那个脆弱的“自我意识”包袱太重了，别人随便扔块小石子都能砸碎你的玻璃心。","details":[]},{"text":"言哥心法：把“我”这个概念降维。你算老几？事情搞砸了就搞砸了，丢脸就丢脸。把那点可怜的自尊心收起来，你反而无坚不摧。","details":[]}]},{"id":14,"title":"最高级的架构，你看不到一行花哨的 UI","points":[{"text":"外行看热闹，内行看底层：凡夫俗子总喜欢那些看得见、摸得着、亮瞎眼的特效。但老子告诉你，宇宙最硬核的底层逻辑（道），看不见、听不到、抓不着。","details":[]},{"text":"底层运行逻辑：就像最稳定的服务器后台架构，没有花里胡哨的弹窗，但它支撑着一切运转。","details":[]},{"text":"言哥心法：别被表面的声光电和喧闹迷惑。真正厉害的规律和人，永远运行在无声的底层。","details":[]}]},{"id":15,"title":"别装逼，真正的高手都像在薄冰上散步","points":[{"text":"半吊子才咋咋呼呼：稍微懂点皮毛的人最喜欢到处指点江山，生怕别人不知道他厉害。","details":[]},{"text":"老子眼里的真大佬：","details":["走起路来像冬天踩薄冰（豫兮若冬涉川）——极度敬畏风险；","行事低调得像在别人家做客（俨兮其若客）——从不摆架子；","看起来甚至有点憨厚混沌（浑兮其若浊）——不屑于耍小聪明。"]},{"text":"言哥心法：满瓶不动半瓶摇。把那点显摆的欲望收一收，学会在浑水里静下来，等泥沙慢慢沉淀。","details":[]}]},{"id":16,"title":"强制关机重启，专治精神内耗","points":[{"text":"CPU 冒烟警告：当代人天天焦虑内耗，本质就是后台开了八百个无用 App 还不肯杀进程。","details":[]},{"text":"老子的系统清理法：","details":["杀后台（致虚极）：把脑子里的杂念强制清空；","看周期（观复）：别一遇到低谷就觉得天塌了，花开花落、草木枯荣，一切都是周期；","别瞎扑腾（不知常，妄作凶）：越慌越乱动的人，死得最快。"]},{"text":"言哥心法：遇到烂摊子，先深呼吸闭嘴，别盲目操作。静下来，把视角拉高，等周期转回来。","details":[]}]},{"id":17,"title":"最烂的管理，就是天天在群里发鸡汤","points":[{"text":"管理层鄙视链：","details":["第一等（太上）：把系统和自动化搭好，大家甚至感觉不到领导的存在，事情自然跑通了。","第二等：天天靠个人魅力刷存在感，员工天天夸他好（亲而誉之）。","第三等：靠高压考核和罚款吓唬人（畏之）。","第四等（最烂）：天天画饼PUA，员工当面点头背后问候他全家（侮之）。"]},{"text":"言哥心法：无论带团队还是做系统，最高明的境界是“无感”。把底层机制建好，让事情自然发生，别天天跳出来抢戏。","details":[]}]},{"id":18,"title":"当公司开始大张旗鼓抓考勤，说明它快完蛋了","points":[{"text":"越缺什么越喊什么：家庭和睦的时候，没人天天把“孝顺”挂嘴边；只有家里天天打架，才需要道德标兵。","details":[]},{"text":"现代写照：当一个公司开始天天强调“狼性文化”、“感恩奉献”、连迟到一分钟都要扣钱时，老子冷笑一声：这破船快沉了。 因为底层协同（道）已经烂透了，只能靠表面形式主义来硬撑。","details":[]},{"text":"言哥心法：听话别听口号。凡是外界大张旗鼓宣扬的道德标签，背后往往藏着巨大的制度漏洞和虚伪。","details":[]}]},{"id":19,"title":"扔掉那些假模假样的成功学黑话","points":[{"text":"黑话制造机：天天搞什么“底层逻辑”、“顶层设计”、“赋能闭环”，老子看了只想翻白眼——全都是精致的虚伪和算计。","details":[]},{"text":"解法极其干脆：","details":["把那些自作聪明的小心机丢了（绝巧）；","把那些假惺惺的道德绑架扔了（绝仁）；","回归最纯粹的本质（见素抱朴）。"]},{"text":"言哥心法：别把简单的事情复杂化。把花架子全拆了，老老实实做人做事，烦恼立刻少掉90%。","details":[]}]},{"id":20,"title":"世人皆在赶场卷生卷死，老子只想在角落吃奶","points":[{"text":"人间清醒的孤独宣言：","details":["你们都在朋友圈晒精致下午茶、赶名利场（众人熙熙，如享太牢）；","你们个个精明得像算盘珠子（俗人察察）；","老子我偏要像个不会笑的笨婴儿一样发呆（如婴儿之未孩），像个无家可归的傻子（若无所归）。"]},{"text":"贵食母的傲骨：你们抢的是别人吃剩的面包屑（世俗认同），老子连接的是整个宇宙的能量母体（道）。","details":[]},{"text":"言哥心法：不用为了显得合群而硬挤进傻子的狂欢里。 别人笑你格格不入，你该笑他们身在局中而不自知。","details":[]}]},{"id":21,"title":"别被 PPT 忽悠，看底层有没有真金白银","points":[{"text":"忽悠大会现场：现代人最擅长画大饼、造概念，PPT 做得天花乱坠，底下一行真代码都没有。","details":[]},{"text":"老子验货标准：底层规律（道）表面看起来朦朦胧胧（恍惚），但你往深处看，里面有最真实的底层结构（象）、扎实的核心资产（物）和极度可靠的契约信用（信）。","details":[]},{"text":"言哥心法：别被虚头巴脑的包装迷了眼。无论看项目还是看人，剥掉滤镜，看他肚子里到底有没有货、说的话到底能不能兑现。","details":[]}]},{"id":22,"title":"非要跟水泥地硬磕，纯属脑子缺根弦","points":[{"text":"硬骨头综合征：很多人以为“宁折不弯”是英雄主义，遇到钢筋混凝土非要拿脑门去撞，撞得头破血流还觉得自己特悲壮。","details":[]},{"text":"物理防撞法则：","details":["曲则全：懂得顺势弯曲，零件才不会当场脆断；","少则得，多则惑：贪多嚼不烂，什么都想要的结果就是系统内存溢出。"]},{"text":"言哥心法：适当“弯一下”不叫认怂，叫战术卸力。不争一时口舌之快，把精力留着拿终局结果，没人能争得过你。","details":[]}]},{"id":23,"title":"天天打鸡血发毒誓的，一般活不过三天","points":[{"text":"暴躁狂与发誓狂：狂风刮不了一个早晨，暴雨下一整天也得歇菜。天地的大暴脾气都撑不久，你天天在朋友圈立 flag、情绪大起大落，CPU 不烧穿才怪。","details":[]},{"text":"情绪可持续发展：那些动不动就高呼“我要逆天改命、今晚不睡”的人，往往第三天就人间蒸发；真正成事的人，情绪波动平稳得像心电监护仪走直线。","details":[]},{"text":"言哥心法：戒掉剧烈的情绪狂欢。低功耗、长续航地默默推进，比什么歇斯底里的爆发都管用。","details":[]}]},{"id":24,"title":"踮脚拍照可以，天天踮脚走路那是找抽","points":[{"text":"社交假精致大赏：","details":["踮着脚尖显得高（企者不立）——站两分钟就腿抽筋；","劈大叉大步狂奔（跨者不行）——走几步就扯着蛋；","到处邀功吹牛（自伐者无功）——别人表面微笑，心里把你当小丑。"]},{"text":"剩菜与肉瘤理论：老子把这些硬凹造型、自我感动的行为统称为“余食赘形”——就是桌上的馊饭残渣，长在身上的多余肉瘤，恶心别人，拖累自己。","details":[]},{"text":"言哥心法：把脚后跟踩实了再走路。少发自嗨通稿，脚踏实地的推进力比虚张声势强一万倍。","details":[]}]},{"id":25,"title":"宇宙不归你管，别天天妄想逆天改命","points":[{"text":"人类的蜜汁自信：稍微掌握点技术就觉得自己能征服宇宙，天天喊着“战胜自然”。","details":[]},{"text":"宇宙调用链路：老子直接把系统的依赖层级焊死了：人依赖地，地依赖天，天依赖道，道依赖自然规律。 你只是系统链路终端的一个小客户端，居然想逆向重写底层的物理引擎？","details":[]},{"text":"言哥心法：尊重客观规律。天气冷了就加衣，经济周期下行就备粮，顺着大势走，别跟重力加速度对着干。","details":[]}]},{"id":26,"title":"遇事就炸毛，活该你当炮灰","points":[{"text":"没带粮草就敢浪：行军打仗不带辎重车，看到沿途有美女美食就丢了阵地。老子骂某些领导：管着万辆战车的大国，行事比三岁小孩还轻浮毛躁！","details":[]},{"text":"定盘星原则：沉重是轻浮的根基，冷静是急躁的主宰。遇到一点突发事件就六神无主到处乱转，敌人还没动手你自己先散架了。","details":[]},{"text":"言哥心法：无论外界怎么乱，守住你的基本盘和情绪底线。坐在暴风雨中心喝茶的高手，永远比在雨里抱头乱窜的人活得长。","details":[]}]},{"id":27,"title":"顶尖高手跑完系统，连痕迹都不留","points":[{"text":"初学者才到处留痕：新手改两行代码恨不得全网广播，半吊子吵架恨不得满世界发小作文。","details":[]},{"text":"顶级玩家的优雅：","details":["真正会开车的不留车辙印（善行无辙迹）；","真正会锁门的不用铁锁你就是打不开（善闭无关楗）；","真正的高管能把看似没用的废柴放到合适的位置上发光（无弃人）。"]},{"text":"言哥心法：润物细无声。把事情办得滴水不漏还不显山不露水，这才是最高阶的掌控力。","details":[]}]},{"id":28,"title":"揣着核按钮去菜市场买菜，这叫降维从容","points":[{"text":"暴发户思维 vs 大佬底气：有点能力就急着穿金戴银生怕别人瞧不起，老子称之为“穷人乍富”。","details":[]},{"text":"三组顶级反差姿态：","details":["知雄守雌：深知自己的进攻火力有多猛，但平时偏偏表现得极度温和包容；","知白守黑：把世俗的潜规则看得清清楚楚，但自己偏偏守在暗处不玩脏套路；","知荣守辱：享受得了最高荣誉，也坐得住最冷板凳。"]},{"text":"言哥心法：有能力掀桌子，却选择温和地把事情谈成。手里有牌而不轻易打出，才是最强的威慑。","details":[]}]},{"id":29,"title":"强行微操世界，系统当场崩给你看","points":[{"text":"微操狂魔的噩梦：有些管理者和控制狂恨不得插手每一个齿轮的转动，员工喝口水都要打卡汇报。","details":[]},{"text":"系统的报复：老子冷眼旁观：天下是个极其精密的自适应系统（神器），你越强行插手干预，它崩坏得越快；你越想死死抓紧，溜走得越干净。","details":[]},{"text":"言哥心法：戒掉控制欲（去甚、去奢、去泰）。搭好框架，允许生态自我演进，别把自己累死在微操的路上。","details":[]}]},{"id":30,"title":"靠蛮力硬砸的，早晚被后坐力震碎内脏","points":[{"text":"暴力崇拜者的下场：喜欢用强权、暴力、恶性价格战碾压对手的人，老子就送四个字——其事好还（反噬必至）。","details":[]},{"text":"物极必反：仗打赢了，地里全长荆棘，接着就是大饥荒；拼命透支身体把指标拉满，紧接着就是免疫系统全线崩溃（物壮则老）。","details":[]},{"text":"言哥心法：达到目的就收手（善有果而已），千万别乘胜追击去逞威风。靠透支和蛮力维系的繁荣，都是在给未来埋雷。","details":[]}]},{"id":31,"title":"把凶器当玩具炫耀的，迟早把自己送走","points":[{"text":"暴力狂与撕逼爱好者的狂欢：职场或生活里总有人喜欢把“踩死对手”、“全盘撕破脸”当成战功到处吹嘘，满脸写着暴戾。","details":[]},{"text":"老子的冷血降温：","details":["武器（权力、雷霆手段、杀手锏）本质上就是凶器，不到万不得已绝对别掏出来；","打赢了也没什么好开香槟庆祝的，老子直接定规矩——仗打赢了，请按办丧事的规格来处理（以丧礼处之）！"]},{"text":"言哥心法：杀敌一千自损八百。动用极端手段搞定烂事，只能算“止损”，绝不叫“胜利”。赢了就低调收场，把杀气收敛干净，别把破坏力当成你的勋章。","details":[]}]},{"id":32,"title":"乱加花哨功能的系统，离报废不远了","points":[{"text":"过度设计的灾难：一个原本简洁优雅的系统，非要为了 KPI 不断立新名目、加花哨功能、叠复杂架构，最后卡得连主页都打不开。","details":[]},{"text":"知止不殆：老子告诉你，最开始给事物定规则、起名字是必要的；但一旦体系建立起来，你必须懂得在合适的地方踩刹车（知止）。再瞎折腾下去，系统就要宕机了。","details":[]},{"text":"言哥心法：克制你的控制欲和表现欲。做产品、做人，守住最纯粹的原生状态（朴），百川自然会汇聚到你这里来。","details":[]}]},{"id":33,"title":"天天盯着别人挑刺，自己连早起都搞不定","points":[{"text":"外卷大师的悲哀：很多人研究别人一套一套的，把别人的八卦和毛病摸得门儿清，自以为是社交大师（知人者智）；一回头看自己，拖延症晚期、情绪一碰就炸。","details":[]},{"text":"力量的鄙视链：","details":["靠手段踩趴对手，充其量算力气大（胜人者有力）；","能把自己的惰性、贪婪、焦虑按在地上摩擦的人，才是真正的狠人（自胜者强）。"]},{"text":"言哥心法：把探照灯从别人身上挪开。你的终极竞争对手只有一个，就是那个想偷懒、想摆烂、又爱内耗的自己。","details":[]}]},{"id":34,"title":"别稍微做点贡献，就急着当所有人的爹","points":[{"text":"爹味综合征：稍微帮了别人一点忙，或者在项目里当了核心，就恨不得全世界都认他当教父，天天对别人的人生指手画脚。","details":[]},{"text":"大道的云原生架构：宇宙底层规律滋养了万物，给所有人提供算力和资源，但从来不发推送弹窗邀功（功成不名有），也从来不想当万物的主宰（不为主）。","details":[]},{"text":"言哥心法：成为不可或缺的底层基础设施，而不是到处刷脸的弹窗广告。正因为你不把自己当回事，你的格局才真正大到无人能撼动。","details":[]}]},{"id":35,"title":"垃圾食品最诱人，但保命的往往是白开水","points":[{"text":"多巴胺骗局：路边的重油重盐小吃、商场里的劲爆音乐（乐与饵），最容易吸引路人驻足围观；但天天吃这些，除了脂肪肝什么都留不下。","details":[]},{"text":"底层真理的特征：真正能保命的大智慧（道），说出来寡淡无味，既没有声光电特效，也没有情绪煽动，听起来甚至有点无聊。","details":[]},{"text":"言哥心法：别把“刺激感”当成“有价值”。耐得住平淡、守得住常识，用起来才取之不尽、用之不竭。","details":[]}]},{"id":36,"title":"对手在疯狂作死时，你千万别去打断他","points":[{"text":"极度高级的“捧杀力学”：","details":["想让一个气球爆炸，最好的办法不是用针扎，而是继续往里死命充气（必固张之）；","遇到狂妄自大的对手，别急着跟他硬碰硬，退后一步看他疯狂加杠杆，等他膨胀到极点，自然会当场自爆。"]},{"text":"底牌警告：鱼离开深水就会变成盘中餐；你的核心王牌和致命底线，千万别天天发朋友圈昭告天下（利器不可示人）。","details":[]},{"text":"言哥心法：学会看清周期的反转点。沉住气，守好底牌，看着那些狂妄的人在自满中走向崩盘。","details":[]}]},{"id":37,"title":"领导一放手业务就飞起，领导一插手系统全瘫痪","points":[{"text":"无效折腾大赏：很多团队之所以搞得鸡飞狗跳，不是员工不行，而是管理者每天都想“搞个大新闻”，今天改战略、明天换流程，强行刷存在感。","details":[]},{"text":"自愈系统的威力：只要别瞎干预（无为），万物自己会找到最优解去生长（万物将自化）；如果有人又开始浮躁躁动，就用最底层的纯朴原则压住他。","details":[]},{"text":"言哥心法：管住自己那双“想瞎折腾的手”。给环境留出自我演进的静气，很多问题不治自愈。","details":[]}]},{"id":38,"title":"当公司开始抓迟到抓礼仪，说明它已经烂透了","points":[{"text":"人类道德退化鄙视链：","details":["道（底层默契极高）→ 崩了之后讲 德（靠人品硬撑）；","德 崩了讲 仁（靠温情打感情牌）；","仁 崩了讲 义（靠讲江湖义气道德绑架）；","义 崩了讲 礼（靠打卡考勤、繁文缛节、发誓宣誓，谁不听就撸袖子揍人！）。"]},{"text":"形式主义是信任破产的开始：凡是一个组织开始大张旗鼓抓仪表、背口号、搞狼性感恩仪式时，老子冷笑：底层信任已经薄如蝉翼，混乱的苗头正式开始了（乱之首）！","details":[]},{"text":"言哥心法：远离表面做戏的花架子（不居其薄，不居其华），守住最扎实诚恳的内核。","details":[]}]},{"id":39,"title":"别把自己当成易碎的帝王绿，当块耐造的石头吧","points":[{"text":"精致玻璃心 vs 敦实耐造王：很多人把自己包装得像价值连城的绝美翡翠（琭琭如玉），碰一下就碎，走两步怕脏，脆弱得要命。","details":[]},{"text":"大人物的生存姿态：","details":["高楼大厦的根本在底层的烂泥巴（高以下为基）；","最高级的赞美，是压根不需要外界的标签与赞誉（至誉无誉）。"]},{"text":"言哥心法：别端着身段当易碎的艺术品。像路边的顽石一样粗砺、结实、耐磨（珞珞如石），任凭风吹雨打，你自岿然不动。","details":[]}]},{"id":40,"title":"宇宙物理引擎总纲：物极必反与降维打击","points":[{"text":"老子全书最短、却最恐怖的一章：全章只有 21 个字，直接给整个宇宙写完了底层驱动代码：","details":["反者道之动：事物发展到极限，一定会掉头向反方向狂奔。狂欢的尽头是空虚，顶峰的下一步是下坡，绝境的底层在孕育新生。","弱者道之用：最柔弱、最不起眼的形态（比如水、比如耐心、比如细水长流），往往是撬动世界最强大的杠杆。","有生于无：所有的可见实体（财富、系统、代码），最开始都源自脑海里那个看不见摸不着的空旷灵感（无）。"]},{"text":"言哥心法：顺风时别狂，逆风时别慌。利用好“柔韧”这件终极武器，从无到有去架构你的世界。","details":[]}]},{"id":41,"title":"傻子如果不嘲笑你，说明你这方案毫无新意","points":[{"text":"人类理解力三层鄙视链：","details":["学霸（上士）：听懂底层逻辑，闷头去执行；","路人（中士）：今天信、明天忘，跟风跑腿；","杠精（下士）：听到真理当场哈哈大笑，觉得你是个神经病。"]},{"text":"不笑不足以为道：老子冷冷一笑——如果一个颠覆性的前沿理念连蠢货都能立刻拍手称赞，那它大概率只是毫无价值的平庸陈词滥调。","details":[]},{"text":"言哥心法：顶级的作品与格局，往往没有棱角（大方无隅）、不搞刺耳的噪音（大音希声）。别指望所有人都能理解你，被平庸之辈嘲笑，恰恰证明你走在前面。","details":[]}]},{"id":42,"title":"给系统做减法，往往比瞎做加法更能盈利","points":[{"text":"加法狂魔的末路：很多人做产品或过日子，总觉得功能越多越好、拥有的越多越安全，疯狂叠堆砌物。","details":[]},{"text":"老子的动态杠杆（损益论）：","details":["损之而益：砍掉多余的冗余分支，系统运行速度反而翻倍；","益之而损：盲目塞入过多营养或功能，机器当场过载死机。"]},{"text":"言哥心法：别怕暂时的“损失”或“放弃”。学会主动砍掉低效社交和无用欲望，给系统减负，你才能真正腾出手来放大招。","details":[]}]},{"id":43,"title":"水能滴穿钢板，你非要拿脑门去硬撞","points":[{"text":"硬碰硬的低段位玩家：遇到阻碍只会用蛮力硬砸、大喊大叫，结果除了把自己的手震骨折，什么都没改变。","details":[]},{"text":"量子穿墙术（无有入无间）：水是最柔软的，却能穿透最坚硬的花岗岩；看不见摸不着的空气，能渗透进毫无缝隙的空间。","details":[]},{"text":"言哥心法：遇到难啃的硬骨头，别正面硬刚。像水一样寻找细微的缝隙渗透进去，以柔克刚、顺势化解，这才是降维打击。","details":[]}]},{"id":44,"title":"天天拿命换钱，最后连医药费都付不起","points":[{"text":"现代人的糊涂账：老子指着脑门发问：虚名和身体哪个跟你更亲？金钱和寿命哪个更重要？","details":[]},{"text":"囤积狂的代价（多藏必厚亡）：","details":["拼命加班透支身体换来一个总监头衔，结果落下一身慢性病；","疯狂囤积财富舍不得花，最后全送给了医院和ICU。"]},{"text":"言哥心法：懂得踩刹车的人才能开长途（知止不殆）。守住健康和基本盘，别为了外界的虚幻标签把自己的核心硬件给烧了。","details":[]}]},{"id":45,"title":"强迫症晚期，纯粹是跟自己过不去","points":[{"text":"完美主义的陷阱：非要把事情做到没有一丝瑕疵，有一点小纰漏就焦虑得抓狂。","details":[]},{"text":"真正顶级的美学与智慧：","details":["最完美的成就往往留有一点缺口（大成若缺），这样才具备弹性和包容度；","最厉害的口才听起来甚至有点笨拙木讷（大辩若讷），因为不需要花言巧语来掩饰。"]},{"text":"言哥心法：放弃对“绝对完美”的病态执念。允许系统留有一点余地和粗糙感，运转起来反而最持久、最不卡顿。","details":[]}]},{"id":46,"title":"贪得无厌的下场，就是战马在郊外产仔","points":[{"text":"贪婪引发的系统崩溃：","details":["天下清明时，战马都退役去农田拉粪施肥；","欲望泛滥内卷成灾时，连怀着孕的母马都得拉上战场拼命（戎马生于郊）。"]},{"text":"终极祸源：所有的危机、战争与精神内耗，根源都在于“不知足”和“总想占有更多”。","details":[]},{"text":"言哥心法：认清什么是“足够”。不被无限膨胀的欲望绑架，你随时随地都是富足自由的。","details":[]}]},{"id":47,"title":"天天到处打卡社交，脑子里依然是一坨浆糊","points":[{"text":"伪勤奋的社交狂人：天天满世界飞、赶各种局、加几千个好友，自以为见多识广；一遇到实际问题，脑子空空，毫无底层判断力。","details":[]},{"text":"老子的穿透力：你跑得越远、接收的碎片垃圾信息越多，反而离底层规律越远（其出弥远，其知弥少）。","details":[]},{"text":"言哥心法：真正的认知升级不在于刷了多少信息，而在于对“第一性原理”的沉淀。关上窗、静下心，把底层逻辑吃透，比到处瞎跑管用得多。","details":[]}]},{"id":48,"title":"天天狂加新技能，不如每天清理一遍系统垃圾","points":[{"text":"学习与得道的根本区别：","details":["为学日益（做加法）：学具体的知识技能，每天都要增加新的数据包；","为道日损（做减法）：修炼心智与认知，每天都要删除偏见、卸载执念、清空内耗！"]},{"text":"言哥心法：当代人缺的不是信息输入，而是垃圾清理机制。每天减去一点浮躁、减去一点多余的欲望，减到极致，你才能调动全盘潜能（无为而无不为）。","details":[]}]},{"id":49,"title":"别天天端着架子，大家都只是好奇的小屁孩","points":[{"text":"爹味管理 vs 空杯共情：","details":["低级玩家总想把自己的意志强加给别人，天天立规矩、分敌友；","顶级高手没有固执的自我偏见（圣人常无心），别人善我也善，别人不善我也宽容以待。"]},{"text":"圣人皆孩之：老子把世间纷争看得很透——大家为了名利争得面红耳赤，其实就像一群为了抢积木而哭闹的小孩，抱抱他们、顺毛摸摸就化解了。","details":[]},{"text":"言哥心法：卸下防御与成见。把复杂的人际关系降维看待，以最纯粹包容的姿态去承载万物。","details":[]}]},{"id":50,"title":"天天保温杯里泡枸杞，却把自己吓出了心肌炎","points":[{"text":"过度养生的荒谬大赏：十个人里面有三个长寿，三个早逝，还有三个原本能好好活着，却因为“太把养生当回事、过度进补折腾”（以其生之厚），硬生生把自己折腾进了死胡同！","details":[]},{"text":"真正的保命哲学（无死地）：","details":["真正懂生活的高手，走在路上不会招惹野兽，进入战场不用穿厚重铠甲；","因为他内心坦然无畏，身上没有暴露弱点和死穴（无死地），别人连下刀的地方都找不着。"]},{"text":"言哥心法：戒掉对衰老和死亡的过度恐慌。放平心态，自然生活，不作死、不内耗，猛兽和破事自然找不到伤害你的抓手。","details":[]}]},{"id":51,"title":"别把平台的红利，全当成自己的超能力","points":[{"text":"贪天之功的普信行为：很多人稍微做成了一点事，就觉得全凭自己天赋异禀，恨不得把名字刻在里程碑上。","details":[]},{"text":"事物的成型链路：老子把底层逻辑拆得很透——","details":["道生之（底层规律给原型）；","德畜之（品格与资源给滋养）；","物形之（物理硬件给实体）；","势成之（时代大势推着你起飞）。"]},{"text":"言哥心法：你只是顺应了时代与规律的工具人（势成之）。生而不有，长而不宰——做好交付，别把平台的红利当成自己的翅膀，更别试图去终身控制成果。","details":[]}]},{"id":52,"title":"挂着几十个后台标签页，难怪你脑子天天卡顿","points":[{"text":"感官过载大赏：眼睛盯着屏幕、耳朵塞着耳机、嘴巴吃着零食、脑子想着八卦——老子管这叫“开其兑，济其事”，天天给感官开大门，结果就是“终身不救”，累到虚脱还不知道为什么。","details":[]},{"text":"物理级物理降噪：","details":["塞其兑，闭其门：把那些弹窗通知、无用社交和碎片噪音彻底关掉；","见小曰明：能察觉到微小的问题苗头，才叫真正的通透。"]},{"text":"言哥心法：定期给自己的感官打静音补丁。关掉无效输入，守住底层元气，你的核心系统一辈子都不会宕机。","details":[]}]},{"id":53,"title":"天天穿名牌戴金表，家里连米缸都是空的","points":[{"text":"走捷径综合征：平坦的大道不肯老老实实走，非要找歪门邪道抄近路，结果十个有九个掉进了悬崖。","details":[]},{"text":"古典版“精致穷”：","details":["农田荒得长满野草，粮仓空得老鼠流泪（基本盘烂透了）；","身上却穿着名牌高定，腰里跨着镀金宝剑，天天晒米其林大餐（服文采，厌饮食）。"]},{"text":"老子毒舌定性：这不叫成功人士，这叫“盗夸”——也就是打肿脸充胖子的强盗头子！","details":[]},{"text":"言哥心法：别把虚荣泡沫当实力。把地基打实、粮仓填满，比什么表面风光都管用得多。","details":[]}]},{"id":54,"title":"地基打在沙滩上，盖再高也是危房","points":[{"text":"好高骛远妄想症：自己房间乱成猪窝、早起都起不来，张口闭口就是“我要改变世界、重构行业格局”。","details":[]},{"text":"层层递归调用栈：","details":["先把自己的身体和心智 bug 修好（修之于身）；","才能理顺家庭（修之于家），再辐射到外部系统（天下）。"]},{"text":"言哥心法：别整天想着一步登天。先把眼前的局部代码调通，根基扎得足够深，风暴来了才拔不动你。","details":[]}]},{"id":55,"title":"天天绷紧神经凹造型，迟早把自己拉伤","points":[{"text":"死撑型选手的悲哀：天天把肌肉绷得像块铁板，以为这就叫刚强，结果一弯腰腰椎间盘突出。","details":[]},{"text":"婴儿的高级生命力：","details":["骨头和筋都是软乎乎的，但小手抓得极紧（骨弱筋柔而握固）；","哭一整天嗓子都不会哑（终日号而嗌不嗄），因为人家全身通畅、没有对抗内耗！"]},{"text":"言哥心法：过度使劲、盲目加戏（心使气曰强），只会加速老化。学会放松身体、卸掉紧绷感，柔软通透才是最高阶的抗造。","details":[]}]},{"id":56,"title":"懂的人在默默吃肉，不懂的在朋友圈大声念经","points":[{"text":"社交圈装懂大赏：真正赚到钱、看透局的人，低调得像个隐形人；只有刚入行被割了韭菜的半吊子，天天到处开讲座传授秘籍（言者不知）。","details":[]},{"text":"无懈可击的“玄同”状态：","details":["把刺人的锋芒收起来，融入周围的环境（和光同尘）；","没有把柄让人讨好，也没有死穴让人加害；你既无法巴结他，也无法孤立他。"]},{"text":"言哥心法：管住自己的嘴。把自己的防御矩阵拉满，不当显眼包，别人自然找不到伤你的切入点。","details":[]}]},{"id":57,"title":"制度越繁琐，摸鱼和作弊的花样就越多","points":[{"text":"形式主义大翻车：公司只要一出台“300条员工管理细则”，紧接着就会诞生“500种带薪摸鱼新策略”。","details":[]},{"text":"老子的规律总结：禁忌越多，大家越穷；管制和惩罚越严苛，钻空子的盗贼和骗子反而遍地开花（法令滋彰，盗贼多有）。","details":[]},{"text":"言哥心法：减少繁文缛节与过度干预。把舞台留给规律本身，少折腾、少折腾、还是少折腾！","details":[]}]},{"id":58,"title":"非要把每个人都查得底掉，团队不散伙才怪","points":[{"text":"显微镜式管理狂：领导天天拿着放大镜挑刺、严防死守（其政察察），搞得所有人战战兢兢、互相甩锅（其民缺缺）。","details":[]},{"text":"处世的最高分寸感：","details":["方而不割：自己有原则，但不拿棱角去扎别人；","直而不肆：说话耿直，但懂得留体面不放肆；","光而不耀：自带光芒，却绝不晃瞎别人的眼。"]},{"text":"言哥心法：遇事留点钝感力与灰度空间。水至清则无鱼，别把人际关系逼进死角。","details":[]}]},{"id":59,"title":"天天挥霍心力，你的电池还剩几格？","points":[{"text":"能量败家子：为了一句闲话生半天闷气，为了一点小事跟路人死磕两个小时——把宝贵的情绪能量全漏光了。","details":[]},{"text":"吝啬鬼的保命术（莫若啬）：","details":["老子提倡像守财奴一样抠门地省着用自己的精神与精力；","不该生气的气不生，不该管的闲事不管，早早储备能量（重积德）。"]},{"text":"言哥心法：把精力当成黄金来花。省下无谓的消耗，把电量全部投入到核心目标上，你的根基自然深不可测（深根固柢）。","details":[]}]},{"id":60,"title":"治国就像煎小鱼，天天拿铲子乱翻全碎成渣","points":[{"text":"千古名梗真相：煎一锅小鱼苗，最忌讳拿着锅铲在里面疯狂乱搅乱翻，翻两下全变成一锅烂肉泥。","details":[]},{"text":"不瞎折腾的降魔术：","details":["很多复杂的系统和妖魔鬼怪，你越去大动干戈地“镇压”，它闹得越欢；","按照规矩放着别乱动（以道莅天下），妖魔鬼怪折腾不出浪花，自然就歇菜了。"]},{"text":"言哥心法：无论是调理身体、管团队还是做项目，给系统自愈的时间。管住你那只按捺不住想乱翻的手，事情自然水到渠成。","details":[]}]},{"id":61,"title":"越是大块头，越别摆出一副要吃人的嘴脸","points":[{"text":"大厂病与大国傲慢：体量稍微做大一点，就恨不得拿鼻孔看人，天天以霸主自居四处树敌，生怕别人不知道他是个庞然大物。","details":[]},{"text":"江海与磁场的定位：","details":["大邦者下流：大国、大平台应该像江海一样甘处下游低位，才能让天下百川（资源、人才）主动汇聚过来；","雌性以安静沉着胜过雄性，以谦逊放低姿态掌控大局。"]},{"text":"言哥心法：实力越强，腰杆越要放软。把姿态放低不叫伏小，叫“虹吸效应”。你把底盘放得足够低，全世界的资源都会顺着重力流进你的口袋。","details":[]}]},{"id":62,"title":"别把老底当抹布扔，危急时刻只有它能捞你","points":[{"text":"买椟还珠的世俗蠢货：开着四匹马拉的顶级豪车、捧着价值连城的和田美玉（拱璧以先驷马），在名利场上招摇过市，自以为拥有了全世界。","details":[]},{"text":"老子的终极底牌：","details":["漂亮话可以换来表面的虚荣尊重，但遇到真正的天灾人祸、系统崩盘，豪车美玉连个安全气囊都算不上；","唯有掌握底层规律（道），遇到困境能求生脱险（有罪以免）。"]},{"text":"言哥心法：守好你的底层认知和核心本领。别被浮华的名利排场迷了眼，那是泡沫；底层规律才是你永远的救生圈。","details":[]}]},{"id":63,"title":"把最硬的骨头拆成肉丝，大招都是悄悄憋出来的","points":[{"text":"口嗨吹牛综合征：天天把“这事简单、包在我身上”挂嘴边（轻诺必寡信），结果一上手到处踩坑、狼狈不堪（多易必多难）。","details":[]},{"text":"拆解复杂系统的艺术：","details":["天下再难的项目，最开始都是从最微小的简单模块做起的（天下难事必作于易）；","高手从来不一上来就搞宏大叙事，而是默默把每一个底层细节啃透。"]},{"text":"言哥心法：做事前先敬畏困难（圣人犹难之）。把大目标拆解成每天可以交付的微小闭环，最后自然水到渠成，再无难事。","details":[]}]},{"id":64,"title":"九层高楼崩于蚁穴，半场开香槟死得最惨","points":[{"text":"半场开香槟的惨案：很多人做事，前面九十九步都走得极好，偏偏在快要成功的终点线前松懈狂欢（常于几成而败之），结果最后一哆嗦当场翻车。","details":[]},{"text":"风险前置防御（为之于未有）：","details":["局势平稳时最容易掌控，苗头未现时最容易扼杀；","别等火烧连营了才慌忙救火，把问题掐死在萌芽状态。"]},{"text":"言哥心法：“慎终如始，则无败事。” 越是快要收尾交付的关头，越要把第一天那种如履薄冰的严谨劲儿拿出来。","details":[]}]},{"id":65,"title":"天天给群众洗脑玩心眼，迟早被反噬成筛子","points":[{"text":"耍小聪明的反噬：管理层天天玩套路、立花哨考核、跟员工斗智斗勇，结果全员学会了精致利己和表面糊弄（民之难治以其智多）。","details":[]},{"text":"“大智若愚”的真诚治理：","details":["老子的“愚民”不是搞封建迷信愚蠢化，而是让大家保持纯朴、不耍心机；","靠套路和心眼治国管团队，是毁掉信任的强盗行为（以智治国，国之贼）。"]},{"text":"言哥心法：真诚才是唯一的必杀技。别把别人当傻子，少玩机巧算计，回归最简单的契约与信任。","details":[]}]},{"id":66,"title":"想当百川之王，就把自己的底盘放进海沟里","points":[{"text":"霸道总裁的死穴：天天把“我是老大、你们都得听我的”写在脸上，骑在别人脖子上作威作福，搞得所有人苦不堪言。","details":[]},{"text":"真正领袖的物理定位：","details":["江海能成为百川之王，纯粹是因为它把自己的水位降到了最低（以其善下之）；","高手身居高位，底下人却感觉不到沉重压迫（处上而民不重）；走在队伍前面，大家也不觉得被挡了视线。"]},{"text":"言哥心法：把姿态放低、把舞台让给别人，全世界都会乐于推举你、拥护你（天下乐推而不厌）。","details":[]}]},{"id":67,"title":"我有三样绝世核武，可惜世人都当成了破烂","points":[{"text":"现代人的自杀式狂飙：","details":["丢掉宽容去逞匹夫之勇（舍慈且勇）；","丢掉节制去搞无底线扩张（舍俭且广）；","抢着出头当出头鸟（舍后且先）——老子直接判死刑：必死无疑（死矣）！"]},{"text":"老子的三件传世至宝：","details":["慈（温和宽厚，所以能爆发出最坚不可摧的保护欲）；","俭（极度克制省电，所以能拥有最宽广的战略纵深）；","不敢为天下先（不当无谓的垫脚石，所以能成为长久的领袖）。"]},{"text":"言哥心法：守住“宽厚、克制、内敛”这三张底牌，天道自然会化作最严密的护盾庇护你。","details":[]}]},{"id":68,"title":"真正的大佬打架，连眼皮都懒得抬一下","points":[{"text":"街头混混式打斗：稍微被挑衅一下就暴跳如雷、青筋暴起，到处找人干架（善战者怒）。","details":[]},{"text":"宗师级的降维打击：","details":["真正厉害的勇士从不耀武扬威（不武）；","真正会打仗的高手绝不情绪化发怒（不怒）；","真正能战胜敌人的人，甚至压根不跟对手正面死磕缠斗（不与）。"]},{"text":"言哥心法：不争一时之气，不打无谓之仗。用最优雅冷静的姿态调动全局力量，不战而屈人之兵。","details":[]}]},{"id":69,"title":"永远别把对手当傻子，骄兵必败是铁律","points":[{"text":"盲目自大的致命伤：稍微有点优势就开始轻视对手，以为自己天下无敌（祸莫大于轻敌），结果一脚踩进伏击圈死无葬身之地。","details":[]},{"text":"战术级后退艺术：","details":["不主动发起挑衅攻击（不敢为主而为客）；","宁可后退一尺观察局势，也不盲目冒进一寸（不敢进寸而退尺）。"]},{"text":"言哥心法：怀着敬畏与悲悯之心上战场的人，往往能笑到最后（哀者胜矣）。保持防守反击的清醒，永远别小看任何潜在风险。","details":[]}]},{"id":70,"title":"看不懂我的代码没关系，老子怀里揣着真核","points":[{"text":"曲高和寡的孤独：老子叹气——我的话逻辑极其清晰、操作极度简单，可世人全被贪欲和杂念蒙了眼，就是听不懂、做不到。","details":[]},{"text":"被褐怀玉的贵气：","details":["穿一件破粗布麻衣（被褐），怀里却揣着无价的美玉（怀玉）；","你们看不懂我的格局没关系，我也压根不需要你们给我点赞。"]},{"text":"言哥心法：不必为了讨好大众而拉低自己的认知。哪怕表面朴素无华，只要内心揣着真金美玉，懂你的人自然会视你为至宝。","details":[]}]},{"id":71,"title":"天天装懂王，纯属脑子有大病","points":[{"text":"社交圈懂王综合征：明明一窍不通，为了面子非要强行附和，张口闭口“这事我早知道了、底层逻辑就是这样”——老子直截了当诊断：这叫病，而且病得不轻（不知知，病也）！","details":[]},{"text":"真正的顶尖认知（以其病病）：","details":["知道自己的认知有边界，坦然承认“这题我不会”，这叫顶级通透（知不知，尚矣）；","高手之所以不犯蠢（不病），是因为他把“盲目装懂”这件事当成严重的疾病来防范。"]},{"text":"言哥心法：承认无知不丢人，不懂装懂才要命。保持空杯心态，你的系统永远有升级扩容的空间。","details":[]}]},{"id":72,"title":"把老实人逼到墙角，天王老子也救不了你","points":[{"text":"高压管理的雷区：自以为手里有权力有筹码，就天天施压恐吓。当底下人连死都不怕的时候，你那点所谓的“威慑力”瞬间沦为笑话（民不畏威，则大威至）。","details":[]},{"text":"侵入他人边界的恶果：别去骚扰别人的安居之所，别去断别人的生存口粮（无狎其所居，无厌其所生）。","details":[]},{"text":"言哥心法：爱惜自己，但别把自己捧成尊贵的神（自爱不自贵）。凡事给人留活路，就是给自己留退路。","details":[]}]},{"id":73,"title":"把头铁当勇敢，阎王见了都得鼓掌","points":[{"text":"莽夫的下场：动不动就要跟人拼命、硬碰硬较劲（勇于敢），老子冷冷送你一个字——死（杀）；","details":[]},{"text":"真正的高维勇敢（勇于不敢）：有能力动手，却能克制住冲动、选择隐忍沉潜（勇于不敢），这才是保命通关的顶级大勇。","details":[]},{"text":"宇宙算法的精密：规律不用跟你吵架，自然能赢（不争而善胜）；它不发声，却处处有回响（不言而善应）。","details":[]},{"text":"言哥心法：克制比放纵需要更大的勇气。别急着用蛮力去证明自己，天道自有一套严密的算力网（天网恢恢，疏而不失）。","details":[]}]},{"id":74,"title":"抢着当刽子手，早晚砍掉自己的爪子","points":[{"text":"越俎代庖的作死鬼：天道自然有它的清理与淘汰机制（司杀者）。总有人自命不凡，想亲自充当天道去替天行道、整人害人。","details":[]},{"text":"木匠劈木头的警示：不懂木工却硬要抢大木匠的斧头去砍木头（代大匠斲），十个里面有九个半会当场把自己的手指头剁下来（希有不伤其手矣）！","details":[]},{"text":"言哥心法：戒掉裁决别人的执念。因果与规律自会清算一切，别把自己搭进去当那个倒霉的执行工具人。","details":[]}]},{"id":75,"title":"剥削到连草根都没得吃，还怪员工爱摆烂","points":[{"text":"甩锅型管理层的丑态：","details":["老板税收抽成太狠，大家吃不饱饭，还怪团队战斗力弱（食税之多是以饥）；","管理层天天瞎折腾、乱立规矩，导致项目鸡飞狗跳，还怪员工不服管（上之有为是以难治）。"]},{"text":"言哥心法：不过度把精力押注在名利享乐上（无以生为），反而比那些天天贪生怕死、焦虑算计的人（贵生）活得更加通透从容。","details":[]}]},{"id":76,"title":"人活着是软的，只有死尸才是硬邦邦的","points":[{"text":"硬汉人设的大翻车：人活着的时候身体是温软有弹性的，死了才浑身僵硬像块石头；小树活着时枝条柔嫩，干枯死了才又硬又脆。","details":[]},{"text":"脆断警告：自诩坚硬刚强、寸步不让的，老子直接把你归类进“死人预备役（死之徒）”！狂风一来，最粗最硬的树干一定最先折断（木强则折）。","details":[]},{"text":"言哥心法：柔软才是最高级的生命力。遇到外界重压，学会顺势弯曲卸力，保住弹性，你永远能反弹回来。","details":[]}]},{"id":77,"title":"宇宙在劫富济贫，凡人却在拼命内卷","points":[{"text":"马太效应的人间荒谬：","details":["自然规律（天之道）就像拉弓射箭——高了就压低点，低了就抬高点，劫富济贫、削平多余来补齐不足；","人间社会却反着来（人之道）——剥削穷人的口粮去巴结大富豪（损不足以奉有余）。"]},{"text":"格局破局点：谁能把自己的溢出价值拿去回馈系统？唯有真正悟道的大格局者（孰能有余以奉天下）。","details":[]},{"text":"言哥心法：事情做成后别贪恋名利光环（功成而不处）。懂得分享和让利，系统的正向反馈才会源源不断流回你身上。","details":[]}]},{"id":78,"title":"天下第一软妹，拥有摧毁一切的降维战力","points":[{"text":"认知上的巨婴，行动上的矮子：大家都知道水最柔弱却无坚不摧，道理懂了一大堆，一到现实里还是天天急着跟人硬撕（天下莫不知，莫能行）。","details":[]},{"text":"真领袖的背锅力：","details":["能扛得住全天下的污名与脏水（受国之垢），才配当国家的主人；","能承受得住最大的灾难与风险（受国不祥），才配做真正的王者。"]},{"text":"言哥心法：能享受多大的掌声，就得耐得住多脏的泥泞。顶级的抗压与包容力，才是通向核心主控权的唯一门票。","details":[]}]},{"id":79,"title":"烂账怎么修都是烂账，不如握着欠条不逼债","points":[{"text":"调解老好人的幻想：双方结下了血海深仇，非要强行把两个人拉到一起握手言和，表面和气，背后依然藏着暗箭（和大怨，必有余怨）。","details":[]},{"text":"顶级体面人的姿态：","details":["手里明明握着对方欠钱的借据合同（执左契），但从不天天上门逼债、撕破脸皮（不责于人）；","守住契约是自己的修养，追不追责看的是格局。"]},{"text":"言哥心法：天道从来不偏袒任何人，但它永远会把最好的势能奖赏给行事体面、遵守规则的善人（天道无亲，常与善人）。","details":[]}]},{"id":80,"title":"拒绝无意义的跨圈内卷，守好自己的小日子","points":[{"text":"老子的终极数字断联乌托邦：","details":["你们天天跨圈社交、盲目扩张，最后累得跟狗一样；","老子画了个终极理想国：饭吃得香甜（甘其食），衣服穿得舒服（美其服），房子住得踏实（安其居），生活过得自得其乐（乐其俗）。"]},{"text":"不相往来的真意：不是让你闭关锁国当野人，而是各自守好自己的能量场，不搞攀比、不瞎折腾、不打扰彼此的生活节奏。","details":[]},{"text":"言哥心法：圈子不用太大，把身边的基本盘照顾好。吃好睡好，内心丰盈，比天天在名利场上奔波高级一万倍。","details":[]}]},{"id":81,"title":"老子的剧终谢幕词——真理不花哨，能处别瞎争","points":[{"text":"老子全书剧终大招，连甩五记耳光：","details":["信言不美，美言不信：听着顺耳的花言巧语，十句有九句是忽悠；真正管用的真理往往朴素扎心。","善者不辩，辩者不善：真正靠谱的人闷头干实事，天天在网上跟人对线吵架的，没一个有真本事。","知者不博，博者不知：通透的人抓住底层一两个核心规律，天天到处显摆自己什么都懂的人，其实样样稀松。","越分享越富有（既以为人己愈有）：不要死守着存量不放，全力去赋能别人，你的生态和算力反而无限膨胀。","全书终极总结：自然规律滋养万物而不搞破坏（利而不害）；高手全力去创造、去作为，但从不与人做无谓的消耗与争夺（为而不争）！"]},{"text":"言哥心法：认清底层规律，关掉无谓内耗，放软身段蓄力，不与破事纠缠，把能量全部拿去创造真实的价值（为而不争）。","details":[]}]}]</script>

    { id: 'vol2', name: '若水', title: '水系处世与柔弱不争', sub: '像水一样，柔软却有力量', chapters: [7, 8, 34, 36, 61, 68, 69, 73, 76, 78, 79], dur: 1093 },
    { id: 'vol3', name: '留白', title: '留白空间与欲望断舍离', sub: '少一点，反而够了', chapters: [9, 11, 15, 19, 29, 33, 45, 46, 59, 67, 80], dur: 1159 },
    { id: 'vol4', name: '规律', title: '底层规律与逆向思维', sub: '看懂事物反着走的那条路', chapters: [1, 2, 4, 6, 14, 21, 25, 32, 35, 37, 39, 40, 41, 62, 63, 64], dur: 1254 },
    { id: 'vol5', name: '格局', title: '高维格局与人际治理', sub: '站高一点，看人，也看事', chapters: [3, 13, 17, 18, 23, 24, 26, 27, 28, 30, 31, 38, 42, 43, 44, 48, 49, 50, 51, 53, 54, 57, 58, 60, 65, 66, 70, 72, 74, 75, 77, 81], dur: 1226 },
  ];
  topics.forEach((t, i) => { t.vol = i ? `第${'零一二三四五'[i]}卷` : '开篇'; t.audio = `audio/${t.id}.m4a`; });
  const topicOf = {};
  topics.forEach(t => t.chapters.forEach(id => { topicOf[id] = t; }));
  const DRESSES = [
    { cls: 's-a', name: '竹简' },
    { cls: 's-b', name: '朱丝栏' },
    { cls: 's-c', name: '夜读' },
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem('weiran.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('weiran.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const state = {
    view: 'today', chapterId: null, topicId: null, query: '',
    tone: store.get('tone', 'gentle'),
    dress: store.get('dress', 1),
    scale: store.get('scale', 0),
    favs: new Set(store.get('favs', [])),
    speed: store.get('speed', 1),
  };

  const NUM = '零一二三四五六七八九';
  function cnum(n) {
    if (n < 10) return NUM[n];
    if (n < 20) return '十' + (n % 10 ? NUM[n % 10] : '');
    return NUM[Math.floor(n / 10)] + '十' + (n % 10 ? NUM[n % 10] : '');
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const dou = s => esc(s).replace(/([，。；：！？、])/g, '<i class="dou">$1</i>');
  function clauses(text) { return text.match(/[^，。；：！？]+[，。；：！？]?/g) || [text]; }
  function slipsOf(text) {
    const out = [];
    for (const c of clauses(text)) {
      for (let i = 0; i < c.length; i += 12) out.push(c.slice(i, i + 12));
    }
    return out;
  }
  function sentences(text) { return text.match(/[^。；！？]+[。；！？]?/g) || [text]; }

  function todayChapter() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const day = Math.floor((now - start) / 86400000);
    return byId[(day % 81) + 1];
  }
  function dateLine() {
    const d = new Date();
    const wk = '日一二三四五六'[d.getDay()];
    return `${cnum(d.getMonth() + 1)}月${d.getDate() <= 10 ? '初' + cnum(d.getDate()) : cnum(d.getDate())}日 · 星期${wk}`;
  }
  function pickSituations(n) {
    const pool = [];
    chapters.forEach(c => c.situations.forEach(s => pool.push([s, c.id])));
    const seed = new Date().getDate();
    const out = [];
    for (let i = 0; i < n; i++) out.push(pool[(seed * 37 + i * 101) % pool.length]);
    return out;
  }

  function applyDress() {
    document.body.classList.remove('s-a', 's-b', 's-c');
    document.body.classList.add(DRESSES[state.dress].cls);
    document.documentElement.style.setProperty('--fs', (18 + state.scale * 2) + 'px');
    // 在 App 里顺便把系统状态栏、导航栏染成同色
    const bars = [['#F1E8D6', true], ['#F4F1EA', true], ['#121417', false]][state.dress];
    try { window.Weiran && window.Weiran.setBars(bars[0], bars[1]); } catch (e) {}
  }
  function dressBtn() {
    return `<button class="dress" data-act="dress">装帧 <b>${DRESSES[state.dress].name}</b> · 换</button>`;
  }

  function viewToday() {
    const c = todayChapter();
    const sit = pickSituations(4);
    return `
      <div class="head-painting" aria-hidden="true">
        <canvas id="head-canvas"></canvas>
        <div class="fog f1"></div><div class="fog f2"></div>
      </div>
      <div class="topbar over"><span>未然</span>${dressBtn()}</div>
      <section class="hero">
        <div>
          <div class="hero-date">${dateLine()}</div>
          <h1 class="hero-hi">${WHO ? esc(WHO) + "，" : ""}今天读第${cnum(c.id)}章。</h1>
        </div>
        <div class="hero-name" aria-hidden="true">未然</div>
      </section>
      <article class="today">
        <div class="today-head"><span class="seal">${cnum(c.id)}</span><span>${esc(c.title)}</span></div>
        <p class="today-quote">${dou(c.excerpt)}</p>
        <button class="btn-ink" data-open="${c.id}">读这一章</button>
      </article>
      <div class="section-label">今天只做一步</div>
      <p class="step-line">${esc(c.step)}</p>
      <div class="section-label">按心事找</div>
      <div class="chips">${sit.map(([s, id]) => `<button class="chip" data-open="${id}">${esc(s)}</button>`).join('')}</div>
      <div class="dedication"><button data-act="dedic">深海基地全员 赠 ›</button></div>`;
  }

  function matches(c, q) {
    if (!q) return true;
    const hay = [c.title, c.original, c.translation, c.themes.join(' '), c.keywords.join(' '), c.situations.join(' '), cnum(c.id), String(c.id)].join(' ');
    return hay.includes(q);
  }
  function viewToc(onlyFav) {
    const list = chapters.filter(c => (!onlyFav || state.favs.has(c.id)) && matches(c, state.query.trim()));
    const title = onlyFav ? '收藏' : '目录';
    const sub = onlyFav ? '读到心里的章节，都在这里。' : '八十一章。可以搜字，也可以搜心事，比如"焦虑""比较"。';
    const body = list.length
      ? `<ul class="toc">${list.map(c => `<li><button data-open="${c.id}"><span class="num">第${cnum(c.id)}章${state.favs.has(c.id) ? ' <span class="fav-dot">●</span>' : ''}</span><span class="ttl">${esc(c.title)}</span></button></li>`).join('')}</ul>`
      : `<p class="empty">${onlyFav ? '还没有收藏。读章节时点右上角的"藏"。' : '没找到。换个词试试。'}</p>`;
    return `
      <div class="topbar"><span>未然</span>${dressBtn()}</div>
      <h1 class="page-title">${title}</h1>
      <p class="page-sub">${sub}</p>
      ${onlyFav ? '' : `<input class="search" id="search" type="search" placeholder="搜一个字，或一件心事" value="${esc(state.query)}" autocomplete="off">`}
      <div id="toc-list">${body}</div>`;
  }

  function originalBlock(c) {
    if (state.dress === 0) {
      return `<div class="slips-wrap"><div class="slips">${slipsOf(c.original).map(s => `<div class="slip">${dou(s)}</div>`).join('')}</div></div>`;
    }
    if (state.dress === 1) {
      return `<div class="zhusi-wrap"><div class="zhusi">${dou(c.original)}</div></div>
        <div class="banxin"><span>未然</span><span>第${cnum(c.id)}章</span></div>`;
    }
    return `<div class="lines">${sentences(c.original).map(s => `<p>${dou(s)}</p>`).join('')}</div>`;
  }
  function gentleBlock(c) {
    return `
      <div class="block"><h3>白话</h3><p>${esc(c.translation)}</p></div>
      <div class="block"><h3>放到此刻</h3><p>${esc(c.application)}</p></div>
      <div class="block"><h3>别把它用歪</h3><p>${esc(c.caution)}</p></div>
      <div class="block"><h3>今天只做一步</h3><p>${esc(c.step)}</p></div>
      <div class="block ask"><h3>问问自己</h3><p>${esc(c.reflection)}</p></div>`;
  }
  function sharpBlock(c) {
    const t = toxicById[c.id];
    if (!t) return '<p class="empty">这一章言哥还没来得及毒舌。</p>';
    return `
      <div class="sharp-title">${esc(t.title)}</div>
      <ul class="sharp-list">${t.points.map(p => `<li>${esc(p.text)}${p.details.length ? `<ul>${p.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}</li>`).join('')}</ul>`;
  }
  function viewChapter() {
    const c = byId[state.chapterId];
    const fav = state.favs.has(c.id);
    return `
      <div class="topbar"><button class="back" data-act="back">‹ 返回</button>${dressBtn()}</div>
      <header class="ch-head">
        <span class="seal">第${cnum(c.id)}章</span>
        <h1 class="ch-title">${esc(c.title)}</h1>
        <div class="ch-tools">
          <button class="icon-btn" data-act="smaller" aria-label="字小一点">小</button>
          <button class="icon-btn" data-act="bigger" aria-label="字大一点">大</button>
          <button class="icon-btn ${fav ? 'on' : ''}" data-act="fav" aria-pressed="${fav}">${fav ? '已藏' : '藏'}</button>
        </div>
      </header>
      ${originalBlock(c)}
      <div class="tone" role="group" aria-label="解读口吻">
        <button data-tone="gentle" aria-pressed="${state.tone === 'gentle'}">温柔</button>
        <button data-tone="sharp" aria-pressed="${state.tone === 'sharp'}">毒舌</button>
      </div>
      ${state.tone === 'gentle' ? gentleBlock(c) : sharpBlock(c)}
      ${topicOf[c.id] ? `<button class="in-topic" data-topic="${topicOf[c.id].id}">收录于 <b>${topicOf[c.id].vol}</b> · ${topicOf[c.id].title} ›</button>` : ''}
      ${c.reviewStatus !== 'reviewed' ? '<p class="draft-note">这一章的解读还是初稿，会再润色。</p>' : ''}
      <div class="pager">
        <button data-open="${c.id - 1}" ${c.id === 1 ? 'disabled' : ''}>‹ 第${cnum(Math.max(1, c.id - 1))}章</button>
        <button data-open="${c.id + 1}" ${c.id === 81 ? 'disabled' : ''}>第${cnum(Math.min(81, c.id + 1))}章 ›</button>
      </div>`;
  }

  function topicMeta(t) {
    const heard = positions[t.id] || 0;
    const mins = `约 ${Math.round(t.dur / 60)} 分钟`;
    return heard > 5 ? `${mins} · 听到 ${fmt(heard)}` : mins;
  }
  function viewTopics() {
    return `
      <div class="topbar"><span>未然</span>${dressBtn()}</div>

      ${topics.map(t => `<button class="topic" data-topic="${t.id}"><span class="t-name">${t.name}</span><span><p>${t.vol}</p><h3>${t.title}</h3><p>${t.sub}</p><p class="t-meta">${topicMeta(t)}</p></span></button>`).join('')}`;
  }
  function viewTopic() {
    const t = topics.find(x => x.id === state.topicId);
    const here = current === t.id;
    const cur = here ? audio.currentTime : (positions[t.id] || 0);
    const dur = here && isFinite(audio.duration) ? audio.duration : t.dur;
    const playing = here && !audio.paused;
    const chapterList = t.chapters.length
      ? `<div class="section-label">这一期读的章节</div>
         <ul class="toc">${t.chapters.map(id => `<li><button data-open="${id}"><span class="num">第${cnum(id)}章</span><span class="ttl">${esc(byId[id].title)}</span></button></li>`).join('')}</ul>`
      : `<div class="section-label">这一期</div><p class="step-line">从水和"无"两个意象讲起，把整本书串一遍。适合第一次听，听完再去目录里慢慢翻。</p>`;
    const player = AUDIO_ON ? `
      <div class="player">
        <button class="play" data-act="play" aria-label="${playing ? '暂停' : '播放'}" id="pp-btn">${playing ? '❚❚' : '▶'}</button>

          <input class="seek" id="pp-seek" type="range" min="0" max="${Math.round(dur)}" step="1" value="${Math.round(cur)}" aria-label="播放进度">

        </div>
        <div class="player-row">
          <button data-act="back15">退 15 秒</button>
          <button data-act="speed" id="pp-speed">${state.speed} 倍速</button>

        </div>
      </div>` : `
      <div class="player">
        <button class="play" disabled aria-label="播放">▶</button>
        <div><div class="player-title">${t.vol} · ${t.title}</div><small>网页预览不带音频，装好 App 就能听，约 ${Math.round(t.dur / 60)} 分钟。</small></div>
      </div>`;
    return `
      <div class="topbar"><button class="back" data-act="back">‹ 返回</button>${dressBtn()}</div>
      <p class="page-sub" style="margin:18px 0 0">${t.vol}</p>
      <h1 class="page-title" style="margin-top:2px">${t.title}</h1>
      <p class="page-sub">${t.sub}</p>
      ${player}

  const headImg = new Image();
  headImg.src = HEAD_SRC;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let headPlayed = false;

  function fbm(w, h) {
    const out = new Float32Array(w * h);
    let amp = 1, total = 0;
    for (const cells of [4, 9, 19, 37]) {
      const gx = cells + 2, gy = Math.ceil(cells * h / w) + 2;
      const g = new Float32Array(gx * gy);
      for (let i = 0; i < g.length; i++) g[i] = Math.random();
      for (let y = 0; y < h; y++) {
        const fy = y / w * cells, iy = fy | 0, ty = fy - iy, sy = ty * ty * (3 - 2 * ty);
        for (let x = 0; x < w; x++) {
          const fx = x / w * cells, ix = fx | 0, tx = fx - ix, sx = tx * tx * (3 - 2 * tx);
          const a = g[iy * gx + ix], b = g[iy * gx + ix + 1], c = g[(iy + 1) * gx + ix], d = g[(iy + 1) * gx + ix + 1];
          out[y * w + x] += amp * ((a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy);
        }
      }
      total += amp; amp *= 0.5;
    }
    for (let i = 0; i < out.length; i++) out[i] /= total;
    return out;
  }

  function paintHead() {
    const cv = document.getElementById('head-canvas');
    if (!cv) return;
    if (!headImg.complete || !headImg.naturalWidth) { headImg.onload = paintHead; return; }
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = Math.max(1, Math.round(rect.width * dpr)), H = Math.max(1, Math.round(rect.height * dpr));
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const draw = () => {
      const ir = headImg.naturalWidth / headImg.naturalHeight, cr = W / H;
      let sw, sh, sx, sy;
      if (ir > cr) { sh = headImg.naturalHeight; sw = sh * cr; sx = (headImg.naturalWidth - sw) / 2; sy = 0; }
      else { sw = headImg.naturalWidth; sh = sw / cr; sx = 0; sy = (headImg.naturalHeight - sh) * 0.75; }
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(headImg, sx, sy, sw, sh, 0, 0, W, H);
    };
    if (headPlayed || reducedMotion) { draw(); return; }
    headPlayed = true;
    // 动画期间按 1 倍像素算（画本来就是淡彩，看不出差别），演完再按高清重画
    const fullW = W, fullH = H;
    W = Math.max(1, Math.round(rect.width)); H = Math.max(1, Math.round(rect.height));
    cv.width = W; cv.height = H;
    draw();
    const src = ctx.getImageData(0, 0, W, H).data;
    const out = ctx.createImageData(W, H), od = out.data;
    for (let i = 0; i < src.length; i += 4) { od[i] = src[i]; od[i + 1] = src[i + 1]; od[i + 2] = src[i + 2]; od[i + 3] = 0; }
    const S = 2, w = Math.ceil(W / S), h = Math.ceil(H / S);
    const n = fbm(w, h), v = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      v[y * w + x] = n[y * w + x] * 0.55 + (1 - x / w) * 0.38 + (y / h) * 0.07;
    }
    const EDGE = 0.22, DUR = 3200;
    let elapsed = 0, last = performance.now();
    ctx.clearRect(0, 0, W, H);
    function frame(now) {
      if (!document.body.contains(cv)) return;
      elapsed += Math.min(now - last, 50);  // 慢手机上宁可演慢一点，也不跳过
      last = now;
      const t = Math.min(1, elapsed / DUR);
      const f = (t * t * (3 - 2 * t)) * (1 + EDGE) ;
      for (let y = 0; y < H; y++) {
        const row = ((y / S) | 0) * w;
        for (let x = 0; x < W; x++) {
          let a = (f - v[row + ((x / S) | 0)]) / EDGE;
          a = a <= 0 ? 0 : a >= 1 ? 1 : a * a * (3 - 2 * a);
          od[(y * W + x) * 4 + 3] = a * 255;
        }
      }
      ctx.putImageData(out, 0, 0);
      if (t < 1) requestAnimationFrame(frame);
      else { W = fullW; H = fullH; cv.width = W; cv.height = H; draw(); }
    }
    requestAnimationFrame(frame);
  }

  // ---------- 播放器：全局一个 audio，换页不中断；每期记住听到哪 ----------
  const audio = document.getElementById('audio');
  const mini = document.getElementById('mini');
  const positions = store.get('positions', {});
  let current = null, lastSave = 0;
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  }
  function savePos(force) {
    if (!current) return;
    if (!force && Date.now() - lastSave < 3000) return;
    positions[current] = audio.ended ? 0 : audio.currentTime;
    store.set('positions', positions);
    lastSave = Date.now();
  }
  function load(t) {
    if (current === t.id) return;
    savePos(true);
    current = t.id;
    audio.src = t.audio;
    audio.playbackRate = state.speed;
    const start = positions[t.id] || 0;
    audio.addEventListener('loadedmetadata', function once() {
      audio.removeEventListener('loadedmetadata', once);
      if (start > 0 && start < audio.duration - 5) audio.currentTime = start;
    });
  }
  function toggle(t) {
    load(t);
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }
  function syncPlayer() {
    const btn = document.getElementById('pp-btn');
    const here = state.view === 'topic' && state.topicId === current;
    if (btn && here) {
      btn.textContent = audio.paused ? '▶' : '❚❚';
      btn.setAttribute('aria-label', audio.paused ? '播放' : '暂停');
      const seek = document.getElementById('pp-seek');
      if (seek && document.activeElement !== seek) {
        if (isFinite(audio.duration)) seek.max = Math.round(audio.duration);
        seek.value = Math.round(audio.currentTime);
      }
      const cur = document.getElementById('pp-cur');
      if (cur) cur.textContent = fmt(audio.currentTime);
    }
    const t = topics.find(x => x.id === current);
    const showMini = !!t && !here && (!audio.paused || audio.currentTime > 0);
    mini.hidden = !showMini;
    document.body.classList.toggle('has-mini', showMini);
    if (showMini) {
      mini.innerHTML = `<div><button class="mini-title" data-topic="${t.id}">${t.vol} · ${t.title}<small>${fmt(audio.currentTime)}</small></button>
        <button class="play" data-act="mini-play" aria-label="${audio.paused ? '播放' : '暂停'}">${audio.paused ? '▶' : '❚❚'}</button></div>`;
    }
  }
  audio.addEventListener('timeupdate', () => { savePos(false); syncPlayer(); });
  audio.addEventListener('play', syncPlayer);
  audio.addEventListener('pause', () => { savePos(true); syncPlayer(); });
  audio.addEventListener('ended', () => { savePos(true); syncPlayer(); });
  document.addEventListener('input', e => {
    if (e.target.id !== 'pp-seek') return;
    const t = topics.find(x => x.id === state.topicId);
    load(t);
    audio.currentTime = +e.target.value;
    document.getElementById('pp-cur').textContent = fmt(+e.target.value);
  });

  // ---------- 献词 ----------
  const dedic = document.getElementById('dedic');
  let dedicOpen = false;
  function openDedication() {
    dedicOpen = true;
    dedic.innerHTML = `
      <div class="dedic-inner">
        <div class="dedic-to">${WHO ? "赠" + esc(WHO) : "赠你"}</div>
        <div class="dedic-text"><p>愿你知其白${'<i class="dou">，</i>'}守其黑${'<i class="dou">；</i>'}</p><p>行于世${'<i class="dou">，</i>'}有自己的山水${'<i class="dou">。</i>'}</p></div>
        <div class="dedic-sign"><span>深海基地全员</span><span class="seal">深海</span></div>
        <button class="dedic-src" data-act="dedic-src">「知其白，守其黑」出自第二十八章</button>
        <button class="btn-ink" data-act="dedic-close">翻开</button>
      </div>`;
    dedic.classList.remove('closing');
    dedic.hidden = false;
  }
  function closeDedication(then) {
    store.set('dedicated', true);
    dedic.classList.add('closing');
    setTimeout(() => {
      dedic.hidden = true;
      dedic.innerHTML = '';
      dedicOpen = false;
      if (then) then(); else if (state.view === 'today') render(false);
    }, reducedMotion ? 0 : 800);
  }

  const history = [];
  function go(view, extra) {
    history.push({ view: state.view, chapterId: state.chapterId, topicId: state.topicId });
    Object.assign(state, { view }, extra || {});
    if (view === 'chapter') store.set('last', state.chapterId);
    render(true);
  }
  function back() {
    const prev = history.pop() || { view: 'today' };
    Object.assign(state, prev);
    render(true);
  }

  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  function render(scrollTop) {
    applyDress();
    const v = state.view;
    app.innerHTML = v === 'today' ? viewToday() : v === 'toc' ? viewToc(false) : v === 'fav' ? viewToc(true)
      : v === 'chapter' ? viewChapter() : v === 'topics' ? viewTopics() : viewTopic();
    const tab = v === 'chapter' ? null : v === 'topic' ? 'topics' : v;
    tabs.innerHTML = [['today', '今日'], ['toc', '目录'], ['topics', '专题'], ['fav', '收藏']]
      .map(([k, n]) => `<button data-tab="${k}" ${tab === k ? 'aria-current="page"' : ''}>${n}</button>`).join('');
    const search = document.getElementById('search');
    if (search) search.addEventListener('input', () => {
      state.query = search.value;
      const html = viewToc(false);
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      document.getElementById('toc-list').innerHTML = tmp.querySelector('#toc-list').innerHTML;
    });
    app.classList.remove('enter');
    if (scrollTop) {
      void app.offsetWidth;
      app.classList.add('enter');
      window.scrollTo(0, 0);
    }
    if (v === 'today' && !dedicOpen) paintHead();
    syncPlayer();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('button');
    if (!el) return;
    if (el.dataset.open) { const id = +el.dataset.open; if (byId[id]) go('chapter', { chapterId: id }); return; }
    if (el.dataset.tab) { history.length = 0; Object.assign(state, { view: el.dataset.tab }); render(true); return; }
    if (el.dataset.topic) { go('topic', { topicId: el.dataset.topic }); return; }
    if (el.dataset.tone) { state.tone = el.dataset.tone; store.set('tone', state.tone); render(false); return; }
    const act = el.dataset.act;
    const topicNow = topics.find(x => x.id === state.topicId);
    if (act === 'play') { toggle(topicNow); return; }
    if (act === 'mini-play') { audio.paused ? audio.play().catch(() => {}) : audio.pause(); return; }
    if (act === 'back15' || act === 'fwd30') {
      load(topicNow);
      audio.currentTime = Math.max(0, Math.min((audio.duration || topicNow.dur) - 1, audio.currentTime + (act === 'back15' ? -15 : 30)));
      syncPlayer(); return;
    }
    if (act === 'speed') {
      const speeds = [1, 1.25, 1.5, 0.8];
      state.speed = speeds[(speeds.indexOf(state.speed) + 1) % speeds.length];
      audio.playbackRate = state.speed; store.set('speed', state.speed);
      el.textContent = `${state.speed} 倍速`; return;
    }
    if (act === 'dedic') { openDedication(); return; }
    if (act === 'dedic-close') { closeDedication(); return; }
    if (act === 'dedic-src') { closeDedication(() => go('chapter', { chapterId: 28 })); return; }
    if (act === 'back') back();
    else if (act === 'dress') { state.dress = (state.dress + 1) % DRESSES.length; store.set('dress', state.dress); render(false); }
    else if (act === 'fav') {
      const id = state.chapterId;
      state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
      store.set('favs', [...state.favs]); render(false);
    }
    else if (act === 'bigger' || act === 'smaller') {
      state.scale = Math.max(-1, Math.min(3, state.scale + (act === 'bigger' ? 1 : -1)));
      store.set('scale', state.scale); render(false);
    }
  });

  // 安卓返回键：能退就退一层，退到首页再交给系统
  window.weiranBack = function () {
    if (dedicOpen) { closeDedication(); return true; }
    if (state.view === 'today') return false;
    if (history.length) back(); else { Object.assign(state, { view: 'today' }); render(true); }
    return true;
  };
  // App 切到后台时只存进度，不停播（像听播客一样，可以锁屏听）
  window.weiranPause = function () { savePos(true); };

  if (!store.get('dedicated', false)) openDedication();
  render(true);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
