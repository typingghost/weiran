.app {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100%;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 20px calc(96px + env(safe-area-inset-bottom, 0px));
}

/* 顶栏 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  font-size: 14px;
  color: var(--ink-soft);
}
.topbar .back { padding: 8px 4px; letter-spacing: .1em; }
.dress {
  font-size: 13px;
  letter-spacing: .08em;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-soft);
}
.dress b { color: var(--seal); font-weight: 600; }

/* 印章 */
.seal {
  display: inline-grid;
  place-items: center;
  writing-mode: vertical-rl;
  font-family: var(--font-display);
  color: #fff8ee;
  background: var(--seal);
  padding: 6px 4px;
  border-radius: 3px;
  font-size: 14px;
  line-height: 1.15;
  letter-spacing: .05em;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
}

/* 头画：山水如烟洇开，上面两层雾慢慢流动 */
.head-painting {
  position: relative;
  margin: calc(-8px - env(safe-area-inset-top, 0px)) -20px 0;
  height: min(64vw, 340px);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 58%, transparent);
  mask-image: linear-gradient(to bottom, #000 58%, transparent);
}
.head-painting canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: var(--head-ink); }
body.s-c .head-painting canvas { filter: invert(.9) hue-rotate(180deg) saturate(.6); }
.fog {
  position: absolute; left: -60%; width: 220%; height: 60%;
  pointer-events: none; filter: blur(16px); opacity: 0;
  animation: fogIn 3.5s 1.4s ease forwards, drift 46s linear infinite alternate;
}
.fog.f1 {
  top: 30%;
  background:
    radial-gradient(ellipse 22% 38% at 25% 50%, rgba(var(--fog-rgb), .75), transparent 70%),
    radial-gradient(ellipse 18% 30% at 58% 62%, rgba(var(--fog-rgb), .6), transparent 70%),
    radial-gradient(ellipse 20% 34% at 85% 45%, rgba(var(--fog-rgb), .55), transparent 70%);
}
.fog.f2 {
  top: 52%;
  animation-duration: 4s, 68s;
  animation-direction: normal, alternate-reverse;
  background:
    radial-gradient(ellipse 26% 40% at 40% 50%, rgba(var(--fog-rgb), .7), transparent 70%),
    radial-gradient(ellipse 16% 28% at 75% 40%, rgba(var(--fog-rgb), .5), transparent 70%);
}
@keyframes fogIn { to { opacity: 1; } }
@keyframes drift { from { transform: translateX(-6%); } to { transform: translateX(22%); } }
.topbar.over { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 20px; right: 20px; z-index: 2; }
.head-painting + .hero { margin-top: -64px; position: relative; }
.app.enter > * { animation: inkIn .5s ease both; }
@keyframes inkIn { from { opacity: 0; filter: blur(3px); transform: translateY(6px); } to { opacity: 1; filter: none; transform: none; } }

/* 今日 */
.hero {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  padding-block: 28px 20px;
}
.hero-date { font-size: 14px; color: var(--ink-soft); letter-spacing: .12em; }
.hero-hi { font-family: var(--font-display); font-size: 30px; line-height: 1.4; margin: 6px 0 0; text-wrap: balance; }
.hero-name {
  writing-mode: vertical-rl;
  font-family: var(--font-display);
  font-size: 46px;
  line-height: 1;
  letter-spacing: .2em;
  color: var(--ink);
  border-left: 1px solid var(--line);
  padding-left: 12px;
}
.today {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 22px 20px 20px;
  display: grid;
  gap: 14px;
}
.today-head { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-size: 14px; letter-spacing: .1em; }
.today-quote { font-family: var(--font-display); font-size: 24px; line-height: 1.7; margin: 0; text-wrap: balance; }
.btn-ink {
  justify-self: start;
  padding: 10px 22px;
  background: var(--ink);
  color: var(--bg);
  letter-spacing: .2em;
  font-size: 15px;
  border-radius: 2px;
}
.section-label {
  font-size: 13px;
  letter-spacing: .3em;
  color: var(--seal);
  margin: 30px 0 10px;
}
.step-line { margin: 0; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 14px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  background: var(--paper);
  text-align: left;
  line-height: 1.5;
}
.dedication { margin-top: 36px; font-size: 13px; color: var(--ink-soft); letter-spacing: .15em; text-align: right; }

/* 目录 */
.page-title { font-family: var(--font-display); font-size: 30px; margin: 20px 0 4px; font-weight: 400; }
.page-sub { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }
.search {
  width: 100%;
  font: inherit;
  font-size: 16px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 2px;
}
.search::placeholder { color: var(--ink-soft); }
.toc { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.toc button {
  width: 100%;
  min-height: 74px;
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 10px 8px;
  display: grid;
  gap: 2px;
  text-align: center;
}
.toc .num { font-size: 12px; color: var(--seal); letter-spacing: .1em; }
.toc .ttl { font-family: var(--font-display); font-size: 18px; line-height: 1.3; }
.toc .fav-dot { color: var(--seal); }
.empty { color: var(--ink-soft); font-size: 15px; padding: 24px 0; }

/* 章节 */
.ch-head { display: flex; align-items: flex-start; gap: 14px; padding-block: 18px 6px; }
.ch-title { font-family: var(--font-display); font-size: 34px; line-height: 1.2; margin: 0; font-weight: 400; flex: 1; }
.ch-tools { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  min-width: 38px; height: 38px;
  border: 1px solid var(--line);
  border-radius: 2px;
  font-size: 15px;
  color: var(--ink-soft);
  padding: 0 8px;
}
.icon-btn.on { color: var(--seal); border-color: var(--seal); }
.dou { color: var(--seal); font-style: normal; }

/* A：竹简 */
.slips-wrap { margin: 18px -20px 8px; padding: 0 20px; overflow-x: auto; direction: rtl; scrollbar-width: none; }
.slips-wrap::-webkit-scrollbar { display: none; }
.slips { display: inline-flex; gap: 3px; padding: 18px 0; position: relative; }
.slips::before, .slips::after {
  content: ""; position: absolute; left: 0; right: 0; height: 2px;
  background: #7a5a32; opacity: .55;
}
.slips::before { top: 30%; }
.slips::after { top: 72%; }
.slip {
  writing-mode: vertical-rl;
  height: calc(var(--fs) * 1.25 * 12 + 36px);
  padding: 18px 6px;
  font-size: calc(var(--fs) * 1.15);
  line-height: 1.6;
  letter-spacing: .12em;
  color: #2a1d10;
  background:
    linear-gradient(90deg, rgba(0,0,0,.10), transparent 18%, transparent 82%, rgba(0,0,0,.12)),
    linear-gradient(180deg, var(--slip-a), var(--slip-b));
  border-radius: 2px;
  direction: ltr;
}
.slip .dou { color: #8c2a1c; }

/* B：朱丝栏 */
.zhusi-wrap { margin: 18px 0 8px; overflow-x: auto; direction: rtl; border: 3px double var(--rule); background: var(--paper); }
.zhusi {
  --col: calc(var(--fs) * 2.4);
  writing-mode: vertical-rl;
  direction: ltr;
  height: calc(var(--fs) * 1.2 * 13);
  line-height: var(--col);
  font-size: calc(var(--fs) * 1.15);
  letter-spacing: .14em;
  padding: 14px 0;
  background-image: repeating-linear-gradient(to left, transparent 0, transparent calc(var(--col) - 1px), var(--rule) calc(var(--col) - 1px), var(--rule) var(--col));
  min-width: 100%;
}
.banxin { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); letter-spacing: .3em; margin-top: 6px; }

/* C：夜读 */
.lines { margin: 22px 0 8px; display: grid; gap: 10px; }
.lines p { margin: 0; font-size: calc(var(--fs) * 1.3); line-height: 1.7; letter-spacing: .06em; text-wrap: balance; }

/* 解读 */
.tone { display: inline-flex; border: 1px solid var(--line); margin: 22px 0 6px; border-radius: 2px; overflow: hidden; }
.tone button { padding: 8px 18px; font-size: 15px; letter-spacing: .15em; color: var(--ink-soft); }
.tone button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.block { margin-top: 22px; }
.block h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .3em; color: var(--seal); font-weight: 600; }
.block p { margin: 0; }
.block.ask p { font-family: var(--font-display); font-size: 21px; line-height: 1.6; }
.sharp-title { font-family: var(--font-display); font-size: 22px; line-height: 1.5; margin: 20px 0 6px; }
.sharp-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.sharp-list li { padding-left: 14px; border-left: 2px solid var(--line); }
.sharp-list ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-soft); font-size: .92em; }
.draft-note { margin-top: 26px; font-size: 12px; color: var(--ink-soft); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 34px; }
.pager button { padding: 12px; border: 1px solid var(--line); font-size: 15px; letter-spacing: .1em; }
.pager button:last-child { text-align: right; }
.pager button:disabled { opacity: .35; }

/* 专题 */
.topic {
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
  align-items: center;
  padding: 18px 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  margin-bottom: 10px;
}
.topic .t-name { writing-mode: vertical-rl; font-family: var(--font-display); font-size: 26px; letter-spacing: .1em; line-height: 1.1; color: var(--seal); }
.topic h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.topic p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
.player {
  margin: 20px 0 8px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
  align-items: center;
  padding: 18px;
  border: 1px solid var(--line);
  background: var(--paper);
}
.play {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font-size: 20px;
}
.play[disabled] { opacity: .35; cursor: default; }
.player small { color: var(--ink-soft); font-size: 13px; }
.player-title { font-family: var(--font-display); font-size: 18px; line-height: 1.4; }
.seek { width: 100%; margin: 10px 0 2px; accent-color: var(--seal); }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.player-row { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; }
.player-row button { flex: 1; padding: 8px 0; border: 1px solid var(--line); font-size: 14px; letter-spacing: .08em; color: var(--ink-soft); }
.topic .t-meta { color: var(--seal); }
.in-topic { display: inline-block; margin-top: 24px; font-size: 14px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); }
.in-topic b { color: var(--seal); font-weight: 600; }

/* 献词：第一次打开时出现，今日页底部可以再翻出来 */
/* [hidden] 必须真的隐藏：.dedic 等元素自己设了 display，会盖掉浏览器默认的 hidden（v0.3.1 第二次打开空白就是这个原因） */

  position: fixed; inset: 0; z-index: 20;

  overflow: auto;
  transition: opacity .8s ease;

.dedic-inner { position: relative; display: grid; justify-items: center; gap: 26px; }
.dedic-inner > * { animation: inkIn 1.2s ease both; }
.dedic-to { font-family: var(--font-display); font-size: 17px; letter-spacing: .6em; color: var(--seal); animation-delay: .2s; }
.dedic-text { display: flex; flex-direction: row-reverse; gap: 0; animation: none; }
.dedic-text p {
  writing-mode: vertical-rl;
  margin: 0;
  padding: 18px 10px;
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 1.6;
  letter-spacing: .28em;
  border-left: 1px solid var(--rule);
  animation: inkIn 1.6s ease both;
}
/* 澈哥建议：竖排里的红标点收小一点，更像古籍的句读 */
.dedic-text .dou, .zhusi .dou, .slip .dou { font-size: .62em; opacity: .8; }
.dedic-text p:first-child { border-right: 1px solid var(--rule); animation-delay: .9s; }
.dedic-text p:last-child { animation-delay: 2.1s; }
.dedic-sign { display: flex; align-items: center; gap: 10px; font-size: 15px; letter-spacing: .35em; color: var(--ink-soft); animation-delay: 3.2s; }
.dedic-sign .seal { font-size: 12px; padding: 5px 3px; }
.dedic-src { font-size: 12px; color: var(--ink-soft); letter-spacing: .1em; border-bottom: 1px solid var(--line); animation-delay: 3.6s; }
.dedic .btn-ink { justify-self: center; animation-delay: 3.9s; }
.dedication button { color: inherit; letter-spacing: inherit; font-size: inherit; }

/* 迷你播放条：离开专题页也能接着听 */
.mini {
  position: fixed; left: 0; right: 0;
  bottom: calc(50px + env(safe-area-inset-bottom, 0px));
  z-index: 6;
  background: var(--paper);
  border-top: 1px solid var(--line);
}
.mini > div { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px 20px; }
.mini .mini-title { flex: 1; min-width: 0; text-align: left; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .mini-title small { color: var(--ink-soft); margin-left: 6px; font-variant-numeric: tabular-nums; }
.mini .play { width: 38px; height: 38px; font-size: 14px; flex: none; }
body.has-mini .app { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }

/* 底部 */
.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--tab-bg);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 5;
}
.tabs nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { padding: 10px 0 12px; font-size: 15px; letter-spacing: .3em; color: var(--ink-soft); }
.tabs button[aria-current="page"] { color: var(--seal); }
.tabs button span { display: block; font-size: 10px; letter-spacing: .1em; opacity: .7; }

@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
  .dedic-inner > *, .dedic-text p { animation: none; }
  .fog { animation: fogIn .01s forwards; }
  .app.enter > * { animation: none; }
}

@media (min-width: 700px) {
  .app, .mini > div, .tabs nav { max-width: 600px; }
  html { zoom: 1.15; }
}
</style>

<div class="mist-bg" aria-hidden="true"></div>
</head><body>
<div class="app" id="app"></div>
<div class="dedic" id="dedic" hidden></div>
<audio id="audio" preload="metadata"></audio>

<script type="application/json" id="chapters-data">[{"id":1,"title":"道可道","original":"道可道，非常道。名可名，非常名。无名天地之始；有名万物之母。故常无欲，以观其妙；常有欲，以观其徼。此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。","translation":"能被说清的道理，就不是那条恒常的道。能被叫准的名字，也不是那个恒常的名字。天地开始的时候，还没有名字；有了名字，万物才一样样显形。所以试着放空心里的想要，去看事物最初的妙处；带着心里的想要，去看它们彼此的边界。这两种看法来自同一个地方，只是名字不同，都很深。深而又深，是一切奇妙的大门。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"道可道，非常道；名可名，非常名。","application":"能说清的，只是此刻握住的一小部分。面对复杂的事，先给判断留一条缝，别急着用一个名字封死它。","caution":"留白不等于含糊。该说明的事实和责任，仍然要说清。","step":"把困扰你的事分成“我知道的”和“我猜的”两栏。","themes":["言语的边界","看待方式"],"keywords":["说不清","定义","命名","视角","放下评判","开始"],"situations":["心里有一种感觉，怎么描述都不像","给一件事下结论时总觉得少了什么","想换个角度看一个人或一段关系"],"reflection":"此刻困扰你的事，如果先不急着给它命名，它会变成什么样？","reviewStatus":"reviewed"},{"id":2,"title":"天下皆知","original":"天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。故有无相生，难易相成，长短相较，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教。万物作焉而不辞，生而不有，为而不恃，功成而弗居。夫唯弗居，是以不去。","translation":"天下人都说这样才算美，丑就跟着来了；都认定这样才算善，不善也就现形了。有和无互相生出对方，难和易互相成就，长和短互相比出来，高和低互相依靠，声音和音律应和着，前和后连在一起。所以懂得道的人做事不强扭，教人不靠说教。让万物自己生长，不替它们做主；生了不占有，做了不自恃，成了不居功。正因为不占着，那份功劳反而不会离开他。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"有无相生，难易相成，长短相较。","application":"许多判断依靠比较才成立。眼前的难，也可能正在训练一种以后会变轻松的能力。","caution":"承认两面，并不等于取消原则；不居功也不等于抹掉自己的劳动。","step":"为当前难题写下一件它正在悄悄带来的能力。","themes":["比较心","不居功","无为"],"keywords":["比较","标准","对立","放手","成就感","不计较"],"situations":["总在跟别人比，越比越焦虑","帮了忙却没被感谢，心里不平","团队里非要争个谁对谁错"],"reflection":"如果把'必须比出高低'的那把尺子先放一放，你眼前的事还剩下什么？","reviewStatus":"reviewed"},{"id":3,"title":"不见可欲","original":"不尚贤，使民不争；不贵难得之货，使民不为盗；不见可欲，使民心不乱。是以圣人之治，虚其心，实其腹，弱其志，强其骨。常使民无知无欲，使夫智者不敢为也。为无为，则无不治。","translation":"不把某些人捧得太高，大家就不去争抢名声；不把稀罕东西看得太贵重，人们就不会起贪念；不炫耀引人眼馋的东西，心就不乱。所以懂得道的人安顿自己的方式是：让心宽松些，让肚子踏实些，把争胜的念头放软，把身体养结实。始终不让那些机巧和欲望牵着走，连自作聪明的人也没法搅动什么。用'不强求'的方式去做事，反而没有做不好的。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"不见可欲，使民心不乱。","application":"心乱有时不是意志不够强，而是眼前不断有人替你制造“还不够”的感觉。先把诱惑挪远，心才有地方落下。","caution":"减少刺激不是逃避生活，也不是把所有愿望都说成贪心。真正需要的仍值得认真争取。","step":"把一个让你反复比较的入口静音一天，看看身体会不会松一点。","themes":["欲望管理","内在安定"],"keywords":["攀比","诱惑","物欲","踏实","知足","定力"],"situations":["刷到别人的生活，觉得自己过得不好","购物车里堆了很多想要又不必要的东西","被'应该更努力'的声音推着跑，很累"],"reflection":"今天让你心痒的那个东西，是你真的需要，还是它显得耀眼？","reviewStatus":"reviewed"},{"id":4,"title":"道冲","original":"道冲而用之或不盈。渊兮似万物之宗。挫其锐，解其纷，和其光，同其尘。湛兮似或存。吾不知谁之子，象帝之先。","translation":"道像是空的，怎么用都不会满溢出来。深得像是一切事物的来处。它磨掉锋芒，解开纠缠，收敛光芒，混同于尘土。看起来若有若无，却又确实在那里。不知道它是谁的孩子，只知道它在天帝出现之前就已经存在了。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"挫其锐，解其纷，和其光，同其尘。","application":"锋芒收一点，并不会让能力消失；反而能把原本用来证明自己的力气，拿去真正解开纠缠。","caution":"藏锋不是装弱，也不是在需要发声时沉默。它只是让表达不必靠刺伤别人来成立。","step":"把准备反驳的一段话删掉最尖的一句，再看核心意思还在不在。","themes":["留白","藏锋"],"keywords":["空","容纳","锋芒","低调","融合","深不可测"],"situations":["总想把话说满、把事做绝，事后又后悔","有点成绩就忍不住想让所有人都知道","跟人争论时锋芒太露，伤了关系"],"reflection":"如果给自己留三分余地，这件事会有什么不同的走向？","reviewStatus":"reviewed"},{"id":5,"title":"天地不仁","original":"天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。天地之间，其犹橐龠乎？虚而不屈，动而愈出。多言数穷，不如守中。","translation":"天地不偏心，把万物当作祭祀用的草扎狗一样，任其自然荣枯；懂得道的人也不偏爱，让人们各自生活。天地之间，不正像一个大风箱吗？里面是空的，却怎么拉都有风，越动越出。话说得太多、算计得太满，反而把自己逼进死角；不如守住那个安静的中心。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"多言数穷，不如守中。","application":"世界不总按人的委屈分配答案。情绪最响的时候少补一句，让心里的风箱先停下来，常比继续解释更有用。","caution":"“天地不仁”不是叫人冷酷。它提醒的是别把自己的愿望当成天地必须履行的偏爱。","step":"今天一场争论里，少说最后那句，把重要事实留到心平气和时再谈。","themes":["公平","少说多做","守中"],"keywords":["偏心","公平感","沉默","内耗","风箱","中正"],"situations":["觉得世界不公平，\"为什么偏偏是我\"","话赶话说太多，反而把关系说僵","脑子里计划一堆，越想越乱"],"reflection":"此刻最想说的那句话，如果先咽回去半天，事情会怎样？","reviewStatus":"reviewed"},{"id":6,"title":"谷神不死","original":"谷神不死，是谓玄牝。玄牝之门，是谓天地根。绵绵若存，用之不勤。","translation":"山谷般的神韵不会消亡，这叫幽深的母性。那扇幽深的门，是天地的根。它细细绵绵、若有若无地一直在那里，怎么用都不会枯竭。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"绵绵若存，用之不勤。","application":"真正持久的力量不总是咬牙撑住。像山谷一样能接纳、能休息，生命力才不会在一次用力里耗尽。","caution":"柔软不是没有边界，滋养别人也不意味着永远把自己排在最后。","step":"给今天留出二十分钟，不解决问题，只让身体慢慢松下来。","themes":["柔韧","滋养"],"keywords":["包容","柔软","持久","生命力","休息","恢复"],"situations":["把自己绷得太紧，快要耗尽了","想学会温柔而有力量地活着","照顾别人太久，忘了照顾自己"],"reflection":"你上一次让自己真正歇口气，是什么时候？","reviewStatus":"reviewed"},{"id":7,"title":"天长地久","original":"天长地久。天地所以能长且久者，以其不自生，故能长生。是以圣人后其身而身先，外其身而身存。非以其无私邪？故能成其私。","translation":"天长久，地久远。天地之所以能长久，是因为它们不只为自己运转，反而得以长久。所以懂得道的人把自己放在后面，反而站到了前面；把自己置之度外，反而保全了自己。这不正是因为他不惦记自己吗？结果反而成就了他自己。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"后其身而身先，外其身而身存。","application":"不把自己放在每件事的正中央，视野反而会宽一点。有些长久来自让关系和事情先呼吸。","caution":"无私不是长期牺牲，更不是默认别人可以越过你的边界。","step":"今天把一件不必亲自掌控的小事交出去，同时说清结果和边界。","themes":["无私","先后之间"],"keywords":["退让","格局","得失","利他","长久","位置"],"situations":["事事抢在前头，累且不被感激","纠结要不要在关系里先低头","怕吃亏，什么都想攥在手里"],"reflection":"这件让你紧抓不放的事，松开一点手，你会失去什么，又可能得到什么？","reviewStatus":"reviewed"},{"id":8,"title":"上善若水","original":"上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。夫唯不争，故无尤。","translation":"最高的善像水。水善于帮助万物却不争功，待在众人不愿待的低处，所以最接近道。住要像水那样择低而安，心要像深渊那样沉静，相处要心存善意，说话要有信用，处事要有条理，做事要尽所能，行动要看时机。正因为不争，才没有什么可埋怨的。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"水善利万物而不争，处众人之所恶。","application":"水不抢舞台，却能抵达低处、滋养万物。真正稳的力量，常常不靠声量证明自己。","caution":"不争不是任人挤压；水也会绕开石头、守住方向，积蓄成河。","step":"今天少争一次口头输赢，把力气用在推进真正想要的结果。","themes":["如水处世","不争"],"keywords":["柔软","低姿态","信用","时机","包容","怨气"],"situations":["跟人较劲，赢了道理输了心情","觉得委屈，付出没有被看见","想知道什么时候该进、什么时候该退"],"reflection":"这件事里，你是在'争对错'，还是在'解决问题'？","reviewStatus":"reviewed"},{"id":9,"title":"持而盈之","original":"持而盈之，不如其已；揣而锐之，不可长保。金玉满堂，莫之能守；富贵而骄，自遗其咎。功遂身退，天之道也。","translation":"杯子已经满了还继续倒，不如就此停手；锥子磨得太尖，锋刃保持不了多久。满屋子金玉，守不住的；富贵了还骄横，是自己给自己埋祸根。事情办成之后收一收锋头，这才是天的法则。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"持而盈之，不如其已；功遂身退，天之道。","application":"装得太满、磨得太利，都难长久。完成之后懂得收手，才能给下一件事留下空间。","caution":"适时收手和半途而废，隔着“是否已经完成”的距离。","step":"停掉一件已经超过收益拐点、只因舍不得而继续的事。","themes":["适可而止","急流勇退"],"keywords":["贪多","锋芒","骄傲","收尾","分寸","圆满"],"situations":["项目快收尾了还想再加功能，迟迟不敢交付","顺境里飘了，说了过头的话","囤积太多，反而被拥有之物拖累"],"reflection":"现在正在推进的这件事，它的'够了'在哪里？","reviewStatus":"reviewed"},{"id":10,"title":"载营魄抱一","original":"载营魄抱一，能无离乎？专气致柔，能婴儿乎？涤除玄览，能无疵乎？爱民治国，能无为乎？天门开阖，能为雌乎？明白四达，能无知乎？生之畜之，生而不有，为而不恃，长而不宰，是谓玄德。","translation":"让精神和身体合而为一，能不散开吗？聚拢气息变得柔软，能像婴儿吗？擦干净心里那面深镜，能没有瑕疵吗？爱护人、治理事，能不强加干预吗？感官开开合合，能守住安静吗？明白通透，还能不自作聪明吗？生养它、培育它，生了不占有，做了不自恃，领着它却不主宰——这就是最深的美德。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"生之畜之，生而不有，为而不恃，长而不宰。","application":"照料一件事或一个人，不一定要把它变成自己的作品。真正的培育，会给成长留下自己的方向。","caution":"不主宰不是放任。该提供的保护、资源和清楚边界，仍然是照料的一部分。","step":"给一个你正在帮助的人多留一个选择，让他自己决定下一步。","themes":["身心合一","不自恃"],"keywords":["专注","柔软","自省","克制","婴儿","养育"],"situations":["身心分离地忙碌，不知道自己在干嘛","懂很多道理，忍不住对人指手画脚","想找回内心那种干净安静的状态"],"reflection":"今天的你，身体和心在同一个地方吗？","reviewStatus":"reviewed"},{"id":11,"title":"无之为用","original":"三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。","translation":"三十根车辐汇聚在一个车毂上，正因为中间有空处，才有车轮转动的作用。揉捏陶土做成器皿，正因为器皿内部是空的，才有盛装物品的作用。开凿门窗建造房屋，正因为屋内留有空间，才有居住的作用。所以，“有”给人带来了便利条件，而“无”才真正发挥了它的效用。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"故有之以为利，无之以为用。","application":"日程排得太满，思考就没有容身之处。生活里那些没被安排塞满的“空白”，才是支撑整个系统平稳运转的轴心。","caution":"留白是为了更好地蓄力和使用，不能拿“无为”当作不做准备、拖延懒散的挡箭牌。","step":"在今天的日历上划出半小时完全不排任务的空白时间，只留给自己放空或梳理。","themes":["留白","空间","虚实之间"],"keywords":["留白","空隙","日程","节奏","无中生有","空间感"],"situations":["每天被日程表追着跑，喘不过气","觉得生活塞满了杂事，没有属于自己的时间","脑子里东西太多，想不出新的点子"],"reflection":"在你的生活里，哪一块被忽略的“空白”，其实发挥着最重要的支撑作用？","reviewStatus":"draft"},{"id":12,"title":"为腹不为目","original":"五色令人目盲；五音令人耳聋；五味令人口爽；驰骋畋猎令人心发狂；难得之货令人行妨。是以圣人为腹不为目，故去彼取此。","translation":"纷繁的色彩让人眼花缭乱；杂乱的声音让人耳朵失聪；过重的味道让人的味觉麻木；纵情骑马打猎让人心神狂乱；稀罕珍贵的财物让人行为败坏。所以懂得道的人，只求填饱肚子、安顿内在，而不去追逐那些炫目的外在诱惑。因此舍弃外界的浮华，守住内在的充实。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"是以圣人为腹不为目，故去彼取此。","application":"外界充斥着刺激感官的声音与画面，容易让人误把“热闹”当充实。关注自己真实身心的温饱与平静，比追逐别人眼里的光鲜重要得多。","caution":"追求内在踏实不等于拒绝一切审美与生活乐趣，核心是不要被感官刺激牵着鼻子走。","step":"吃饭时放下手机，认真尝出每一口食物本来的味道与口感。","themes":["内在安顿","感官节制","质朴生活"],"keywords":["刺激","信息过载","踏实","内在需求","节制","清净"],"situations":["刷短视频停不下来，刷完只剩空虚和疲惫","总觉得需要买更多新鲜好看的东西来证明自己","周围太嘈杂，分不清自己真正需要什么"],"reflection":"你今天是在满足身体和心灵的真实需要，还是在喂养那些停不下来的外在眼球？","reviewStatus":"draft"},{"id":13,"title":"宠辱若惊","original":"宠辱若惊，贵大患若身。何谓宠辱若惊？宠为下，得之若惊，失之若惊，是谓宠辱若惊。何谓贵大患若身？吾所以有大患者，为吾有身，及吾无身，吾有何患？故贵以身为天下，若可寄天下；爱以身为天下，若可托天下。","translation":"受到赏识或遭到羞辱都会让人心惊肉跳，把巨大的灾患看得像自己的身体一样重。为什么说受到赏识和羞辱都会心惊？因为被动受人赏识本身就是处于下位，得到了觉得受宠若惊，失去了又患得患失，这就叫宠辱若惊。为什么说把灾患看得像身体一样重？我之所以会有大顾虑，是因为我太执着于这个自我；如果我能把自我的得失放下，我还有什么可怕的呢？所以，能像珍惜自己生命一样珍惜天下的人，才可以把天下寄托给他；能像爱护自己身体一样爱护天下的人，才可以把天下托付给他。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"宠为下，得之若惊，失之若惊，是谓宠辱若惊。","application":"过分在意别人的褒贬评价，情绪的主动权就落在了别人手里。把‘自我的面子’看淡一点，外界的风吹草动就伤不到你的内核。","caution":"放下自我执念不是不顾身体健康，恰恰相反，爱惜生命与承担责任并行不悖。","step":"回想一句最近让你耿耿于怀的评价，在心里对自己说：“这只是对方当下的视角，不代表我的全部。”","themes":["得失心","情绪自主","放下面子"],"keywords":["评价","面子","表扬","批评","患得患失","内核稳定"],"situations":["领导夸一句就飘，批评一句就整夜失眠","太在乎别人对自己的看法，活得很拘束","总担心做错事被人笑话，不敢迈出第一步"],"reflection":"如果暂时抛开‘别人怎么看我’这个包袱，你现在最想专注做的是什么？","reviewStatus":"draft"},{"id":14,"title":"道纪","original":"视之不见名曰夷；听之不闻名曰希；搏之不得名曰微。此三者不可致诘，故混而为一。其上不皦，其下不昧。绳绳不可名，复归于无物。是谓无状之状，无物之象，是谓惚恍。迎之不见其首，随之不见其后。执古之道，以御今之有。能知古始，是谓道纪。","translation":"看它看不见，叫作‘夷’；听它听不到，叫作‘希’；摸它摸不着，叫作‘微’。这三者无法追究到底，因为它们浑然一体。它的上面不显得明亮，下面也不显得晦暗。它连绵不断无法命名，最终又回归于无形的状态。这就是没有形状的形状，没有物体的形象，叫作恍惚。迎着它看不到它的开头，跟着它看不到它的尾巴。把握住亘古以来的规律，来应对当下的现实事务。能了解万物的开端，这就叫作大道的脉络与规律。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"执古之道，以御今之有。能知古始，是谓道纪。","application":"有些深层的规律就像水流，看不见摸不着，却始终在发挥作用。不用被眼前变幻莫测的表象迷惑，抓住基本的人性与常理，就能看清事情的来龙去脉。","caution":"依据底层规律不等于墨守成规、生搬硬套，理解原理正是为了灵活应对变化。","step":"面对手头一个看似新奇复杂的难题，先找出它最基本的常识与底层逻辑。","themes":["底层规律","洞察本质","以简驭繁"],"keywords":["规律","常识","本质","脉络","以古鉴今","看透表象"],"situations":["各种新名词、新概念铺天盖地，让人感到焦虑","事情错综复杂，不知道从哪一条线索理起","感觉自己被碎片化信息淹没，缺乏系统认知"],"reflection":"眼前这件繁杂的事情，剥掉外面华丽的包装之后，最基础的本质是什么？","reviewStatus":"draft"},{"id":15,"title":"徐清","original":"古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川；犹兮若畏四邻；俨兮其若客；涣兮若冰之将释；敦兮其若朴；旷兮其若谷；混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？保此道者不欲盈。夫唯不盈，故能敝不新成。","translation":"古时懂得道的人，微妙通达，深刻得难以捉摸。正因为难以穷尽，只能勉强形容他们的仪态：小心谨慎，像冬天涉水过河；警惕审慎，像防备着四周邻居；庄重沉静，像前去做客；洒脱融和，像冰雪渐渐消融；淳厚质朴，像未经雕琢的木头；开阔包容，像深邃的山谷；随和混同，像浑浊的水流。谁能在浑浊中安静下来，让水慢慢澄清？谁能在安定中慢慢萌动，让生机渐渐发生？守持这种道的人不求圆满自负。正因为不满溢，才能在陈旧中不断除旧布新。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"孰能浊以静之徐清？孰能安以动之徐生？","application":"水浑浊的时候越搅越浑。很多事情在情绪激动或局势混乱时，硬做决定只会添乱；先安静下来让杂质沉淀，答案自会浮现。","caution":"等待沉淀不是无限期逃避，给事情留出沉淀的时间，也要设定一个重新审视的节点。","step":"把今天最让你心烦的一个决定延后一晚，等明天早晨头脑清醒时再定夺。","themes":["沉淀","审慎","静中生慧"],"keywords":["沉淀","从容","等待","浑水自清","审慎","包容"],"situations":["情绪上头，想马上发一段狠话反驳","局面一团糟，急着想一步到位解决所有问题","心里乱糟糟的，做不出理智的判断"],"reflection":"如果让这杯浑水先安静放置一会儿，会有什么杂质自己沉下去？","reviewStatus":"draft"},{"id":16,"title":"致虚极","original":"致虚极，守静笃。万物并作，吾以观复。夫物芸芸，各复归其根。归根曰静，静曰复命。复命曰常，知常曰明。不知常，妄作凶。知常容，容乃公，公乃全，全乃天，天乃道，道乃久，没身不殆。","translation":"尽力使心灵虚空到极点，坚守内心的极致安宁。万物蓬勃生长，我从中观察它们循环往复的规律。万物纷繁芸芸，最终都要回归它们的根基。回到根基叫作安宁，安宁叫作回归本性。回归本性是恒常的规律，懂得恒常叫作明智。不懂得恒常而盲目乱动，就会招致祸患。懂得恒常就能宽容，宽容才能公正，公正才能周全，周全才合乎自然，合乎自然才契合大道，契合大道才能长久，终身不陷于危险。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"致虚极，守静笃。万物并作，吾以观复。","application":"外界越喧闹，内心越要守得住安静。万事万物都有自己的起伏周期，看清起伏的常态，就不会被一时的得失打乱阵脚。","caution":"守静不是消极避世，看清事物的节律与周期，是为了在合适的时候更准确地行动。","step":"找一个安静的角落深呼吸三次，只观察自己呼吸的起伏，不带任何评价。","themes":["守静","回归本心","周期规律"],"keywords":["安静","归根","循环","定力","长久","从容"],"situations":["外部环境波动很大，心里惶恐不安","总觉得事情脱离了控制，想要拼命抓住点什么","忙忙碌碌却不知道自己到底为了什么在奔波"],"reflection":"最近让你感到焦虑的波动，在更长的时间尺度上看，属于哪一种自然的周期？","reviewStatus":"draft"},{"id":17,"title":"太上","original":"太上，不知有之；其次，亲而誉之；其次，畏之；其次，侮之。信不足焉，有不信焉。悠兮其贵言。功成事遂，百姓皆谓我自然。","translation":"最好的带领者，人们甚至感觉不到他的存在；次一等的，人们亲近并赞美他；再次一等的，人们畏惧他；最差的，人们轻蔑欺骗他。带领者的诚信不足，大家自然就不会信任他。最高明的带领者从容悠闲，很少轻易发号施令。事情办成了，目标达成了，大家还都觉得：“我们本来就是顺其自然做到的。”","sourceEdition":"王弼本《道德经》通行整理","excerpt":"功成事遂，百姓皆谓我自然。","application":"真正高明的协作与管理，不是处处彰显自己的权威与指纹，而是把机制搭好、把空间留足，让事情自然而然地发生，让伙伴拥有成就感。","caution":"退居幕后不等于甩手不管，提供底层支撑与守住责任底线依然必不可少。","step":"把一项任务交代给合作者后，克制住自己中途指指点点的冲动，只约定最终检查的时间点。","themes":["领导力","授权","顺其自然"],"keywords":["管理","协作","信任","放权","润物细无声","成就他人"],"situations":["团队协作总想事无巨细地盯梢，自己累团队也烦","帮了别人总想让对方时刻念着自己的好","带新人不知道如何把握指导与放手的界限"],"reflection":"在这场协作中，你可以少控制哪一步，反而能让别人更好地施展能力？","reviewStatus":"draft"},{"id":18,"title":"大道废","original":"大道废，有仁义；智慧出，有大伪；六亲不和，有孝慈；国家昏乱，有忠臣。","translation":"大道被废弃了，才提倡所谓的仁义；机巧智谋出现了，虚伪欺诈也就随之滋生；家族亲属不和睦了，才刻意彰显孝顺与慈爱；国家政治混乱了，才特别突出忠臣的节操。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"大道废，有仁义；智慧出，有大伪。","application":"当一个环境开始大张旗鼓地强调某些口号或标签时，往往意味着最基础的信任与自然默契正在流失。看清本质，不要被形式主义的喧嚣遮蔽了双眼。","caution":"反思口号不是否定真诚的善意与责任，而是警惕那些用道德包装来掩盖实质问题的虚伪。","step":"少看一句口头承诺，多观察一次具体的实际行动与事实结果。","themes":["去虚伪","见本质","自然默契"],"keywords":["形式主义","口号","虚伪","默契","真实","看透本质"],"situations":["周围到处都在喊口号表忠心，实际做事却互相推诿","一段关系里甜言蜜语很多，关键时刻却毫无支撑","觉得某些规则表面光鲜，实际上增加了巨大的沟通成本"],"reflection":"在这段关系或这个环境里，有哪些高调的口号反而掩盖了真正没解决的问题？","reviewStatus":"draft"},{"id":19,"title":"见素抱朴","original":"绝圣弃智，民利百倍；绝仁弃义，民复孝慈；绝巧弃利，盗贼无有。此三者以为文不足。故令有所属：见素抱朴，少私寡欲，绝学无忧。","translation":"抛弃那些自作聪明的巧智，人们将获益百倍；抛弃那些刻意造作的仁义，人们自会恢复天然的孝慈；抛弃那些投机取巧的私利，盗贼自然不会产生。仅仅用这三条作为条文还不够，所以还要有所归宿：保持原本的质朴与真纯，减少自私与多余的欲望，放下那些繁文缛节与浮夸学问，自然就没有无谓的烦忧。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"见素抱朴，少私寡欲，绝学无忧。","application":"做减法是成年人最高级的自律。删去那些用来炫耀的技巧、多余的欲望和无用的社交负担，生活反而能重新恢复清澈与力量。","caution":"少私寡欲不是断绝所有正常需求，而是清理那些只带来内耗却不产生滋养的浮华包袱。","step":"清理掉手机里一个两周没打开过、且只会推送焦虑垃圾信息的应用。","themes":["断舍离","返璞归真","减法生活"],"keywords":["做减法","质朴","纯粹","断舍离","少欲望","自在"],"situations":["学了很多复杂的套路和方法论，反而不知道怎么迈步","欲望太多，每一件都想要，结果精疲力竭","生活被各种琐事填满，找不到最单纯的快乐"],"reflection":"如果今天只允许保留一样最核心的追求，你愿意果断放下的包袱是什么？","reviewStatus":"draft"},{"id":20,"title":"众人熙熙","original":"绝学无忧。唯之与阿，相去几何？美之与恶，相去若何？人之所畏，不可不畏。荒兮其未央哉！众人熙熙，如享太牢，如春登台。我独泊兮其未兆，如婴儿之未孩；傫傫兮若无所归。众人皆有余，而我独若遗。我愚人之心也哉！沌沌兮。俗人昭昭，我独昏昏；俗人察察，我独闷闷。澹兮其若海，飖兮若无止。众人皆有以，而我独顽且鄙。我独异于人，而贵食母。","translation":"放下虚伪的世俗学问便没有烦恼。应诺与呵斥，相差能有多少？美好与丑恶，相差又能怎样？大家所畏惧的，不能不有所警惕。但广大无边的世界啊，何处才是尽头！众人都兴高采烈，像在享受盛大的宴席，像在春天登上高台游玩。唯独我淡泊宁静无动于衷，像还不会笑的婴儿一样纯真；孤单寂寥，像没有归宿的游子。众人都显得富足有余，唯独我好像若有所失。我真是一颗愚朴的心啊，浑浑沌沌。世俗之人都聪明通达，唯独我迷迷糊糊；世俗之人都精明苛察，唯独我笨拙沉默。辽阔得像无边的大海，飘逸得像无拘的风。众人都各有本事，唯独我显得固执而质朴。我唯独与常人不同，是因为我把依靠孕育生命的根本之道看作最珍贵的事。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"俗人昭昭，我独昏昏；俗人察察，我独闷闷。","application":"当所有人都在同一条赛道上急匆匆向前赶的时候，允许自己做那个‘慢半拍’的人。不用为了迎合主流的精明而装作精明，守住自己的温热与单纯，本身就是一种稀缺的力量。","caution":"保持独特不等于愤世嫉俗或看不起别人，它是一种即便独自走在小径上也安心的定力。","step":"在今天的一次社交场合里，不必刻意展现自己的聪明或见解，安静倾听并享受内心的自在。","themes":["定力","不从众","内心的宁静"],"keywords":["慢节奏","不攀比","接纳自己","独处","定力","守拙"],"situations":["身边的人都在考证、搞副业、卷得飞起，自己感到格格不入","厌倦了社交场上的精明算计与虚假寒暄","觉得自己不够精明圆滑，经常因此产生自我怀疑"],"reflection":"如果不必向任何世俗标准证明自己的‘成功’，你最想以怎样的节奏度过今天？","reviewStatus":"draft"},{"id":21,"title":"孔德之容","original":"孔德之容，惟道是从。道之为物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物。窈兮冥兮，其中有精；其精甚真，其中有信。自古及今，其名不去，以阅众甫。吾何以知众甫之状哉？以此。","translation":"最深厚美好的德行，完全顺从大道的指引。大道作为一种存在，看起来恍恍惚惚、若有若无。恍惚之中，隐隐约约有生动的气象；若有若无之间，其实蕴藏着实在的万物。它是那么深远幽幽，其中却蕴含着最纯粹的精微生机；这生机无比真实，而且有着恒久不衰的规律与信验。从古至今，它的名字从未消逝，人们凭借它来观察万物的始源与成长。我凭什么能看清万物的起始与运行？正是凭借这大道的规律。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"孔德之容，惟道是从。道之为物，惟恍惟惚。","application":"很多重要的趋势和内在感受，在刚萌芽时往往是模糊、难以用精确语言定义的。不要急着强行给它贴标签，保持耐心感知那股隐隐生长的力量。","caution":"承认模糊不是盲目玄想，在直觉感知的深处，依然要有对规律与事实的敬畏。","step":"对一件刚萌生、还没想透的计划，先写下你最直觉的三点感受，暂不做成败定论。","themes":["感知萌芽","顺应自然","深层信任"],"keywords":["直觉","萌芽","恍惚","规律","顺应","深邃"],"situations":["心里有一个想做的事，但还说不清楚具体框架","周围人都在要数据、要结论，但直觉告诉你时机未到","面对扑朔迷离的局面，不知道该相信什么"],"reflection":"在那些看似模糊不清的感受背后，哪一种最深层的真实一直在引导着你？","reviewStatus":"draft"},{"id":22,"title":"曲则全","original":"曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见，故明；不自是，故彰；不自伐，故有功；不自矜，故长。夫唯不争，故天下莫能与之争。古之所谓曲则全者，岂虚言哉！诚全而归之。","translation":"懂得委曲，才能保全完整；懂得弯折，才能最终挺直；低洼之处，才能蓄满水源；陈旧破损，才能迎来新生；少取一点，反而能有所收获；贪多求全，反而会陷入困惑。所以懂得道的人守持核心的一点，作为理解天下的准则。不固执己见，反而看得清明；不自以为是，反而能彰显是非；不自我夸耀，反而功劳真实存在；不自高自大，反而能长久受人敬重。正因为不与人争一时的高低，所以天下没有人能跟他争得起来。古人说的‘曲则全’，哪里是一句空话呢！真正能保全自我并回归圆满的，正是这个道理。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。","application":"遇到阻力时，暂时的迂回与调整姿势不是认输，而是在保护最核心的目标。韧性往往表现为懂得拐弯，而不是一味硬碰硬把力量撞碎。","caution":"委曲求全是灵活的策略，不是毫无底线的无休止退让，更不能把自我践踏包装成顾全大局。","step":"在一件卡住的事情上，找出一条哪怕绕一点路、但代价更小的方式去推进。","themes":["迂回智慧","韧性","不争之争"],"keywords":["转弯","韧性","退让","少即是多","保全","不争"],"situations":["硬撑着不想低头，结果搞得筋疲力尽、两败俱伤","想要同时抓太多目标，结果哪个都没做好","遇到不讲理的阻力，急着当场争个胜负"],"reflection":"你现在苦苦坚守的，究竟是最终的目标本身，还是那个不肯弯曲的姿势？","reviewStatus":"draft"},{"id":23,"title":"希言自然","original":"希言自然。故飘风不终朝，骤雨不终日。孰为此者？天地。天地尚不能久，而况于人乎？故从事于道者，同于道；德者，同于德；失者，同于失。同于道者，道亦乐得之；同于德者，德亦乐得之；同于失者，失亦乐得之。信不足焉，有不信焉。","translation":"少发号施令、少说空话，才合乎自然。狂暴的大风刮不了一整个早晨，倾盆的暴雨下一整天也撑不住。是谁造成这种剧烈天气的？是天地。连天地的大力宣泄都无法持久，更何况是人呢？所以追求道的人，就与道融为一体；追求德行的人，就与德融为一体；偏离原则的人，就与偏离的后果同在。与道同在的人，道也欣然接纳他；与德同在的人，德也欣然相伴他；与失同在的人，失落也会如影随形。承诺与诚信不足的人，自然得不到别人的信任。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"希言自然。故飘风不终朝，骤雨不终日。","application":"猛烈的情绪和高声的宣誓最容易消耗能量，而且很难持久。少一点声势浩大的表态，多一点安静稳定的日拱一卒，事情才能真正扎下根来。","caution":"少说不是回避关键沟通，该讲清楚的原则与边界，依然要平心静气地说明白。","step":"把今天最想对外宣告的一项豪言壮语先收回心里，安静把第一个微小的事实证据做出来。","themes":["细水长流","情绪管理","言行合一"],"keywords":["平稳","持久","少空谈","暴风雨","诚信","沉静"],"situations":["立flag立得很猛，坚持了三天就彻底放弃","情绪一激动就放狠话，事后又觉得后悔莫及","总想靠高调表态来获取认同，却缺乏实质行动"],"reflection":"如果不靠激烈的声量来证明自己，这件事怎样以最自然、可持续的节奏往前走？","reviewStatus":"draft"},{"id":24,"title":"企者不立","original":"企者不立；跨者不行；自见者不明；自是者不彰；自伐者无功；自矜者不长。其在道也，曰：馀食赘行。物或恶之，故有道者不处。","translation":"踮起脚尖想让自己显得更高，反而站不稳；迈大步子想让自己跑得更快，反而走不远；只执着于自己所见的人，反而看不清全局；自以为是的人，反而无法彰显是非；自我吹嘘的人，反而抹杀了真实的功劳；自高自大的人，反而无法长久领导。用大道的眼光来看，这些行为就像剩饭赘肉一样多余可憎，让人厌恶，所以懂得道的人不会让自己陷入这种状态。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"企者不立；跨者不行；自见者不明；自是者不彰。","application":"急于求成往往会导致动作变形。不用刻意拔高姿态去扮演一个‘完美的自己’，脚踏实地踩在泥土里，每一步才走得踏实从容。","caution":"不争强好胜不等于自暴自弃，实事求是地评估自己的能力，才是最稳固的自信。","step":"检查手头一项赶工的任务，如果发现有为了赶进度而敷衍的环节，停下来把它修复结实。","themes":["脚踏实地","戒骄戒躁","反求诸己"],"keywords":["急躁","踮脚","炫耀","踏实","自然","稳扎稳打"],"situations":["急于看到成果，不断加码透支，身体和心态都要崩了","在别人面前强撑面子，不敢暴露自己的短板","做了点成绩就忍不住四处宣扬，引起别人反感"],"reflection":"你现在是不是在踮着脚尖做人？如果双脚完全落回地面，你的姿势会舒服多少？","reviewStatus":"draft"},{"id":25,"title":"道法自然","original":"有物混成，先天地生。寂兮寥兮，独立而不改，周行而不殆，可以为天地母。吾不知其名，字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。故道大，天大，地大，人亦大。域中有四大，而人居其一焉。人法地，地法天，天法道，道法自然。","translation":"有一种浑然一体的存在，在天地产生之前就已经存在了。它是那么宁静空阔，独立长存而不曾改变，周而复始运行而不曾停息，可以作为天地万物的母亲。我不知道它究竟叫什么名字，勉强用‘道’来称呼它，勉强形容它为‘大’。广大无边便向外延伸，延伸辽远便回转循环。所以道大，天大，地大，人也同样伟大。宇宙间有四种伟大的存在，而人就是其中之一。人效法大地承载包容，大地效法上天覆育万物，上天效法大道周流不息，大道则顺应自然本来的规律。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"人法地，地法天，天法道，道法自然。","application":"不要总想着人定胜天、强扭现实。人活在天地自然的系统里，顺应四季的温凉、作息的节律与人性的常态，事情反而能事半功倍。","caution":"顺应自然不是盲目听天由命，而是看清客观大势后，顺势而为、巧借东风。","step":"观察自己今天哪个时段精力最好、哪个时段最疲惫，顺着这个生物钟重新调整一件任务的顺序。","themes":["顺应天时","宏大格局","天人合一"],"keywords":["自然规律","借势","格局","敬畏","天时地利","大局观"],"situations":["熬夜硬撑工作，效率奇低而且第二天一身病","非要跟大趋势对着干，结果碰得头破血流","感到个人的渺小与无力，找不到与世界的连接感"],"reflection":"在眼前这件让你耗尽力气的事情上，大势的自然流向究竟是怎样的？你在顺流还是逆流？","reviewStatus":"draft"},{"id":26,"title":"重为轻根","original":"重为轻根，静为躁君。是以君子终日行不离辎重。虽有荣观，燕处超然。奈何万乘之主，而以身轻天下？轻则失根，躁则失君。","translation":"厚重是轻浮的根本，沉静是躁动的主宰。所以懂得修身的人终日行路，也绝不会丢下装载物资的辎重车。虽然身处繁华荣耀的景观之中，却能安然自处、超脱物外。为什么大国的君主，反而为了一时享乐而轻率对待自己的身体与天下呢？轻浮就会失去根基，急躁就会丧失主动与定力。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"重为轻根，静为躁君。轻则失根，躁则失君。","application":"在风口和热潮面前，守住自己的底盘最重要。越是遇到突发紧急或花哨诱惑的场面，越要先把脚步站稳，厚重沉静才能压得住场面。","caution":"沉静厚重不是反应迟钝，它是为了在做出关键动作前，保证自己的重心不被晃倒。","step":"在被催促着马上给答复时，先喝一口温水，停顿五秒钟再开口。","themes":["稳重","定力","守住底盘"],"keywords":["沉稳","重心","不浮躁","底牌","从容","定力"],"situations":["别人一催就慌神，仓促做出的决定漏洞百出","看到别人赚快钱就心动，想扔掉自己耕耘多年的基本盘","一遇到紧急突发情况就六神无主"],"reflection":"面对此刻的喧闹与催促，你的‘辎重车’（最不可丢掉的基本盘）究竟是什么？","reviewStatus":"draft"},{"id":27,"title":"善行无辙迹","original":"善行无辙迹；善言无瑕谪；善数不用筹策；善闭无关楗而不可开；善结无绳约而不可解。是以圣人常善救人，故无弃人；常善救物，故无弃物。是谓袭明。故善人者，不善人之师；不善人者，善人之资。不贵其师，不爱其资，虽智大迷，是谓要妙。","translation":"高明的行路者不留车辙痕迹；高明的言谈者没有瑕疵可挑；高明的计算者不用算筹筹策；高明的关门者不用锁栓却让人无法打开；高明的捆绑者不用绳索却让人无法解开。所以懂得道的人总是善于帮助人，因此没有被真正遗弃的人；总是善于物尽其用，因此没有被真正浪费的物资。这就叫作顺承天生的明智。所以善人是不善之人的老师，不善之人是善人汲取经验的借鉴。不尊重老师，不爱惜借鉴，即使再聪明也会陷入重大迷惑。这就是最精深微妙的道理。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"善行无辙迹；善言无瑕谪；善闭无关楗而不可开。","application":"真正高超的技巧是让人感觉不到技巧的存在。看待人与事时多看其长处与可用之处，把所谓的‘缺点’放到对的位置上，也能变成宝贵的资源。","caution":"包容万物不等于混淆是非对错，而是具备把废料转化为肥料的转化智慧。","step":"找出身边一个平时让你觉得头疼的人或一件麻烦事，思考一下他/它身上哪一点能在特定场合派上用场。","themes":["大智若拙","物尽其用","包容转化"],"keywords":["高明","无痕","用人之长","转化","智慧","接纳"],"situations":["总看身边人不顺眼，觉得别人浑身都是毛病","做事用力过猛，留下一大堆人为干预的痕迹与后遗症","遇到挫折只觉得全是坏事，看不到其中蕴含的教训与机会"],"reflection":"如果换一个摆放的位置，眼前这个让你觉得多余或麻烦的事物，能发挥什么意想不到的作用？","reviewStatus":"draft"},{"id":28,"title":"知其雄守其雌","original":"知其雄，守其雌，为天下溪。为天下溪，常德不离，复归于婴儿。知其白，守其黑，为天下式。为天下式，常德不忒，复归于无极。知其荣，守其辱，为天下谷。为天下谷，常德乃足，复归于朴。朴散则为器，圣人用之，则为官长，故大制不割。","translation":"明知什么是刚强，却甘愿守住柔顺的姿态，就像天下的溪流一样包容汇聚。作为天下的溪流，永恒的品德就不会离开，回归到如婴儿般纯粹的状态。明知什么是光鲜明朗，却甘愿守在低调沉静的暗处，作为天下的楷模。作为天下的楷模，永恒的品德就不会产生差错，回归到无边无际的辽阔。明知什么是尊贵荣耀，却甘愿守在谦卑居下的谷底，作为天下的山谷。作为天下的山谷，永恒的品德才充足充沛，回归到质朴的根本。原始的质朴分散开来制成各种器物，懂得道的人顺应材质去使用它们，便能成为优秀的领袖，所以真正高明宏大的格局是不会被狭隘割裂的。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"知其白，守其黑，为天下式。知其雄，守其雌，为天下溪。","application":"有能力展现锋芒与强大，却有涵养选择退让与低调。这种内藏锐气、外显温润的格局，能容纳更多的人与事，走得更长久。","caution":"守雌守黑不是真的懦弱无能，它是建立在深知‘雄与白’底气之上的主动选择。","step":"在今天一个你可以居功或反驳的场合，温和地把聚光灯让给身边的人一次。","themes":["内圣外王","韬光养晦","包容格局"],"keywords":["守黑","守雌","谦逊","婴儿","返璞归真","格局"],"situations":["能力很强，但因为处处压人一头而遭到群体孤立","总想证明自己懂得多、比别人厉害，人际关系很紧绷","在顺境和掌声中容易飘飘然，失去清醒的判断力"],"reflection":"你拥有展现强大的能力，但此刻守住哪一份温柔低调，反而更能成全大局？","reviewStatus":"draft"},{"id":29,"title":"去甚去奢去泰","original":"将欲取天下而为之，吾见其不得已。天下神器，不可为也，不可执也。为者败之，执者失之。是以物或行或随；或嘘或吹；或强或羸；或载或隳。是以圣人去甚，去奢，去泰。","translation":"想要凭借强硬的人为手段去掌控天下，我看是注定无法实现的。天下是一件神圣神妙的事物，绝不能强行干预，也不能死死攥在手里。强行干涉的必定会搞砸，强行执着占有的必定会失去。所以万物有的走在前面，有的跟在后面；有的呼吸轻柔，有的喘息粗重；有的刚强健硕，有的瘦弱单薄；有的安稳承载，有的颠覆陷落。所以懂得道的人，去掉极端的做法，去掉过分的奢求，去掉过度的膨胀。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"为者败之，执者失之。是以圣人去甚，去奢，去泰。","application":"控制欲太强往往是痛苦的根源。越是想把事情的一丝一毫都死死攥在手里，事情越容易失控。去掉那些走极端的焦虑，允许事情有它自己的节奏。","caution":"放下控制不是撒手不管，而是分清什么是自己能影响的，什么是必须尊重客观规律的。","step":"找出一件你最近总想强行推动、却频频碰壁的事，先把手松开一天，只观察它的自然走向。","themes":["放下控制","适度中庸","顺应节奏"],"keywords":["控制欲","放下执念","去极端","分寸感","过犹不及","顺势"],"situations":["对伴侣、孩子或下属控制欲极强，搞得大家都喘不过气","一旦事情没按自己预设的轨道走，就会暴躁崩溃","凡事都要追求‘最极致、最完美’，把自己逼进死胡同"],"reflection":"在这件事里，哪一部分其实是你强加的‘控制欲’，而不是事情发展的真正需要？","reviewStatus":"draft"},{"id":30,"title":"物壮则老","original":"以道佐人主者，不以兵强天下。其事好还。师之所处，荆棘生焉。大军之后，必有凶年。善有果而已，不敢以取强。果而勿矜，果而勿伐，果而勿骄，果而不得已，果而勿强。物壮则老，是谓不道，不道早已。","translation":"用大道来辅佐领导者的人，不用武力强行称霸天下。穷兵黩武这种事很容易招致报应。军队驻扎过的地方，必定杂草荆棘丛生。大战过后，必然伴随着饥荒灾年。善于用兵的人只求达到解决问题的必要结果就适可而止，绝不凭借武力逞强。达成目的了不要自满，达成了不要夸耀，达成了不要骄傲，达成了要认为是迫不得已的选择，达成了也不要一味逞强。事物过度强盛就会迅速走向衰老，这叫作违背大道的规律，违背大道的行为很快就会走向消亡。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"善有果而已，不敢以取强。物壮则老，是谓不道，不道早已。","application":"解决问题求的是‘达成结果’，而不是在赢了之后继续追击、逞强羞辱对方。用力过猛往往是衰败的起点，点到为止才是最高明的收尾。","caution":"不逞强不是没有行动力，而是知道何时该出击、何时该收力，不打消耗战。","step":"在一场已经达到目的的沟通或争辩中，主动停下追击，给对方留一个体面的台阶。","themes":["适可而止","节制力量","留有余地"],"keywords":["点到为止","收力","不过度","留台阶","物极必反","自制"],"situations":["占了理就不饶人，非要逼得对方颜面扫地","取得一点优势就盲目扩张，结果战线拉太长资金链断裂","用力过猛导致身体亮红灯，无法持续战斗"],"reflection":"你手头的这件事已经达到‘预期结果’了吗？你是在巩固胜利，还是在盲目逞强？","reviewStatus":"draft"},{"id":31,"title":"不祥之器","original":"夫佳兵者，不祥之器，物或恶之，故有道者不处。君子居则贵左，用兵则贵右。兵者不祥之器，非君子之器，不得已而用之，恬淡为上。胜而不美，而美之者，是乐杀人。夫乐杀人者，则不可得志于天下矣。吉事尚左，凶事尚右。偏将军居左，上将军居右，言以丧礼处之也。杀人之众，以悲哀泣之，战胜以丧礼处之。","translation":"兵器哪怕再精良，也是不吉祥的器具，人们往往厌恶它，所以懂得道的人不会迷恋依赖它。有修养的人平时以温和偏左为贵，用兵打仗时则以肃杀偏右为主。武器是不祥的东西，不是君子所推崇的器具，到了迫不得已的时候才使用它，以清心恬淡的态度最为上乘。打了胜仗也不要得意洋洋，如果把胜利当成美事去夸耀，那就是以杀人为乐。以伤害别人为乐的人，是不可能在天下长久立足的。吉祥的事情以左方为尊，凶丧的事情以右方为主。偏将军居左，上将军居右，意思是把战争当作丧礼来对待。伤害了那么多人，应当怀着悲痛哀伤的心情去面对；哪怕打了胜仗，也要用肃穆的丧礼仪式来对待它。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"兵者不祥之器，非君子之器，不得已而用之，恬淡为上。","application":"任何具有攻击性、破坏性的手段（包括发脾气、打官司、撕破脸），都属于‘下策中的下策’，非到万不得已不要轻易动用。即便赢了，也是两败俱伤，值得反思而不是炫耀。","caution":"慎用攻击手段不代表任人宰割，手里必须有剑，只是心里不存嗜杀暴戾之念。","step":"面对一个触犯你利益的人，先尝试用规则与沟通解决，把最激烈的撕破脸手段留作最后的底牌。","themes":["慎用武力","悲悯心","和平底线"],"keywords":["克制","不伤人","不得已","悲悯","底线","防卫"],"situations":["遇到冲突就想立刻掀桌子、撕破脸决裂","把伤害别人、赢了口舌当成自己厉害的资本","过于依赖强硬手段施压，导致人际关系四面楚歌"],"reflection":"如果这件事必须动用强硬手段，你的内心是怀着迫不得已的悲悯，还是带着泄愤的冲动？","reviewStatus":"draft"},{"id":32,"title":"知止不殆","original":"道常无名，朴。虽小，天下莫能臣。侯王若能守之，万物将自宾。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦将知止，知止所以不殆。譬道之在天下，犹川谷之于江海。","translation":"大道始终是无名而质朴的。它看似微小无形，天下却没有谁能使它臣服。领导者如果能坚守住大道的质朴，万物自然会归顺信从。天地阴阳相合，降下润泽的甘露，不需要人工下令干预，雨露自然分布均匀。事物开始被划分规范时便有了名字，既然已经有了各种界定与规则，就应当懂得适可而止；懂得适可而止，才不会陷入危险。大道存在于天下，就像山川小溪自然汇入江海一样自然归流。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"始制有名，名亦既有，夫亦将知止，知止所以不殆。","application":"规则与框架在初期能带来秩序，但如果过度拆解、过度细分，反而会把生机卡死。懂得在制度与规范中留出适可而止的边界，系统才能长久运转。","caution":"知止不是拒绝规范，而是在建立规则的同时，给个体的灵活性留出呼吸的空间。","step":"检查一个你制定的计划或规则，删掉其中最繁琐、限制性最强的一条限制。","themes":["适可而止","简化规则","回归质朴"],"keywords":["知止","安全边界","不过度规训","留白","江海归流","克制"],"situations":["制度流程越来越繁琐，大家都在应付填表，正事反而没人做","把自己的生活规划得像机器一样死板，稍有偏差就焦虑万分","不断追求更高的指标和定义，把自己逼进死胡同"],"reflection":"在这套让你感到束缚的规则里，什么地方该画上‘适可而止’的休止符了？","reviewStatus":"draft"},{"id":33,"title":"自知者明","original":"知人者智，自知者明。胜人者有力，自胜者强。知足者富。强行者有志。不失其所者久。死而不亡者寿。","translation":"能看懂别人是聪明，能看清自己才是真正的明白通透。能战胜别人是有力气，能战胜自己的欲望与软弱才是真正的刚强。懂得满足的人才是真正的富有。坚持不懈前行的人才是有志气。不偏离自己根本定位的人才能长久立足。肉体消逝而精神风范长存的人，才是真正的长寿。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"知人者智，自知者明。胜人者有力，自胜者强。","application":"把审视别人的放大镜收回来，照一照自己的内心。看清自己的恐惧、短板与真正的长处，战胜内心的惰性与内耗，比在外界赢过一百个人都要强大。","caution":"自知不是不断自我否定和苛责，清醒看见自己的优点与边界同样是自知的一部分。","step":"写下一件你今天战胜了自己内心懈怠或情绪化的小事，哪怕只是按时喝了一杯水。","themes":["认识自我","自律克己","真正的强大"],"keywords":["自知","内在力量","克己","知足","定位","清醒"],"situations":["总在挑别人的刺，却对自己的毛病视而不见","很容易被外界的节奏带偏，不知道自己到底适合做什么","沉迷于和别人竞争比较，赢了空虚输了痛苦"],"reflection":"今天你是在跟别人比拼，还是在跟昨天那个焦虑、犹疑的自己对话？","reviewStatus":"draft"},{"id":34,"title":"大道氾兮","original":"大道氾兮，其可左右。万物恃之以生而不辞，功成不名有。衣养万物而不为主，常无欲，可名于小；万物归焉而不为主，可名为大。以其终不自为大，故能成其大。","translation":"大道广泛流淌啊，漫延在左右各个地方。万物依赖它生长繁衍，它从不推辞拒绝；功劳成就了，它从不宣称自己占有。它滋养覆盖万物，却从不把自己当作主宰，始终没有私欲，可以称它为‘微小’；万物都归附于它，它却依然不自立为主，可以称它为‘伟大’。正因为大道始终不把自己看得多么伟大，所以才成就了它真正的伟大。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"衣养万物而不为主，常无欲，可名于小；万物归焉而不为主，可名为大。","application":"真正伟大的力量往往润物细无声。默默付出、支撑平台，不居功、不揽权，别人反而会发自内心地信赖你、汇聚在你身边。","caution":"不主宰不等于放弃责任，默默滋养的前提是你有持续提供价值的能力。","step":"今天在幕后为团队或家人默默做一件贴心的小事，不主动提出来邀功。","themes":["润物细无声","不居功","成其广大"],"keywords":["奉献","默默支撑","不求回报","包容","博大","底层赋能"],"situations":["做了一点贡献就急着要表扬，得不到认可就心灰意冷","总想在团队里当那个最显眼的大红人，容易引起嫉恨","想建立长久的影响力，却找不到正确的切入方式"],"reflection":"如果不急着把功劳贴上自己的名字，你的付出其实已经默默改变了什么？","reviewStatus":"draft"},{"id":35,"title":"执大象","original":"执大象，天下往。往而不害，安平泰。乐与饵，过客止。道之出口，淡乎其无味，视之不足见，听之不足闻，用之不足既。","translation":"把握住最博大包容的大道原则，天下人都会欣然向往。前去归附不仅不会受到伤害，反而能得到安宁、平稳与祥和。美妙的音乐和诱人的美食，能让过路的客人停下脚步驻足。但大道通过言语表达出来时，却是那么平淡无味，看它看不真切，听它听不真切，使用起来却永远也用不尽。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"执大象，天下往。往而不害，安平泰。","application":"花哨热闹的噱头能吸引一时的看客，但真正能让人感到安心、愿意长久相伴的，往往是那些朴实无华、平淡却靠谱的底层支持。","caution":"平淡不等于敷衍无聊，平淡的背后要有取之不尽的深厚价值与安全感。","step":"在一份方案或一次交流中，拿掉花哨的修饰词，直接给出最平实、可靠的核心保障。","themes":["朴实可靠","长治久安","平淡有力"],"keywords":["靠谱","平淡","安全感","深厚","长久","返璞归真"],"situations":["总被各种花里胡哨的宣传吸引，买回来才发现毫无用处","觉得自己平平淡淡不够吸引人，产生自卑心理","想建立长期稳定的合作关系，却不知道核心抓手是什么"],"reflection":"剥去那些短暂刺激的喧闹，什么才是能让你和身边人感到‘安平泰’的真正基石？","reviewStatus":"draft"},{"id":36,"title":"微明","original":"将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲取之，必固与之。是谓微明。柔弱胜刚强。鱼不可脱于渊，国之利器不可以示人。","translation":"想要收拢它，必先暂且扩张它；想要削弱它，必先暂且增强它；想要废弃它，必先暂且抬高它；想要夺取它，必先暂且给予它。这就叫作微妙深刻的明察。柔韧温和往往能战胜刚硬强横。鱼不能离开深潭，国家最核心的防卫力量不能轻易拿出来向人炫耀。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"柔弱胜刚强。将欲歙之，必固张之；将欲弱之，必固强之。","application":"看事情要看全周期的演变，不要被眼前暂时的膨胀或嚣张吓退。事物发展到极点自会转向，保持柔和沉住气，时间会站在有耐心的人这一边。","caution":"理解这套规律是为了看透变化、做好自保防守，绝不能拿它去搞阴谋诡计、恶意算计他人。","step":"面对一个正在不可一世、嚣张跋扈的对手或难题，收起正面对撞的冲动，安静观察其漏洞的显露。","themes":["物极必反","微明洞察","以柔克刚"],"keywords":["规律","转折点","耐心","以柔克刚","藏器于身","洞察"],"situations":["遇到咄咄逼人的对手，忍不住想立刻拍桌子硬刚","看到别人盲目狂飙突进，自己心里感到焦虑和慌乱","急于出手反制，却暴露了自己的核心底牌"],"reflection":"在这场较量中，对方的‘过于强盛’是否已经在悄悄加速其转折？你守住柔韧了吗？","reviewStatus":"draft"},{"id":37,"title":"无为而无不为","original":"道常无为而无不为。侯王若能守之，万物将自化。化而欲作，吾将镇之以无名之朴。镇之以无名之朴，夫亦将不欲。不欲以静，天下将自定。","translation":"大道始终顺任自然、不加妄为，却没有什么事情不是由它自然成就的。领导者如果能坚守这一原则，万物自会顺应规律自我演变。如果在演变中产生过分膨胀的欲望，就用无名的大道质朴来安抚平息它。用无名的质朴来平息私欲，杂念自然消退而重归清静，天下自会安定祥和。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"道常无为而无不为。不欲以静，天下将自定。","application":"最好的干预常常是‘不过度干预’。相信系统自身具有自我调节和修复的能力，当大家产生浮躁贪念时，用质朴的初心去锚定方向，事情自然会重回正轨。","caution":"不妄为不是放任自流、不管不顾，而是在关键时刻用质朴的原则去守住底线。","step":"对于一个正在自我运转的流程，忍住今天想要去‘微调一下’的冲动，让它完整跑完一个周期。","themes":["顺应自愈","守住初心","不妄为"],"keywords":["无为","自愈","质朴","定力","不过度干预","系统自洽"],"situations":["团队已经运转得很好了，自己非要插手改这改那，引发混乱","面对生活的小波动过度反应，折腾出一堆无谓的事端","欲望浮躁泛滥，不知道该用什么来锚定内心"],"reflection":"眼前这件让你忍不住想插手的事情，如果完全交给它自有的节律，它会怎样自愈？","reviewStatus":"draft"},{"id":38,"title":"上德不德","original":"上德不德，是以有德；下德不失德，是以无德。上德无为而无以为；下德无为而有以为。上仁为之而无以为；上义为之而有以为。上礼为之而莫之应，则攘臂而扔之。故失道而后德，失德而后仁，失仁而后义，失义而后礼。夫礼者，忠信之薄，而乱之首。前识者，道之华，而愚之始。是以大丈夫处其厚，不处其薄；居其实，不居其华。故去彼取此。","translation":"最高尚的德行不刻意表现有德，因此才真正具备品德；低下的德行生怕失去品德的形式，因此反而算不上真正的品德。高尚的品德顺应自然，不带功利目的；低下的品德表面无为，背后却带着刻意的盘算。高尚的仁爱发自内心去付出，而不求任何回报；高尚的正义去做事，背后却有严格的规矩算计；高尚的礼制去推行，若得不到别人的回应，便卷起袖子强行拉扯别人遵从。所以失去了自然之道才强调德行，失去了德行才提倡仁爱，失去了仁爱才讲求正义，失去了正义才搬出礼仪条文。所谓繁琐的礼法，不过是忠诚与诚信衰薄的产物，往往是混乱的开端。那些自作聪明的前瞻预测，只是大道的浮华表象，常常是愚昧的开始。所以立身处世的大丈夫，立足于敦厚淳朴，而不停留在虚薄表面；安居于实在根本，而不追求浮华外表。所以舍弃浮华，守住真诚实在。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"大丈夫处其厚，不处其薄；居其实，不居其华。","application":"形式主义与繁文缛节越多，往往说明底层的情感与信任越脆弱。做人做事守住那份最朴实、真诚的厚道，不搞花架子，才是最牢固的立足点。","caution":"追求内在真诚不代表对社会基本礼貌的蔑视，而是拒绝那些冷酷虚伪的道德绑架与形式捆绑。","step":"用一句发自肺腑的真诚关怀，代替一句公式化的客套官话。","themes":["返璞归真","厚道实在","破除形式主义"],"keywords":["厚道","真诚","形式主义","实事求是","去伪存真","踏实"],"situations":["人际交往充斥着虚伪的客套与面子工程，让人心累","用一套死板的规矩去苛求别人，导致关系彻底僵化","过于在意表面包装，忽略了事情最实质的交付质量"],"reflection":"在这段关系或这个合作中，你是在经营表面的‘礼仪浮华’，还是在维护底层的‘忠信厚度’？","reviewStatus":"draft"},{"id":39,"title":"天得一以清","original":"昔之得一者：天得一以清；地得一以宁；神得一以灵；谷得一以盈；万物得一以生；侯王得一以为天下正。其致之也，谓天无以清，将恐裂；地无以宁，将恐废；神无以灵，将恐歇；谷无以盈，将恐竭；万物无以生，将恐灭；侯王无以正，将恐蹶。故贵以贱为本，高以下为基。是以侯王自谓孤、寡、不毂。此非以贱为本邪？非乎？故至誉无誉。是故不欲琭琭如玉，珞珞如石。","translation":"自古以来得到那纯一整体之道的：天得到它而变得清朗；地得到它而变得安宁；神明得到它而显现灵妙；山谷得到它而得以充盈；万物得到它而生生不息；领导者得到它而成为天下的主持者。推演开来：天若不能保持清朗，恐怕会崩裂；地若不能保持安宁，恐怕会崩塌；神明若不能灵妙，恐怕会停歇；山谷若不能充盈，恐怕会干涸；万物若不能化生，恐怕会灭绝；领导者若不能中正自守，恐怕会跌倒倒台。所以尊贵以卑微为根本，高大以低下为基石。因此古代君主自称‘孤家’、‘寡人’、‘不才’，这不正是以卑下为根本吗？难道不是吗？所以最高的荣誉反而不需要任何赞誉。因此不追求像美玉那样温润耀眼，而宁愿像顽石那样坚实粗朴。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"贵以贱为本，高以下为基。不欲琭琭如玉，珞珞如石。","application":"站得再高，底座依然在泥土里。不要被表面的鲜花与赞誉冲昏了头脑，像一块坚韧粗粝的石头一样扎根大地，比做一块易碎精致的美玉更踏实可靠。","caution":"谦卑自居不是自我轻贱，它是深刻理解了‘高台由泥土筑起’之后的从容格局。","step":"对今天为你提供基础服务（保洁、外卖、后勤等）的一位普通劳动者真诚道一声谢谢。","themes":["居安思危","谦下守基","厚重质朴"],"keywords":["根基","谦卑","不傲慢","坚实如石","底盘","敬畏"],"situations":["升职或者取得成绩后开始有些飘，看不起基础工作","一心想当聚光灯下的耀眼美玉，承受不住任何风吹雨打","忽视了基层和底层的声音，决策脱离实际"],"reflection":"托起你此刻光鲜生活的最底层基石是什么？你最近有认真照看过它吗？","reviewStatus":"draft"},{"id":40,"title":"反者道之动","original":"反者道之动；弱者道之用。天下万物生于有，有生于无。","translation":"循环往复、走向反面，是大道的运转规律；柔弱谦下、不争强硬，是大道的发挥功用。天下万物都从‘有形’中孕育而生，而‘有形’又从‘无形’的虚空中生发出来。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"反者道之动；弱者道之用。天下万物生于有，有生于无。","application":"事物的发展总有往复回转的节律。感到受阻或放慢的时候，正是退一步观察、蓄积柔韧力量的契机。给眼前留出空间，新的生机才能自然萌发。","caution":"顺应回转的节律不是消极等待，而是在低谷与静止中守住内心的安宁与根本。","step":"面对一件近期让你感到受阻的事，退后一步给它留出半天的缓冲空间，不急于强行推进。","themes":["顺应节律","蓄势待发","虚实相生"],"keywords":["转机","蓄力","退一步","节律","留白","回归根本"],"situations":["遭遇挫折跌入低谷，觉得人生彻底没有希望了","感觉自己现在一无所有、资源匮乏，不知道从何开始","一味用力猛冲却处处碰壁，身心俱疲"],"reflection":"在这个看似阻碍或低谷的节点背后，大道正在悄悄酝酿着哪一种反向的回转？","reviewStatus":"draft"},{"id":41,"title":"上士闻道","original":"上士闻道，勤而行之；中士闻道，若存若亡；下士闻道，大笑之。不笑不足以为道。故建言有之：明道若昧；进道若退；夷道若纇；上德若谷；广德若不足；建德若偷；质真若渝；大白若辱；大方无隅；大器晚成；大音希声；大象无形；道隐无名。夫唯道，善贷且成。","translation":"有人听见道，便认真照着去做；有人将信将疑；也有人听了发笑。若它从不显得反常，也就不足以称为道。所以古语说：明白的道看似昏暗，前行的道看似后退，平坦的道看似崎岖；高德如谷，广德若不足，坚定的德看似怠惰，质朴的真看似变化；洁白仿佛含垢，大方没有棱角，大器不拘于成形，大音少声，大象无形，道隐而无名。也正因为如此，道能给予并成就万物。","sourceEdition":"王弼本《道德经》通行整理（校记：传本在‘太白／大白’及句序上有异，此处暂从项目底稿，待复核）","excerpt":"大器晚成；大音希声；大象无形；道隐无名。","application":"真正深厚沉静的事物，初时往往不显山露水。不必急于在喧嚣中争辩证明，守住长期的专注与打磨，事情自然会慢慢立住。","caution":"大器晚成不是拖延与逃避的借口，日复一日的积累才是成器的底气。","step":"面对外界的怀疑或不解，放下争辩的冲动，安心做好手头的一件实事。","themes":["大器晚成","耐住寂寞","不求速成"],"keywords":["沉淀","大器晚成","定力","不争一时","厚积薄发","耐性"],"situations":["自己默默努力很久却还没看到结果，产生自我怀疑","做的决定被周围人嘲笑、不理解，心里委屈动摇","看到同龄人迅速暴富或成名，心态失衡焦虑"],"reflection":"这件你需要耗费漫长时间打磨的真正追求，值得你为它承受多久的‘看起来默默无闻’？","reviewStatus":"needs_review"},{"id":42,"title":"道生一","original":"道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。人之所恶，唯孤、寡、不毂，而王公以为称。故物或损之而益，或益之而损。人之所教，我亦教之。强梁者不得其死，吾将以为教父。","translation":"大道化生出混沌统一的元气，元气分化出阴阳两极，阴阳交感生出和谐之气，三者交融从而繁育出世间万物。万物都背负着阴气而拥抱着阳气，在阴阳二气的激荡交融中达到动态平衡。人们最厌恶的词汇，莫过于‘孤单’、‘寡德’、‘不称职’，而王公贵族却用它们来谦称自己。所以事物有时减损它反而得到增益，有时硬要增加它反而带来减损。古人教导的道理，我也拿来教导大家：强横凶暴的人往往不得善终，我将把这句话当作最重要的启蒙教训。","sourceEdition":"王弼本《道德经》通行整理（校记：历代对‘一二三’释义聚讼，通行取元气、阴阳与冲和之序）","excerpt":"万物负阴而抱阳，冲气以为和。故物或损之而益，或益之而损。","application":"生活不是非黑即白的单行道，阴与阳、好与坏、得与失始终处于动态交融之中。主动做一点减法、吃一点小亏，反而可能在别的地方收获长远的生机与和谐。","caution":"主动损减是为了求得系统的平衡，不是毫无原则的自我牺牲与自虐。","step":"主动放弃一件耗费精力但收益极低的事情，把空出来的心力投入到滋养身心的重要关系中。","themes":["动态平衡","损益之道","阴阳和谐"],"keywords":["平衡","阴阳","做减法","以退为进","柔和","生机"],"situations":["只想得到好处，一点亏都不肯吃，搞得关系剑拔弩张","生活失衡，把所有时间都堆在工作上，身体和家庭亮红灯","遇到挫折只觉得是纯粹的损失，看不到其中孕育的新平衡"],"reflection":"眼前的失落或减损，在更长远的平衡里，正在为你腾出什么样的空间？","reviewStatus":"needs_review"},{"id":43,"title":"天下之至柔","original":"天下之至柔，驰骋天下之至坚。无有入无间，吾是以知无为之有益。不言之教，无为之益，天下希及之。","translation":"天下最柔软的东西，能够自由驰骋穿透天下最坚硬的事物。无形无体的大道，能够穿透没有任何缝隙的坚固之物。我因此知道了顺应自然‘无为’的巨大利益。不用言语的说教，不带强加的干预之益，天下很少有人能真正领会并做得到啊。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"天下之至柔，驰骋天下之至坚。无有入无间。","application":"最坚硬的墙往往不是被锤子砸碎的，而是被水滴慢慢渗透瓦解的。遇到坚硬如铁的阻力或固执的人，少用硬碰硬的争吵，用温和持久的耐心去渗透，反而能解开死结。","caution":"以柔克刚靠的是持久的方向与穿透力，而不是失去立场的妥协与随波逐流。","step":"面对一个态度强硬、油盐不进的人，今天停止正面争论，用一次温和的关心去软化坚冰。","themes":["以柔克刚","穿透力","不言之教"],"keywords":["水滴石穿","柔软","渗透","耐心","无痕","化解冲突"],"situations":["跟固执的长辈或领导沟通，越吵对方越不听","面对巨大的现实阻力，感到撞墙碰壁、无从下手","习惯了用发火和强势去解决问题，发现越来越不灵"],"reflection":"如果放下硬碰硬的武器，你能否像水一样，找到一条悄悄穿过坚硬阻力的缝隙？","reviewStatus":"draft"},{"id":44,"title":"知足不辱","original":"名与身孰亲？身与货孰多？得与亡孰病？甚爱必大费；多藏必厚亡。故知足不辱，知止不殆，可以长久。","translation":"声名与生命相比，哪一个更亲切宝贵？身体与财物相比，哪一个分量更重？得到利益与丧失性命相比，哪一个更令人痛苦？过分沉溺贪爱必定会付出巨大的代价；过度囤积聚敛必定会招致沉重的破败。所以懂得满足就不会遭受屈辱，懂得适可而止就不会陷入危险，这样才能长长久久平安度日。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"名与身孰亲？身与货孰多？知足不辱，知止不殆，可以长久。","application":"随时算一算身心消耗的真实代价。为了换取多余的名声和财物，如果赔上了身体的健康与内心的安宁，从一开始就是得不偿失的。懂得停在刚刚好的地方，才是深沉的智慧。","caution":"知足不是压低生活追求，而是清楚知道什么才是不可交换的底线资产。","step":"为你当前最渴望追求的一个目标标出真实代价（时间、睡眠、情绪、陪伴），看看它是否真的值得交换。","themes":["生命本位","知足常乐","止损明辨"],"keywords":["健康","知足","代价","放下贪婪","止损","长久安宁"],"situations":["为了多赚一点钱拼命熬夜透支，身体快要垮了","为了面子和虚名打肿脸充胖子，心里苦不堪言","贪多囤积了太多东西，反而被物品和资产死死套牢"],"reflection":"为了得到你现在心心念念的那个东西，你正在透支的是不是自己最重要的身心根本？","reviewStatus":"draft"},{"id":45,"title":"大成若缺","original":"大成若缺，其用不弊。大盈若冲，其用不穷。大直若屈，大巧若拙，大辩若讷。躁胜寒，静胜热。清静为天下正。","translation":"最完美的成就看起来总带有一丝残缺，但它的效用却永远不会衰竭；最充沛的充盈看起来总带有一点空虚，但它的作用却永远不会穷尽。最笔直的长处看起来有些弯曲，最高超的技巧看起来纯朴无雕饰，最绝妙的口才听起来从容平实。急躁运动可以抵御寒冷，清澈安静能够化解燥热。清静无为才是天地间最根本的正道。","sourceEdition":"王弼本《道德经》通行整理（注：‘躁胜寒，静胜热’，传抄亦有作‘静胜躁，寒胜热’；此处从通行王弼注本定文）","excerpt":"大成若缺，其用不弊。大盈若冲，其用不穷。清静为天下正。","application":"允许自己的生活和作品带有一点‘不完美’的留白。追求毫无瑕疵的完美主义，往往会把系统撑得太脆、把人逼得太紧；带一点瑕疵与缝隙，生命才有呼吸和调整的空间。","caution":"接纳不完美不是敷衍了事，而是在尽力做好之后，有包容残缺与遗憾的从容气度。","step":"把手头一份迟迟不敢交付的作业或方案，带着现有的一点小瑕疵准时交付出去。","themes":["接纳瑕疵","反完美主义","拙朴之美"],"keywords":["留白","不完美","拙朴","清静","松弛感","从容"],"situations":["强迫症发作，因为一点小瑕疵就全盘否定自己","项目追求极致完美迟迟不敢上线交付，错失良机","总觉得自己口才不够好、不够圆滑而感到自卑"],"reflection":"那个让你耿耿于怀的‘缺点’或‘遗憾’，是否正是让你的生命保留呼吸空间的裂缝？","reviewStatus":"needs_review"},{"id":46,"title":"知足常足","original":"天下有道，却走马以粪。天下无道，戎马生于郊。祸莫大于不知足；咎莫大于欲得。故知足之足，常足矣。","translation":"天下遵循大道时，战马被退还去田间耕地拉粪；天下背离大道时，怀胎的母马也被拉到战场郊野去打仗。灾祸没有比不知满足更大的了；过失没有比贪得无厌更沉重的了。所以懂得满足所带来的富足，才是永恒充沛的真正富足。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"祸莫大于不知足；咎莫大于欲得。故知足之足，常足矣。","application":"贪婪是不断移动的终点线，哪怕拥有再多，如果心里的欲望没有刹车，就永远活在匮乏与焦虑的战壕里。感知当下的拥有，心才能真正安顿下来。","caution":"知足不是消极不求上进，而是摆脱被欲望无休止绑架的奴隶状态，掌握人生的主动权。","step":"写下三件你现在已经拥有、且曾经梦寐以求的美好事物，认真体会内心的充实感。","themes":["感知拥有","欲望刹车","真正的富足"],"keywords":["知足","感恩","平息欲望","富足","安宁","不再匮乏"],"situations":["明明生活已经不错了，看到别人有的东西依然心痒嫉妒","赚得越多越觉得不够花，整天陷入缺钱的恐慌中","不断设立新的高目标，从来没有停下来享受过一次成果"],"reflection":"如果停止向外索取，你此刻拥有的东西，已经足够支撑你过上怎样美好的生活？","reviewStatus":"draft"},{"id":47,"title":"不出户知天下","original":"不出户，知天下；不窥牖，见天道。其出弥远，其知弥少。是以圣人不行而知，不见而明，不为而成。","translation":"不出大门，就能推知天下的常理；不望窗外，就能体悟天道的运行规律。向外奔逐追寻得越远，懂得的根本道理反而越少。所以懂得道的人不必四处奔波就能洞察本质，不用眼花缭乱就能看清明了，不加盲目妄为而事情自然功成。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"不出户，知天下；不窥牖，见天道。其出弥远，其知弥少。","application":"在这个信息爆炸的时代，到处跑、到处打听不等于掌握真知。沉下心来把基本的人性、常理和规律吃透，坐在房间里也能对复杂的局面拥有清晰的洞察。","caution":"不出户不是封闭自我、拒绝实际调研，而是警惕被海量的外部噪音牵着鼻子走。","step":"关掉所有嘈杂的资讯推送一小时，只用一张白纸梳理手头事情的核心因果关系。","themes":["洞察本质","向内探寻","过滤噪音"],"keywords":["定力","本质","过滤信息","深思","内在智慧","以简驭繁"],"situations":["每天刷几百条新闻和行业报告，脑子里却越来越乱","总觉得去参加各种高端酒会就能找到捷径，结果全是无用社交","遇到事情习惯向外求援，从不静下心来自己独立思考"],"reflection":"在那些你不断向外追寻的答案里，有哪些其实只要向内安静反思就能看清？","reviewStatus":"draft"},{"id":48,"title":"为道日损","original":"为学日益，为道日损。损之又损，以至于无为。无为而无不为。取天下常以无事，及其有事，不足以取天下。","translation":"追求外在学问，知识和技能每天都在增加；体悟内在大道，执念和妄为每天都在减少。减少了再减少，一直达到顺应自然不盲动妄为的境界。不妄加干涉，反而没有什么事情不是顺应规律自然成就的。治理天下、统领全局往往靠不生事扰民；如果处处生事、过度干预，就根本不足以赢得天下人心的归附。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"为学日益，为道日损。损之又损，以至于无为。无为而无不为。","application":"年轻时做加法，不断充实技能与工具；成熟后做减法，不断剔除情绪、偏见、多余的动作与执念。少做那些无意义的折腾，把力气精准用在刀刃上，事情反而能水到渠成。","caution":"做减法的前提是你已经具备了基础的认知和能力，不能在什么都没学会前就空谈‘减损’。","step":"从你的日常工作或生活中，删掉一个别人不看、也不产生实质价值的冗余步骤。","themes":["做减法","专注本质","化繁为简"],"keywords":["日损","减负","减法","精简","不折腾","水到渠成"],"situations":["工作流程极其繁重，搞出一堆谁也不看的报表和会议","脑子里杂念太多，想做的事情列了一百条，结果一条没动","总觉得需要掌握所有技能才敢动手，陷入‘准备的陷阱’"],"reflection":"如果今天只允许你保留最核心的一项行动，哪件事是真正不可替代的本质？","reviewStatus":"draft"},{"id":49,"title":"以百姓心为心","original":"圣人常无心，以百姓心为心。善者，吾善之；不善者，吾亦善之；德善。信者，吾信之；不信者，吾亦信之；德信。圣人在天下，歙歙焉，为天下浑其心，百姓皆注其耳目，圣人皆孩之。","translation":"懂得道的人没有固执自私的偏见，以民众的心愿为自己的心愿。善良的人，我以善意对待他；不善良的人，我也以善意对待他，这样便能引导大家向善。守信的人，我信任他；不守信的人，我也给予基本的信任，这样便能启发大家守信。懂得道的人生活在天下，谨严收敛，使自己的心境浑朴纯真；大家都竖起耳朵、瞪大眼睛关注得失，而懂得道的人把大家都当作天真无邪的孩童般悉心照拂。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"圣人常无心，以百姓心为心。百姓皆注其耳目，圣人皆孩之。","application":"放下个人的傲慢与成见，真正站在对方的处境和需求去思考。用包容与信任去感化别人，往往比严防死守、以牙还牙更能化解敌意、赢得人心。","caution":"以善待人不等于毫无防备的盲目轻信，包容是出于内心的宏大，而不是懦弱糊涂。","step":"面对一个曾对你产生误解或态度不好的人，今天主动报以一个温和坦诚的微笑或问候。","themes":["同理心","包容慈悲","大爱无私"],"keywords":["换位思考","同理心","信任","善意","宽厚","孩童之心"],"situations":["跟人交流总想强行说服对方认同自己的观点","被人冒犯了一次就彻底关上心门，老死不相往来","作为团队领头人，总是只考虑自己的利益与考核指标"],"reflection":"如果完全站在对方此刻的压力与处境里看问题，你能理解他的哪一份难处？","reviewStatus":"draft"},{"id":50,"title":"善摄生者","original":"出生入死。生之徒，十有三；死之徒，十有三；人之生，动之于死地，亦十有三。夫何故？以其生生之厚。盖闻善摄生者，陆行不遇兕虎，入军不被甲兵；兕无所投其角，虎无所措其爪，兵无所容其刃。夫何故？以其无死地。","translation":"人从出生走向死亡。长寿的人占十分之三；短命的人占十分之三；原本可以长寿，却因为折腾纵欲自投死地的人，也占十分之三。这是为什么呢？因为他们把奉养肉体、追求享乐看得太重太厚了。听说善于养护生命的人，在陆地上行走不会遭遇犀牛老虎，在战场上穿行不用披挂铠甲兵器；犀牛找不到地方投刺利角，老虎找不到地方抓挠利爪，兵刃找不到地方刺入利刃。这是为什么呢？因为他心中没有招致死亡的死穴与弱点。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"盖闻善摄生者，陆行不遇兕虎，入军不被甲兵。以其无死地。","application":"很多人的身体与心灵不是被外界打垮的，而是被自己过度的欲望、狂热的执念与焦虑折腾坏的。少一点作茧自缚的内耗，把心里的死穴放空，外界的攻击就找不到着力点。","caution":"善养生不等于迷信养生偏方，真正的养生首先是安顿好情绪与欲望，不过度折腾身体。","step":"今晚提前半小时放下手机躺下休息，不带任何未完事项的焦虑入睡。","themes":["养生之道","不折腾","无死地"],"keywords":["养生","情绪管理","不消耗","自爱","放下执念","身心安康"],"situations":["身体明明已经极度疲惫，脑子却还在疯狂内耗失眠","为了追求所谓的精致享乐，把身体折腾得百病缠身","情绪极度敏感脆弱，别人一句话就能让自己崩溃好几天"],"reflection":"在你的生活习惯或心理模式里，哪一种过度透支正在悄悄消耗着你的生命元气？","reviewStatus":"draft"},{"id":51,"title":"尊道贵德","original":"道生之，德畜之，物形之，势成之。是以万物莫不尊道而贵德。道之尊，德之贵，夫莫之命而常自然。故道生之，德畜之；长之育之；亭之毒之；养之覆之。生而不有，为而不恃，长而不宰。是谓玄德。","translation":"大道赋予万物生命，品德畜养万物成长，物质赋予万物形态，环境成就万物态势。所以万事万物没有不尊重大道、珍惜品德的。大道的受尊重，品德的受珍惜，并不是有什么强行命令，而是万物顺应自然的天然选择。所以大道生养万物，品德畜养万物；使万物成长成熟，使万物结实平安，养护万物，遮蔽庇佑万物。赋予了生命却不据为己有，做出了贡献却不自恃功劳，带领着万物却不强加主宰。这就是最深厚玄妙的美德。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"生而不有，为而不恃，长而不宰。是谓玄德。","application":"无论是培养孩子、带领团队还是做一件产品，最美好的支持是：提供生长的土壤与资源，然后放手让它长成属于它自己的样子，不把自己的意志强加在上面。","caution":"不主宰不等于冷漠放任，在提供充沛滋养与保护的前提下，尊重独立的生命意志。","step":"对你正在关心或帮助的一个人，忍住今天想要替他做决定的冲动，支持他按自己的意愿尝试一次。","themes":["赋能成长","放手成全","玄德之美"],"keywords":["养育","赋能","尊重独立","不占有","不主宰","成全"],"situations":["对孩子的每一步人生都要死死掌控，导致亲子关系极度紧绷","帮助了别人就觉得对方必须对自己唯命是从","带领团队把员工当成工具人，压制大家的创造力"],"reflection":"对于你倾注心血培育的这件事或这个人，你能否给予他‘长成自己模样’的自由？","reviewStatus":"draft"},{"id":52,"title":"守柔曰强","original":"天下有始，以为天下母。既得其母，以知其子，既知其子，复守其母，没身不殆。塞其兑，闭其门，终身不勤。开其兑，济其事，终身不救。见小曰明，守柔曰强。用其光，复归其明，无遗身殃；是为习常。","translation":"天下万物都有起始，这个起始就是天地万物的母亲。既然找到了根本的母亲，就能认识由它衍生的万物；既然认识了万物，再回过头来坚守住根本的母亲，终身都不会陷入危险。塞住欲望的孔洞，关闭对外的私门，终身都不会疲惫困顿。大开欲望的孔洞，忙于奔波世俗杂事，终身都不可救药。能察觉微小的萌芽叫作明察，能守住柔软的姿态叫作真正的刚强。运用内心的智慧光芒，重新回归清澈明达的本性，不给自己留下祸殃；这就叫作继承永恒的常道。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"见小曰明，守柔曰强。塞其兑，闭其门，终身不勤。","application":"真正的强大不是靠坚硬的盔甲和逞凶斗狠，而是守得住内心的柔软与敏锐。在问题还很微小时就及时察觉、收拢欲望，身体和心灵才不会被无休止的杂事消耗殆尽。","caution":"关闭欲望之门不是自绝于世，而是给心神筑起一道防线，不让垃圾信息与贪念随意侵入。","step":"在今天感到心力交瘁时，闭上眼睛静坐三分钟，把散漫在外的注意力完全收回呼吸之中。","themes":["敏锐洞察","守柔为强","节约心力"],"keywords":["守柔","防微杜渐","收拢心神","真正强大","不耗竭","宁静"],"situations":["整天被各种杂事和信息轰炸，感到脑力透支、心力衰竭","总觉得硬碰硬才是勇敢，把自己的身体和情绪搞得千疮百孔","忽略了身体或关系里早期的微小警告信号，酿成大祸"],"reflection":"在你的生活里，有哪些敞开的‘欲望孔洞’（社交、贪念、焦虑）正在持续漏掉你的能量？","reviewStatus":"draft"},{"id":53,"title":"行于大道","original":"使我介然有知，行于大道，唯施是畏。大道甚夷，而人好径。朝甚除，田甚芜，仓甚虚；服文采，带利剑，厌饮食，财货有余；是为盗夸。非道也哉！","translation":"假使我稍微有一点真正的明智，在大道上行走，最害怕的就是偏离正道走上歧途。康庄大道本来是非常平坦平直的，可是世人偏偏喜欢走那些凶险狭窄的捷径小路。宫殿台阶修得极其华丽，田地却极其荒芜，粮仓极其空虚；身上穿着华丽锦绣，腰里佩带锋利宝剑，吃腻了山珍海味，积聚了多余的财富；这叫作强盗头子的炫耀放纵。这根本违背了大道的法则啊！","sourceEdition":"王弼本《道德经》通行整理","excerpt":"大道甚夷，而人好径。朝甚除，田甚芜，仓甚虚。","application":"最踏实成功的路往往是最质朴平直的大道，但人性的弱点总是妄想抄近道、走捷径。表面的光鲜华丽如果建立在底层基础的荒芜之上，崩塌只是早晚的事。","caution":"走正道不等于不知变通，而是绝不在核心原则与基本功上偷工减料、投机取巧。","step":"检查手头一件你想‘走捷径速成’的事，重新把精力放回最基础、扎实的一步上去。","themes":["不走捷径","脚踏实地","戒除浮华"],"keywords":["走正道","不抄近道","扎实","警惕浮华","实事求是","底线"],"situations":["总想找暴富副业或者速成技巧，结果被割了一茬又一茬韭菜","表面包装得很光鲜，自己内心的基本盘和田地却一片荒凉","为了省事走歪门邪道，留下一大堆隐患随时可能暴雷"],"reflection":"你现在是不是在某条看似诱人的‘近道捷径’上冒险？退回平坦踏实的大道上会怎样？","reviewStatus":"draft"},{"id":54,"title":"善抱者不拔","original":"善抱者不拔，善抱者不脱，子孙以祭祀不辍。修之于身，其德乃真；修之于家，其德乃余；修之于乡，其德乃长；修之于邦，其德乃丰；修之于天下，其德乃普。故以身观身，以家观家，以乡观乡，以邦观邦，以天下观天下。吾何以知天下然哉？以此。","translation":"善于建树扎根的不可拔除，善于持守怀抱的不会滑脱，子子孙孙的敬意与传承就会绵延不绝。把大道落实修持在自身，品德就会纯真扎实；落实修持在家庭，品德就会充裕有余；落实修持在乡里，品德就会深远滋长；落实修持在国家，品德就会丰盛繁荣；落实修持在天下，品德就会普遍普及。所以，用自身的体会来观察他人之身，用一家的法则来观察各家，用一乡的规律来观察各乡，用一国的脉络来观察各国，用天下的法则来观察天下。我凭什么能知道天下的全貌规律呢？正是凭借这种由近及远、由内而外的推演观察。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"善抱者不拔，善抱者不脱。修之于身，其德乃真。","application":"一切宏大目标的起点都在自己的身心微调上。先把自己的情绪、作息与品行打理扎实，再去照料家庭、团队与事业，从内向外自然扩展，才不会根基不稳。","caution":"修身修己不是孤芳自赏，把自己的基本功练扎实，是为了更有力量地支撑更广阔的责任。","step":"今天先不谈拯救世界或宏大规划，认真把自己的书桌或卧室收拾得干干净净。","themes":["由内而外","扎牢根基","修身为本"],"keywords":["修身","由近及远","扎根","稳固","传承","内功"],"situations":["总想做惊天动地的大事，自己的日常生活却一团糟","企图通过改变别人来解决问题，结果到处碰壁碰得头破血流","根基不牢就盲目扩张，遇到一点风吹草动就全盘瓦解"],"reflection":"在你想要改变的这片庞大领域里，属于你自己身心最微小、最能立即行动的第一步在哪里？","reviewStatus":"draft"},{"id":55,"title":"含德之厚","original":"含德之厚，比于赤子。毒虫不螫，猛兽不据，攫鸟不搏。骨弱筋柔而握固。未知牝牡之合而朘作，精之至也。终日号而嗌不嗄，和之至也。知和曰常，知常曰明。益生曰祥。心使气曰强。物壮则老，谓之不道，不道早已。","translation":"道德修养深厚的人，就像初生的婴儿一样纯粹安详。毒虫不叮蜇他，猛兽不扑抓他，凶禽不搏击他。他的筋骨柔软脆弱，可是小手却能抓握得极牢固。还不懂男女交合之事，生殖器却能自然勃起，这是因为精气纯正充沛到了极点。整天啼哭叫喊嗓子却不会嘶哑，这是因为体内的气息调和顺畅到了极点。懂得调和叫作常道，懂得常道叫作明智。盲目纵欲强求增益生命叫作灾殃。心灵任性驱使血气叫作逞强好勇。事物过度强盛就会迅速走向衰老，这叫作违背大道，违背大道的行为很快就会走向终结。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"含德之厚，比于赤子。心使气曰强。物壮则老。","application":"最充沛的生命力来自于内心的调和与纯粹，而不是靠发脾气、逞强好胜。少用情绪去强行驱使身体去拼命，保持婴儿般的柔和顺畅，能量才能源源不断。","caution":"如婴儿般柔和不是不辨是非的幼稚，而是在历经世事后依然守住内心的纯净与生机。","step":"感到自己情绪急躁、想用蛮力硬冲时，深呼吸三次，把绷紧的肩膀彻底放松下来。","themes":["赤子之心","生机充沛","戒除蛮力"],"keywords":["赤子","婴儿","生机","柔和","不逞强","气和"],"situations":["一遇到阻力就靠发脾气、吼叫来施压，伤人伤己","靠透支咖啡因和意志力硬撑工作，身体内部已经枯竭","心机越来越重，感觉自己失去了最本真的快乐与活力"],"reflection":"今天你在做的事情，是在顺应身体的生机，还是在用‘心使气’的蛮力硬撑透支？","reviewStatus":"draft"},{"id":56,"title":"知者不言","original":"知者不言，言者不知。塞其兑，闭其门，挫其锐，解其纷，和其光，同其尘，是谓玄同。故不可得而亲，不可得而疏；不可得而利，不可得而害；不可得而贵，不可得而贱。故为天下贵。","translation":"真正通达明理的人不轻易高谈阔论，到处夸夸其谈的人往往并不真正懂得。堵塞欲望的孔洞，关闭对外的私门，磨掉外露的锋芒，解开繁杂的纠纷，收敛耀眼的光芒，混同于质朴的尘土，这就叫作玄妙幽深的大同境界。达到这种境界的人，别人无法故意亲近他，也无法故意疏远他；无法用利益诱惑他，也无法用祸害威胁他；无法让他因此变得高贵，也无法让他因此变得卑贱。所以他才成为天下最尊贵的人。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"知者不言，言者不知。和其光，同其尘，是谓玄同。","application":"真正深厚的底气不需要靠滔滔不绝的口才和锋芒毕露的姿态来证明。融入人群、和光同尘，没有多余的软肋与破绽，外界的诱惑和伤害自然就碰不到你。","caution":"和光同尘不是同流合污、丧失原则，而是收敛刺人的锋芒，以温润的姿态行走世间。","step":"在一次讨论中，忍住抢先发表高见的冲动，最后用一句最平实、总结性的话语温和收尾。","themes":["和光同尘","大智若愚","刀枪不入"],"keywords":["和光同尘","收敛锋芒","深藏不露","底气","从容","不言"],"situations":["懂了一点道理就忍不住到处教导别人，招致反感","锋芒太露，被别人当成靶子攻击，处境被动","容易被别人的夸奖拉拢，或被别人的冷落伤害"],"reflection":"如果你把身上的‘刺’收回去一点，换成温润如玉的光，眼前的人际僵局会怎样化解？","reviewStatus":"draft"},{"id":57,"title":"以正治国","original":"以正治国，以奇用兵，以无事取天下。吾何以知其然哉？以此：天下多忌讳，而民弥贫；人多利器，国家滋昏；人多伎巧，奇物滋起；法令滋彰，盗贼多有。故圣人云：我无为，而民自化；我好静，而民自正；我无事，而民自富；我无欲，而民自朴。","translation":"用堂堂正正的原则治理国家，用灵活奇诡的策略指挥用兵，用清静不扰民的方式赢得天下人心。我凭什么能知道这个道理呢？正是凭借这些事实：天下的清规戒律和忌讳越多，老百姓反而越贫困；民间的锋利武器越多，国家局势反而越昏暗混乱；人们的心机巧诈越多，邪门古怪的事情反而层出不穷；苛刻繁琐的法令越严密，盗贼罪犯反而越来越多。所以懂得道的人说：我顺应自然不乱干预，大家自会自我教化；我保持宁静不生事端，大家自会走上正轨；我不搞劳民伤财的杂事，大家自会勤劳致富；我清心寡欲不贪浮华，风气自会淳朴敦厚。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"法令滋彰，盗贼多有。我无为，而民自化；我好静，而民自正。","application":"管理与相处中，禁令越密、限制越多，往往说明互信越差、漏洞越多。少一点防贼式的严防死守，多给别人一点信任与空间，大家反而会自觉把事情做好。","caution":"无事好静不是彻底废除规则，而是删掉那些为了防范极个别人而折腾所有人的恶法劣规。","step":"在管理或家庭中，废除一条只增加内耗、却防不住真正问题的手续或禁令。","themes":["少折腾","信任赋能","简政放权"],"keywords":["信任","放手","不折腾","简化规则","自觉","治理智慧"],"situations":["给团队或孩子定了一百条规矩，结果大家都在想方设法钻空子撒谎","公司流程审批越来越长，效率越来越低，大家怨声载道","总想通过严密的监控来确保安全，结果人人都感到窒息"],"reflection":"在那道让你抓狂的规则背后，你是靠更多的禁令来防守，还是靠更本质的信任来化解？","reviewStatus":"draft"},{"id":58,"title":"祸福相倚","original":"其政闷闷，其民淳淳；其政察察，其民缺缺。祸兮福之所倚，福兮祸之所伏。孰知其极？其无正也。正复为奇，善复为妖。人之迷，其日固久。是以圣人方而不割，廉而不刿，直而不肆，光而不燿。","translation":"政治宽厚从容，民风就淳朴温厚；政治严苛苛察，民心就狡黠残缺。祸患啊，福气正依附在它身旁；福气啊，灾祸正潜伏在它底下。谁能知道这其中的究竟和极限？世事并没有一成不变的绝对。正常的可以转变为诡异，善良的可以转变为妖妄。人们的迷惑困顿，时间已经太长久了。所以懂得道的人：方正却不割伤别人，有棱角却不刺痛别人，直率却不放肆无礼，光芒四射却不刺人眼目。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"祸兮福之所倚，福兮祸之所伏。光而不燿。","application":"身处顺境时要看到潜伏的危机，身处逆境时要看到蕴含的转机。做人有自己的原则和棱角，但表达时要温润克制，不拿自己的‘正确’去刺伤身边的人。","caution":"方而不割不是圆滑世故没有原则，而是有原则却懂得慈悲待人，不仗理欺人。","step":"在指出别人的错误时，把严厉的指责换成温和客观的陈述，保全对方的体面。","themes":["祸福相依","方而不割","温润有界"],"keywords":["转机","福祸","包容","有棱角有温度","分寸","和气"],"situations":["遭遇倒霉事就怨天尤人，看不到其中转折的契机","自己占了理就咄咄逼人，用‘我是对的’把别人刺得遍体鳞伤","取得一点成绩就盲目狂妄，忽视了暗流涌动的风险"],"reflection":"眼前这件看似糟糕的事情底下，正悄悄潜伏着什么样的福气与转机？","reviewStatus":"draft"},{"id":59,"title":"治人事天莫若啬","original":"治人事天，莫若啬。夫唯啬，是谓早服；早服谓之重积德；重积德则无不克；无不克则莫知其极；莫知其极，可以有国；有国之母，可以长久；是谓深根固柢，长生久视之道。","translation":"治理人事、顺应天道，没有比‘爱惜节俭心力物力’更好的法则了。唯有懂得爱惜节俭，才能做到及早顺应自然；及早顺应自然，就叫作不断积蓄雄厚的德行能量；不断积蓄德行能量，就没有什么困难不能克服；没有什么困难不能克服，就无法估量他的力量极限；拥有无法估量的潜能，才可以担当托付重任；掌握了滋养守护的根本之母，才可以长久不衰；这就叫作把根扎得深、把底盘筑得固，长久立足、历久弥新的根本之道。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"治人事天，莫若啬。深根固柢，长生久视之道。","application":"省着点用心力、省着点耗情绪、省着点花精力。在日常中懂得节制与蓄能，把能量留给真正重要的根本大事，根基扎得深厚，狂风暴雨来时才能稳如泰山。","caution":"节啬爱惜不是小气抠门，而是不把宝贵的生命能量浪费在无谓的内耗与虚荣上。","step":"拒绝一场无意义的低质社交或争论，把省下来的两小时留给安静的休息与充电。","themes":["蓄能节制","深根固柢","长久之道"],"keywords":["蓄能","节俭心力","深根固柢","长久","不浪费","底气"],"situations":["整天在鸡毛蒜皮的琐事上大动肝火，真正该发力的时候筋疲力尽","赚一点花两点，完全不留应急储备和蓄力缓冲","做事急于求成，根基还没打稳就盲目加高楼层"],"reflection":"在你的日常能量开销里，哪一块是在无谓空耗，值得你立刻‘节啬’收拢起来？","reviewStatus":"draft"},{"id":60,"title":"烹小鲜","original":"治大国，若烹小鲜。以道莅天下，其鬼不神；非其鬼不神，其神不伤人；非其神不伤人，圣人亦不伤人。夫两不相伤，故德交归焉。","translation":"治理大国，就像煎炸烹调小鱼一样，不能频繁翻动折腾。用大道的法则来统领天下，各种诡异作祟的精怪鬼神便无法显现神通；不仅鬼神不显神通作祟，即使显露神通也不会伤害人；不仅鬼神不伤害人，懂得道的人也绝不去伤害压迫民众。两者互不相扰、互不伤害，所以万物各安其位，德行的福泽自然汇聚归流。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"治大国，若烹小鲜。夫两不相伤，故德交归焉。","application":"煎小鱼的时候，翻动太勤鱼肉就碎了。处理复杂的事情或人际关系也是如此，搭好框架后就要给事情自我成型的耐心，别一天三改、频繁折腾，克制住多余的干预就是最大的智慧。","caution":"不折腾不是不管不顾，火候与油温要看好，只是不去做多余的翻弄与搅和。","step":"对一个已经交代下去的任务，今天坚决不中途去追问打扰，静等约定的交付时间。","themes":["不折腾","顺其自然","保持耐心"],"keywords":["烹小鲜","不乱动","耐心","克制干预","各安其位","沉住气"],"situations":["领导天天朝令夕改，下面的人疲于奔命、怨声载道","对一个刚种下的种子天天扒开土看发芽没有，导致枯死","遇到事情沉不住气，一天改八次计划，把自己搞得精疲力竭"],"reflection":"眼前这件让你焦虑的事情，是否正是因为你‘翻动得太勤’而快要碎了？停手等一等会怎样？","reviewStatus":"draft"},{"id":61,"title":"大国者下流","original":"大国者下流，天下之交，天下之牝。牝常以静胜牡，以静为下。故大国以下小国，则取小国；小国以下大国，则取大国。故或下以取，或下而取。大国不过欲兼畜人，小国不过欲入事人。夫两者各得其所欲，大者宜为下。","translation":"大国应当像江河的下游一样，汇聚天下的江流，处于天下雌柔包容的地位。雌柔常以宁静战胜雄强，正因为宁静而甘处低下。所以大国对小国谦逊包容，就能赢得小国的信服归附；小国对大国谦卑恭敬，就能得到大国的照拂接纳。所以有的凭借谦下而赢得信任，有的处于谦下而保全自身。大国不过是想团结庇护更多的人，小国不过是想加入大局发挥作用。两者既然都能各得其所愿，那么实力更强大的一方，尤其应当主动甘居下位、展现包容。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"大国者下流，天下之交。大者宜为下。","application":"在协作或相处中，拥有更多资源或主动权的一方若能主动展现谦逊与低姿态，能为彼此创造更宽松的信任与沟通空间。","caution":"谦逊处下是强大者的从容包容，绝不是在核心利益和原则上任人欺凌。","step":"在一次你占据明显优势或主导地位的谈话中，主动放低姿态，先请对方提出他的核心诉求。","themes":["强者处下","谦逊包容","合作共赢"],"keywords":["格局","谦下","包容","优势方","消除防备","共赢"],"situations":["实力比对方强，但因为态度傲慢导致合作频频受阻","作为资深前辈或领导，无法拉近与新人的距离","强强对话中互不相让，陷入零和博弈的僵局"],"reflection":"作为占据资源或优势的一方，你多展现一分‘处下’的温和，能为这段合作带来多大的空间？","reviewStatus":"draft"},{"id":62,"title":"万物之奥","original":"道者万物之奥。善人之宝，不善人之所保。美言可以市尊，美行可以加人。人之不善，何弃之有？故立天子，置三公，虽有拱璧以先驷马，不如坐进此道。古之所以贵此道者何？不曰：求以得，有罪以免邪？故为天下贵。","translation":"大道是万事万物最深邃的庇护所。它是善人的无价至宝，也是迷途失足之人得以保全的依靠。美好的言辞可以换来别人的尊重，高尚的行为可以让人受到爱戴。哪怕有人暂时走上了不善的歧途，大道又何尝真正抛弃过他们呢？所以举行天子登基的大典，设置三公辅佐的重位，哪怕献上由四匹骏马拉着的大块拱璧美玉，也比不上静下心来把这一份大道送进他们的心里。自古以来人们为什么如此尊崇大道？不正是因为常说的‘有求借此而得，有过借此得免’吗？所以大道才成为天下最珍贵的存在。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"道者万物之奥。人之不善，何弃之有？","application":"不要轻易给任何人判死刑，也不要轻易对自己全盘否定。每个人都有迷茫犯错的时候，回归常理、顺应规律，随时都能重新找到站立的支点与安顿的庇护。","caution":"包容过错不是纵容恶行，而是相信人心深处那份只要愿意回归就能被挽救的可能。","step":"对一个曾犯过错但正在努力改正的人，放下心中的成见，真诚给予他一次尝试的机会。","themes":["救赎包容","不弃一人","永恒庇护"],"keywords":["包容","宽恕","重新开始","不放弃","庇护","大道无私"],"situations":["因为过去犯的一个错误深陷自责，久久无法原谅自己","对身边犯错的人极度苛刻，认为对方‘这辈子也就这样了’","面对挫败感到走投无路，不知道还能依靠什么站起来"],"reflection":"对于那个曾经跌倒犯错的自己或他人，你能否像大道一样，敞开那扇允许‘重新开始’的大门？","reviewStatus":"draft"},{"id":63,"title":"图难于易","original":"为无为，事无事，味无味。大小多少，报怨以德。图难于其易，为大于其细；天下难事，必作于易，天下大事，必作于细。是以圣人终不为大，故能成其大。夫轻诺必寡信，多易必多难。是以圣人犹难之，故终无难矣。","translation":"以不妄为的态度去作为，以不生事的方式去处事，在平淡无味中品味真味。无论事情大小多少，都以纯真宽厚的品德去回应恩怨。解决难题要从它还容易的时候入手，成就大事要从它最微细的地方做起；天下的艰难大事，必定是从容易的小处开始发展的；天下的宏大事业，必定是由微小的细节积累而成的。所以懂得道的人始终不自以为是在做大事，所以才最终成就了伟大的事业。轻易许下诺言的人必定很少讲信用，把事情看得太容易的人必定会遭遇重重困难。所以懂得道的人总是把事情的难度考虑周全、审慎对待，所以最终反而没有克服不了的困难。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"天下难事，必作于易；天下大事，必作于细。图难于其易，为大于其细。","application":"任何看似不可攀登的高峰，拆解下来都只是一块块容易迈过的小台阶。不要被宏大的目标吓倒，认真对待眼前一个二十分钟内能完成的微小细节，大事自然会慢慢成型。","caution":"注重细节不是陷入鸡毛蒜皮的琐碎内耗，而是盯住那些决定全局成败的早期关键信号。","step":"为你手头最艰难、最不想碰的大项目，找出二十分钟内能动手完成的第一个微小动作，立刻把它做完。","themes":["化繁为简","防微杜渐","从小处着手"],"keywords":["拆解目标","细节","千里之行","审慎","不轻诺","脚踏实地"],"situations":["目标定得太大，每天看着任务栏发愁焦虑，迟迟不敢动手","答应别人太快，事后发现根本做不到，失信于人","把事情想得太简单，刚一上手就遇到一大堆意外瘫痪"],"reflection":"眼前这个让你望而生畏的大难题，如果把它拆成‘今天最容易做的一小块’，它长什么样？","reviewStatus":"draft"},{"id":64,"title":"慎终如始","original":"其安易持，其未兆易谋。其脆易泮，其微易散。为之于未有，治之于未乱。合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。为者败之，执者失之。是以圣人无为故无败，无执故无失。民之从事，常于几成而败之。慎终如始，则无败事。是以圣人欲不欲，不贵难得之货；学不学，复众人之所过，以辅万物之自然，而不敢为。","translation":"局面安定的时候容易维持，苗头尚未显露的时候容易谋划防范。事物脆弱的时候容易消解，事物微细的时候容易散除。在事情还没有发生危机时就要提前做好准备，在混乱还没有形成时就要及早治理。合抱粗的大树，是从细小的萌芽长成的；九层的高台，是一筐筐泥土垒起来的；千里的远行，是从脚下迈出的第一步开始的。强行妄为的必定会失败，死死执着抓紧的必定会失去。所以懂得道的人顺应自然不强妄为，所以不会失败；不固执占有，所以不会失去。人们做事，往往总是在快要成功的时候功亏一篑。如果在快要收尾时能像刚开始时那样谨慎认真，就不会有失败的事情了。所以懂得道的人，追求别人所不屑追求的清静质朴，不把稀罕的珍宝看得很贵重；学习别人所不愿学习的返璞归真，补救常人经常犯下的盲动过失，以此来辅佐万物的自然生长，而绝不敢随意盲目妄为。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"千里之行，始于足下。慎终如始，则无败事。","application":"开头容易，坚持到最后却往往容易松懈大意。在项目收尾、事情快要办成的时候，保持开局时的认真与敬畏，就能避开绝大多数功亏一篑的陷阱。","caution":"慎终如始不是疑神疑鬼、过度焦虑，而是对关键节点保持应有的检查与收尾标准。","step":"检查一项即将收尾交付的工作，用开工第一天的心态把核心清单重新核对一遍。","themes":["慎始敬终","防微杜渐","积少成多"],"keywords":["千里之行","始于足下","慎终如始","功亏一篑","防患未然","坚持"],"situations":["事情做到90%就开始浮躁松懈，结果在最后的交付环节栽了大跟头","计划列得很完美，但迟迟迈不出脚下的第一步","遇到隐患总觉得是小事不管，最后拖成了不可收拾的烂摊子"],"reflection":"这件快要做成的事情里，哪一个不起眼的收尾环节最需要你重新拿出开头的认真？","reviewStatus":"draft"},{"id":65,"title":"玄德深远","original":"古之善为道者，非以明民，将以愚之。民之难治，以其智多。故以智治国，国之贼；不以智治国，国之福。知此两者亦稽式。常知稽式，是谓玄德。玄德深矣，远矣，与物反矣，然后乃至大顺。","translation":"古时候善于体悟推行大道的人，不是用巧诈智谋去启发教导大家钻营，而是引导大家回归淳朴敦厚。人心之所以难以安定治理，正是因为心机巧诈太多。所以用机巧诡计来治理国家，是国家的灾贼；不用机巧诡计来治理，顺应自然真诚，才是国家的福分。懂得这两种方式的差别，就是永恒的法则准绳。始终掌握这种准绳法则，就叫作玄德。玄妙幽深的品德啊，是那么深邃，是那么辽远，它往往与世俗追求的方向背道而驰，但最终却能引导一切回归于最广大的顺畅通达。","sourceEdition":"王弼本《道德经》通行整理（校记：‘将以愚之’之‘愚’古义为淳朴敦厚、无机巧伪诈，非后世专制愚民之意）","excerpt":"常知稽式，是谓玄德。玄德深矣，远矣，与物反矣，然后乃至大顺。","application":"聪明反被聪明误。在复杂的关系和博弈中，靠小聪明和心机套路往往只能得意一时，最后把信任全部耗尽。选择守住真诚与质朴，看起来有些笨拙，最终却能换来长久的通达。","caution":"‘愚之’是引导人心回归质朴真诚，绝不是愚民政策或阻止别人学习知识与进步。","step":"在一次沟通中，放下准备用的小技巧或套路，直接真诚说出你的真实想法与需求。","themes":["大智若拙","去机巧","大顺之道"],"keywords":["真诚","不算计","大智若愚","质朴","长远通达","原则"],"situations":["整天钻研各种话术套路，结果大家越来越防着自己","跟人交往充满了算计，感到身心俱疲没有一个真心朋友","遇到问题总想耍小聪明糊弄过去，结果被当场拆穿极其尴尬"],"reflection":"在这场交流里，如果拿掉所有的套路与心机，最真诚的那句话是什么？","reviewStatus":"needs_review"},{"id":66,"title":"江海善下","original":"江海所以能为百谷王者，以其善下之，故能为百谷王。是以圣人欲上民，必以言下之；欲先民，必以身后之。是以圣人处上而民不重，处前而民不害。是以天下乐推而不厌。以其不争，故天下莫能与之争。","translation":"江海之所以能够成为百条溪谷河流汇聚的王者，正因为它善于处于低下的位置，所以才能成为百川之王。所以懂得道的人想要引领大家，言谈举止必须先对大家谦逊居下；想要带领在大家前面，利益诉求必须先把自己放在后面。所以懂得道的人身处上位，大家却不觉得有压迫沉重；身处前面带领，大家却不觉得受到妨碍损害。因此天下人都乐于拥戴推举他而从不感到厌倦。正因为他不与任何人争夺名利高下，所以天下没有人能跟他争得起来。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"江海所以能为百谷王者，以其善下之。以其不争，故天下莫能与之争。","application":"想拥有真正的影响力，不是靠居高临下的发号施令，而是像江海一样愿意把姿态放低、倾听并容纳所有人。把自己放低，别人的力量才会自然汇聚到你这里。","caution":"谦下居后不是自甘堕落，它是一种建立在宽广胸怀之上的包容容量。","step":"在下一次团队讨论中，先请发言最少、平时最不起眼的人把想法完整说完。","themes":["谦逊领导力","海纳百川","不争之争"],"keywords":["海纳百川","倾听","放低姿态","影响力","成就他人","容纳"],"situations":["走上领导岗位后架子很大，团队成员敢怒不敢言、人心涣散","总想在讨论中抢先定调子，压制了别人的积极性","觉得自己能力强就该高高在上，受到大家的排挤孤立"],"reflection":"你能怎样把自己的姿态放低一寸，却让整个团队或关系的水位上升一尺？","reviewStatus":"draft"},{"id":67,"title":"我有三宝","original":"天下皆谓我道大，似不肖。夫唯大，故似不肖。若肖，久矣其细也夫！我有三宝，持而保之。一曰慈，二曰俭，三曰不敢为天下先。慈故能勇；俭故能广；不敢为天下先，故能成器长。今舍慈且勇；舍俭且广；舍后且先；死矣！夫慈以战则胜，以守则固。天将救之，以慈卫之。","translation":"天下人都说我所体悟的大道广大无边，却看起来什么都不像。正因为它博大广大，所以才不像世俗任何具体的器物。如果它像某个具体东西，它早就变得渺小狭隘了！我珍藏着三件法宝，始终牢牢守护持守着它们：第一件叫作‘慈爱’，第二件叫作‘俭朴节制’，第三件叫作‘不敢争先居傲’。因为有慈爱，所以关键时刻才能生出真正的勇敢；因为有俭朴节制，所以能量资源才能宽广富足；因为不敢争先居傲，所以才能成为长久统领大局的领袖。如果抛弃了慈爱只顾蛮勇；抛弃了节制只顾肆意扩张；抛弃了谦后只顾争抢风头；那必定会走向灭亡！怀着慈爱去作战就能胜利，用来防守就能坚固无比。上天若要庇佑救助一个人，必定会用慈爱的心念来护卫他。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"我有三宝，持而保之。一曰慈，二曰俭，三曰不敢为天下先。","application":"记住这三件护身符：对人怀有慈悲善意，做事懂得节约蓄能，处世不抢无谓的风头。守住这三张底牌，任凭外界风浪再大，你也能平安从容、立于不败之地。","caution":"不敢为天下先不是遇事退缩懦弱，而是在没有看清局势前不做出头鸟，把力气留给关键时刻的担当。","step":"面对今天一个想要争抢风头或冲动反驳的时刻，默念一次‘慈、俭、不敢为天下先’，退一步深呼吸。","themes":["处世三宝","慈悲勇敢","节制谦逊"],"keywords":["三宝","慈爱","俭朴","不争先","护身符","真正的勇敢"],"situations":["遇事急躁冲动，总想当第一个跳出来的人，结果成了炮灰","花钱、耗神毫无节制，遇到风险时毫无还手之力","心肠越来越硬，在人际交往中充满了攻击性与戾气"],"reflection":"在‘慈爱、俭朴、不敢为天下先’这三件法宝里，你此刻最需要补上哪一件？","reviewStatus":"draft"},{"id":68,"title":"不争之德","original":"善为士者，不武；善战者，不怒；善胜敌者，不与；善用人者，为之下。是谓不争之德，是谓用人之力，是谓配天古之极。","translation":"优秀的勇士，从不炫耀武力气势汹汹；善于打仗的人，从不轻易被激怒动气；善于战胜对手的人，不与对手直接正面硬顶消耗；善于用人的人，态度谦逊甘愿居于其下。这就叫作不与人争的高尚品德，这就叫作善于借助他人力量的智慧，这就叫作契合天道、自古以来最高明的准则。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"善为士者，不武；善战者，不怒；善胜敌者，不与；善用人者，为之下。","application":"一被挑衅就跳脚愤怒，往往是最容易被对手操控的弱点。真正的高手心静如水，不被情绪牵着走，不跟烂人烂事正面纠缠消耗，借力打力才是最高明的胜局。","caution":"不怒不争不是麻木挨打，而是把情绪的主动权牢牢握在自己手里，冷静实施最有效的反制。","step":"面对一句故意挑衅或刺耳的话，今天完全不接招、不发怒，平静把话题转移到具体事实上。","themes":["掌控情绪","不怒之胜","借力用人"],"keywords":["不发怒","不纠缠","借力","心静如水","高手思维","不争之德"],"situations":["很容易被别人激怒，一点就着，做出冲动的傻事","跟对手在鸡毛蒜皮的口角上死磕，浪费了大量宝贵时间","总想靠嗓门大、拍桌子来显示权威，结果毫无说服力"],"reflection":"对方试图激怒你，是在逼你亮出底牌还是乱了阵脚？你能否用‘不怒’来掌控主动权？","reviewStatus":"draft"},{"id":69,"title":"哀者胜矣","original":"用兵有言：吾不敢为主，而为客；不敢进寸，而退尺。是谓行无行；攘无臂；扔无敌；执无兵。祸莫大于轻敌，轻敌几丧吾宝。故抗兵相加，哀者胜矣。","translation":"用兵作战有句名言：我不敢主动进攻挑起战端，而宁愿采取守势应对；不敢向前盲目推进一寸，而宁愿谨慎后退一尺。这就叫作排兵布阵却像没有阵形可攻；卷起袖子却像没有手臂可抓；面对敌人却像没有正面对抗的着力点；手持武器却像没有兵刃相加的杀气。最大的灾祸莫过于轻视对手，轻敌几乎会让我丧失立身的三件法宝。所以当两军势均力敌对抗交锋时，怀着悲悯仁慈、被迫应战的一方，最终必定会取得胜利。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"祸莫大于轻敌，轻敌几丧吾宝。抗兵相加，哀者胜矣。","application":"任何时候都不要轻敌狂妄。面对冲突与竞争，不主动挑事、不盲目冒进，守住自卫的底线；怀着对代价的清醒与悲悯去应对，往往能赢得最后的道义与胜利。","caution":"以退为进不是逃跑认输，而是在战略上保持最高级别的审慎，绝不打无准备、无道义之仗。","step":"在面对一个你觉得‘稳赢’的对手或任务时，强制自己列出三个最可能导致翻车的潜在盲点。","themes":["戒除轻敌","以退为进","悲悯者胜"],"keywords":["不轻敌","审慎","悲悯","哀者胜","防守反击","敬畏"],"situations":["觉得对手太弱完全不放在眼里，结果阴沟里翻船","盲目出击挑起争端，把自己陷入了进退两难的被动境地","在竞争中戾气太重，失去了所有旁观者的同情与支持"],"reflection":"在这场较量或项目中，你是否有因狂妄而忽视的致命盲区？你守住谦卑敬畏了吗？","reviewStatus":"draft"},{"id":70,"title":"被褐怀玉","original":"吾言甚易知，甚易行。天下莫能知，莫能行。言有宗，事有君。夫唯无知，是以不我知。知我者希，则我者贵。是以圣人被褐怀玉。","translation":"我所说的话本来容易明白，也容易实行，天下却少有人真正明白、真正实行。言论有根本的宗旨，做事有主导的原则；人们不了解这个根本，所以不容易理解我。理解我的人很少，能够取法于我的也就难得。因此明道的人外穿粗布衣，怀中却藏着美玉。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"知我者希，则我者贵。是以圣人被褐怀玉。","application":"有些重要原则说来简单，真正落实却需要反复练习。暂时不被理解时，可以先检查自己有没有说清楚、做扎实；不必靠外在包装证明价值，也不必把误解都归咎于别人。","caution":"被褐怀玉是内秀于心，不是故作清高的自命不凡，更不能成为拒绝与外界正常沟通的借口。","step":"写下一条你真正看重的原则，再写一个今天能够落实它的小行动。","themes":["大道至简","内秀于心","耐受孤独"],"keywords":["被褐怀玉","内在珍宝","朴素","大道至简","笃定","从容"],"situations":["自己坚守的简单原则总被别人说成‘太理想化’、‘太幼稚’","觉得没有人能真正懂自己的内心世界，感到孤单失落","花费大量金钱在名牌包装上，内心却极度空虚自卑"],"reflection":"如果不需要向任何人证明你的价值，你怀里揣着的那块‘美玉’（内在初心）是什么？","reviewStatus":"draft"},{"id":71,"title":"知不知上","original":"知不知，上；不知知，病。圣人不病，以其病病。夫唯病病，是以不病。","translation":"知道自己还有所不知，这是最上等的明智；明明不知道却自以为知道，这是一种病态的毛病。懂得道的人之所以没有这种毛病，是因为他把这种毛病当作真正的病痛来警惕。正因为能随时警惕并克服自以为是的毛病，所以他才始终保持清明健康的状态。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"知不知，上；不知知，病。夫唯病病，是以不病。","application":"知道自己的无知，是持续进步的开端；不懂装懂、自以为是，才是所有愚蠢与灾难的源头。勇于承认‘我不知道’，留出提问和学习的缝隙，人才能永远保持成长。","caution":"承认无知不是放弃判断与学习，而是怀着空杯心态，随时准备接纳新的认知与事实。","step":"在今天的一次对话中，对一个你其实不太懂的话题，坦然说一句：“这个我不太了解，能请你多讲讲吗？”","themes":["空杯心态","承认无知","反求诸己"],"keywords":["空杯心态","清醒","不装懂","谦逊学习","警惕偏见","自省"],"situations":["为了面子死撑着不懂装懂，最后露馅丢大脸","觉得自己经验丰富把话全说满了，结果决策出现重大失误","固步自封听不进任何年轻人的新建议，被时代抛弃"],"reflection":"在你自以为‘十拿九稳’的认知里，哪一块其实是你并未真正验证过的盲区？","reviewStatus":"draft"},{"id":72,"title":"自爱不自贵","original":"民不畏威，则大威至。无狎其所居，无厌其所生。夫唯不厌，是以不厌。是以圣人自知不自见；自爱不自贵。故去彼取此。","translation":"当老百姓不再畏惧统治者的严刑峻法时，真正可怕的大动荡危机就要到来了。不要逼迫压榨大家安居的家园，不要断绝堵死大家谋生的生路。正因为不对大家施加令人厌恶的压迫，大家才不会对上位者产生厌恶痛恨。所以懂得道的人：有自知之明却不自我炫耀；懂得珍惜自爱却不自命高贵。所以舍弃骄横显摆，守住自知与自爱。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"是以圣人自知不自见；自爱不自贵。故去彼取此。","application":"不要把别人逼到无路可退的死角，给人留一条生路，就是给自己留一条后路。好好爱惜自己的身心与羽毛，但绝不要自命不凡、看不起身边的人。","caution":"自爱自重是守护内在尊严，自贵自矜则是踩在别人头上找优越感，两者差之毫厘谬以千里。","step":"在一场你占尽优势的博弈中，主动退让一步，给对方留出体面的退路与利益空间。","themes":["留有余地","自爱自谦","不逼人入绝境"],"keywords":["留后路","自知","自爱","不傲慢","给别人活路","分寸"],"situations":["把下属或合作方逼得太狠，导致对方彻底掀桌子决裂","赚了点钱就看不起穷亲戚或基层员工，处处摆谱显摆","不懂得爱惜自己的身体和声誉，放任自己随波逐流"],"reflection":"在这段紧绷的人际关系里，你有没有把对方逼得太紧？留出哪条退路能换来长久安宁？","reviewStatus":"draft"},{"id":73,"title":"勇于不敢","original":"勇于敢则杀，勇于不敢则活。此两者，或利或害。天之所恶，孰知其故？是以圣人犹难之。天之道，不争而善胜，不言而善应，不召而自来，繟然而善谋。天网恢恢，疏而不失。","translation":"一味逞强冒进，可能招来毁灭；敢于有所不敢，反而可能保全生命。这两种选择有的有利、有的有害，其中缘故很难说尽，明道的人对此也保持谨慎。天道不争，却能成就；不言，却有回应；不召唤，事情也会到来；宽缓从容，却自有安排。天网广大，看似稀疏，却不轻易遗漏。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"勇于敢则杀，勇于不敢则活。天网恢恢，疏而不失。","application":"面对愤怒和诱惑，暂缓行动也是一种勇气。它不能保证事情自然获得公正结果，却能给你时间核实事实、评估风险，并选择更少伤害的做法。","caution":"勇于不敢是战术上的克制与清醒，绝不是在正义受侵害时的懦弱退缩。","step":"遇到想立刻报复的冲动，先暂停一天；记录事实、风险和可求助的人，再决定下一步。","themes":["克制的勇敢","天道从容","大局因果"],"keywords":["克制","忍耐","真正的勇敢","天网恢恢","因果","不逞匹夫之勇"],"situations":["一听到别人激将就上头硬冲，结果掉进了别人挖好的陷阱","总觉得忍让是丢人，把每一次冲突都升级成你死我活的决斗","担心正义得不到伸张，整天陷入焦虑和仇恨中无法自拔"],"reflection":"在眼前这件让你冲动的事情上，选择‘敢于克制不冲动’，能帮你避开怎样巨大的风险？","reviewStatus":"needs_review"},{"id":74,"title":"代大匠斫","original":"民不畏死，奈何以死惧之？若使民常畏死，而为奇者，吾得执而杀之，孰敢？常有司杀者杀。夫代司杀者杀，是谓代大匠斫，夫代大匠斫者，希有不伤其手矣。","translation":"当人们连死亡都不再畏惧，又怎么能用死亡威吓他们？即使设想人人畏死、作乱者会被处死，谁又能轻率地掌握这种生杀之权？总有承担刑杀职责者。越过自己的位置代行刑杀，如同替高明木匠砍削木材，很少有不伤到自己手的。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"民不畏死，奈何以死惧之？夫代大匠斫者，希有不伤其手矣。","application":"个人不宜把自己当作最终审判者。面对伤害，可以保留证据、设定边界并寻求合法程序；把惩罚权交给有职责和约束的制度，也是在避免报复继续扩大伤害。","caution":"不代大匠斫不是否定社会的法律规则，而是警惕个人私欲膨胀、滥用惩罚与报复权力。","step":"把一件想亲自报复的事改写成三个动作：保存事实、保护自己、向合适的人或机构求助。","themes":["慎用惩罚","不越俎代庖","守住边界"],"keywords":["不报复","合法程序","守边界","慎罚","求助","自保"],"situations":["满脑子都是怎么让仇人倒霉，自己生活被仇恨彻底吞噬","试图通过最极端的恐吓来管教孩子或下属，结果彻底失控","在自己专业以外的领域指手画脚强行越权，搞得一团糟"],"reflection":"在这件事里，哪些行动能真正保护你并解决问题，哪些只是会扩大伤害的报复？","reviewStatus":"needs_review"},{"id":75,"title":"求生之厚","original":"民之饥，以其上食税之多，是以饥。民之难治，以其上之有为，是以难治。民之轻死，以其上求生之厚，是以轻死。夫唯无以生为者，是贤于贵生。","translation":"老百姓之所以挨饿受冻，是因为上面征收的苛捐杂税太多，所以才饥寒交迫。老百姓之所以难以安定管理，是因为上面瞎指挥、过度强加作为，所以才纷乱难安。老百姓之所以不顾性命铤而走险，是因为上面贪图享乐、奉养自身太过丰厚奢靡，所以大家才把性命看得很轻。唯有不把个人的享乐挥霍当成人生唯一追求的人，才真正懂得珍惜尊重生命的崇高价值。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"民之难治，以其上之有为。夫唯无以生为者，是贤于贵生。","application":"很多管理和相处中的矛盾，根源往往在于管理方‘索取太多、干涉太多、自我优待太多’。反躬自省自己的过度占有与瞎折腾，少一点索取，大家自然就会安居乐业。","caution":"不贵生不是轻视生命，而是不过度执着于肉体的奢靡享乐，从而摆脱贪婪的奴役。","step":"检查你在一段关系或团队中向对方索取的清单，主动减掉一项让对方感到压力沉重的要求。","themes":["反思索取","少点折腾","简朴利他"],"keywords":["少索取","不折腾","自省","体谅他人","减负","放下奢靡"],"situations":["对伴侣或团队要求极多、挑剔极严，自己却什么都不愿付出","过度追求所谓的精致轻奢生活，把家庭财务逼上绝境","制度管得太死太细，把员工的精力全耗在应付检查上"],"reflection":"在这段紧绷的关系里，是不是你的‘索取和干涉太多’，导致对方喘不过气来？","reviewStatus":"draft"},{"id":76,"title":"人之生也柔弱","original":"人之生也柔弱，其死也坚强。草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。是以兵强则灭，木强则折。强大处下，柔弱处上。","translation":"人活着的时候，身体是柔软灵活的，死了以后身体就变得僵硬冰冷。草木活着的时候，枝叶是柔嫩脆弱的，死了以后就变得干枯坚硬。所以坚硬僵化属于死亡的一类，柔软温润属于生命的一类。因此军队过于刚强逞凶就会招致覆灭，树木长得过于刚硬不弯就会被暴风折断。过于刚强粗暴的必定处于下风劣势，保持柔韧灵活的才能处于上位生机。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"人之生也柔弱，其死也坚强。坚强者死之徒，柔弱者生之徒。","application":"活着的标志就是会弯曲、会适应、会调整姿势。如果心态和身体变得僵硬死板、固执己见，往往就是衰退的征兆。保持内心的柔软、好奇与弹性，生命才能永远处于蓬勃的生机之中。","caution":"柔弱不是没有骨气，柔软的背后要有强大的生命力作为支撑，如同春草在微风中摇曳却生生不息。","step":"把一句卡在嘴边的‘我必须这样/绝对不行’，换成‘如果换一种方式，我们还能怎样达成目标’。","themes":["生命弹性","柔弱胜刚","保持柔软"],"keywords":["柔软","弹性","不僵化","生命力","灵活","生机"],"situations":["思维极其僵化死板，一遇到计划变动就焦虑发飙","脾气又臭又硬，跟谁说话都带着刺，撞得头破血流也不肯改","感到自己的心灵麻木僵硬，对生活失去了敏感度与热情"],"reflection":"在哪个固执的观念上，你如果肯放松一点僵硬的姿势，整个人会立刻轻盈起来？","reviewStatus":"draft"},{"id":77,"title":"天之道如张弓","original":"天之道，其犹张弓欤？高者抑之，下者举之；有馀者损之，不足者补之。天之道，损有馀而补不足。人之道，则不然，损不足以奉有馀。孰能有馀以奉天下？唯有道者。是以圣人为而不恃，功成而不处，其不欲见贤。","translation":"天道的运行规律，不正像拉开弓箭射箭一样吗？弦拉高了就把它压低一些，弦放低了就把它抬高一些；拉得有多余力度的就减损一点，拉得不够力度的就补足一些。天道的法则，是减损多余的、补足不足的，实现动态平衡。而世俗凡人的做法却常常相反：剥削掠夺贫困不足的，去奉养讨好富有有余的。谁能够把多余的财富与资源拿出来奉献给天下不足的人呢？唯有懂得大道的人才能做得到。所以懂得道的人做了贡献却不自恃自负，大功告成了却不居功自傲，因为他不愿在人前刻意显摆自己的贤能。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"天之道，损有馀而补不足。圣人为而不恃，功成而不处。","application":"这一章以张弓比喻调节有余与不足，也反问谁愿意拿出有余来帮助天下。分享不会自动带来回报，但它可以在力所能及的范围内，让资源流向真正需要的地方。","caution":"分享奉献不是道德绑架式的倾家荡产，而是在自己有余力的前提下，主动促进良性的循环与善意流动。","step":"把自己擅长的一项技能或富余的一样物品，无偿分享给身边一个正在为此发愁的朋友。","themes":["动态平衡","损有余补不足","利他分享"],"keywords":["平衡","分享","不囤积","利他","天道流通","不居功"],"situations":["自己手里资源很多，却把每一分利益算计到骨头里，朋友越来越少","感到社会贫富分化与不公，不知道自己在其中该扮演什么角色","有了成就就忍不住炫耀，引起周围人的嫉妒与疏离"],"reflection":"在你所拥有的富余资源里（时间、经验、善意、财物），哪一部分如果流通出去能创造最大的温暖？","reviewStatus":"draft"},{"id":78,"title":"水莫能胜","original":"天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。弱之胜强，柔之胜刚，天下莫不知，莫能行。是以圣人云：受国之垢，是谓社稷主；受国不祥，是为天下王。正言若反。","translation":"天下万物中没有什么比水更柔软娇弱的了，然而攻克坚硬强横的东西，却没有哪一样能胜过水，因为没有任何东西能够替代改变它。弱小胜过强大，柔顺战胜刚硬，天下没有人不知道这个道理，却很少有人能真正照着去践行。所以懂得道的人说：能够担当承受国家的污垢与指责，才称得上是真正的主心骨与社稷之主；能够担当承受国家的灾祸与艰难，才称得上是真正的天下之王。这些最颠扑不破的真理，听起来却往往像是反话一样。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"天下莫柔弱于水，而攻坚强者莫之能胜。受国之垢，是谓社稷主。","application":"真正的担当不是享受聚光灯与荣耀，而是在关键时刻有像水一样的容量，能够接得住委屈、扛得住误解、容得下脏水。能承载多大的委屈，就能撑得起多大的事业。","caution":"担当承受不是无原则的受气包，而是为了大局和核心目标，拥有像大海一样纳百川吞浊流的胸襟。","step":"面对今天一次不公的指责或琐碎的误解，不急着辩解反驳，像水一样让泥沙自然沉淀过去。","themes":["如水穿石","担当之勇","忍辱负重"],"keywords":["水","担当","容纳委屈","胸襟","以柔克刚","真正领袖"],"situations":["在团队中稍微受一点委屈就觉得天塌了，闹着要撂挑子辞职","面对顽固的困难总想一次性硬砸开，结果自己撞得头破血流","想当领头人，却只想享受好处，一点责任和骂名都不肯承担"],"reflection":"这件让你感到委屈或棘手的事情，能否成为拓宽你内心‘如水容量’的一次磨炼？","reviewStatus":"draft"},{"id":79,"title":"执左契","original":"和大怨，必有余怨；安可以为善？是以圣人执左契，而不责于人。有德司契，无德司彻。天道无亲，常与善人。","translation":"调解深重的怨恨之后，往往仍会留下余怨，这怎能算彻底妥善？所以明道的人持有契约的凭据，却不急于苛责对方。有德者守着契约，无德者只想着征取。天道没有偏私，总与合于善的行动相应。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"圣人执左契，而不责于人。天道无亲，常与善人。","application":"重大冲突很少因一次和解就完全消失。手里有理、有凭据时，仍可选择克制而不羞辱对方；同时也要把事实责任、现实边界和可以放下的情绪分开处理。","caution":"宽厚不等于放弃追责、法律权利或安全边界。若涉及暴力、欺诈或持续伤害，应先保护自己并寻求专业帮助。","step":"把一桩旧怨分成三栏：需要厘清的事实责任、必须守住的现实边界、可以慢慢放下的情绪。","themes":["化解余怨","持契不苛","事实与情绪分开"],"keywords":["余怨","不苛责","契约","边界","责任","和解"],"situations":["心里记着十年前谁欠自己一句话，整天折磨自己不肯放下","得理不饶人，非要把对方逼得倾家荡产、跪地求饶才肯罢休","凡事都要跟伴侣或朋友AA算到分厘不差，感情彻底算没了"],"reflection":"这桩旧怨里，哪些责任必须处理，哪些情绪可以不再每天反复偿付？","reviewStatus":"needs_review"},{"id":80,"title":"甘其食美其服","original":"小国寡民。使有什伯之器而不用；使民重死而不远徙。虽有舟舆，无所乘之；虽有甲兵，无所陈之。使民复结绳而用之。甘其食，美其服，安其居，乐其俗。邻国相望，鸡犬之声相闻，民至老死，不相往来。","translation":"理想的生活状态是：范围不大，人群质朴安宁。即使有提高效率的各种复杂器械，大家也不去盲目依赖；使大家珍惜宝贵的生命，而不必背井离乡流离失所。虽然有船只车辆，却用不着四处奔波折腾；虽然有铠甲武器，却没有用武之地去陈列炫耀。让人们重新体会结绳记事那样纯粹简单的生活。觉得自己的食物香甜可口，觉得自己的衣裳舒适得体，觉得自己的居所安宁踏实，享受自己质朴天然的民风习俗。哪怕邻近的地方相互看得到，鸡鸣狗叫的声音相互听得清，大家各自安心自足地过好自己的日子，直到老死也不用去勾心斗角盲目攀比。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"甘其食，美其服，安其居，乐其俗。","application":"幸福的最高境界，往往藏在热气腾腾的一饭一蔬与踏实的安宁之中。不被外界纷繁的喧嚣与攀比带偏，吃好自己的饭、穿好舒适的衣、过好当下的日子，守住自己的小山水，就是最圆满的自得其乐。","caution":"小国寡民不是开历史倒车拒绝现代文明，而是找回在科技繁杂的世界里，依然能够安居乐业、不被异化的心灵净土。","step":"今天为自己或家人做一顿朴实热乎的饭菜，慢慢吃完，认真体会这一刻的踏实与甘美。","themes":["安居乐业","自得其乐","田园心境"],"keywords":["安居","朴实生活","一饭一蔬","不攀比","幸福","知足常乐"],"situations":["整天看着网上的奢华生活感到焦虑，觉得自己的小日子一文不值","背井离乡奔波劳碌，却越来越忘记了最开始是为了什么生活","生活被各种高科技和复杂工具绑架，找不回简单的快乐"],"reflection":"抛开别人定义的那套‘成功模板’，你心目中最踏实、惬意的一天长什么样？","reviewStatus":"draft"},{"id":81,"title":"为而不争","original":"信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。圣人不积，既以为人己愈有，既以与人己愈多。天之道，利而不害；圣人之道，为而不争。","translation":"真实的话未必漂亮，漂亮的话未必真实。善于行道的人不以争辩逞胜，沉迷争辩也未必更善；真正理解不在于一味追求广博，广博也不等同于真正理解。明道的人不为自己囤积，越是帮助别人，自己越充实；越是给予别人，自己越丰足。天道利万物而不伤害，明道的人有所作为而不争夺。","sourceEdition":"王弼本《道德经》通行整理","excerpt":"天之道，利而不害；圣人之道，为而不争。信言不美，美言不信。","application":"真正有益的行动，不必靠压倒别人来证明力量；真正有价值的付出，不必靠争夺掌声来证明意义。踏实做事，坦荡给予，完成之后把手放下。不争虚荣，内心的笃定便无人能够夺走。","caution":"为而不争不是当软弱无力的老好人，而是在竭尽全力创造价值的同时，放下对虚荣名利的执念与贪婪。","step":"完成今天手头最后一件对他人有益的小事，然后安静关上电脑或放下手机，把掌声与喧嚣留在身后。","themes":["为而不争","利而不害","利他丰盈"],"keywords":["为而不争","真实","利他","充盈","圆满收官","大道至简"],"situations":["做了一点好事总觉得必须被全天下知道，得不到掌声就委屈愤怒","沉迷于网络口舌之争，赢了嘴巴输了心情与时间","不知道人生的最终落脚点该在哪里，感到迷茫与焦灼"],"reflection":"今天，你怎样做一件对世界有用、无害、也不喧哗的事，然后安静享受内心的丰盈？","reviewStatus":"draft"}]</script>
<script type="application/json" id="toxic-data">[{"id":1,"title":"别拿着你的塑料字典，去硬套宇宙的底层架构","points":[{"text":"懂王开篇大翻车：满大街都是张口闭口“我已经摸透底层逻辑”、“给你一套万能公式”的专家。老子开篇第一句就直接甩耳光：但凡能被你用几句漂亮话给定义死的，根本不是宇宙真正的底层驱动（非常道）！","details":[]},{"text":"贴标签上瘾症：人类最爱干的事就是给万物打标签（名）。一贴标签，你的视野就被框死在这几个字里了。","details":[]},{"text":"言哥心法：看世界得学会自由切换视角。想看无限的可能性和灵感，就清空偏见（观其妙）；想做具体的落地交付，就看清边界和规则（观其徼）。别被自己那点可怜的固定思维给锁死了。","details":[]}]},{"id":2,"title":"你天天立的人设，本质上就是个回旋镖","points":[{"text":"二极管审美大赏：非要全网统一什么才叫“高级美”，一旦标准定死，剩下所有正常长相瞬间被贬为“丑陋”；非要把某个人捧成“道德圣人”，一旦他没扶老奶奶过马路，立马被全网网暴成“伪善”。","details":[]},{"text":"系统互为镜像：高低、难易、美丑，全都是绑在一起的双生子。你有多渴望被夸“完美”，背后就埋了多深被反噬的炸雷。","details":[]},{"text":"言哥心法：别去抢着占领道德高地。把活干完，别赖着不走四处邀功（功成而弗居）。你不死死霸占那个虚幻的功劳，这件成果才真正永远刻在你账上。","details":[]}]},{"id":3,"title":"少在群里画饼打鸡血，大家才能踏实干活","points":[{"text":"虚荣心炒作大师：很多领导和平台天天搞什么“狼性标兵评比”，把几块破石头炒成天价奢侈品。结果除了激发起大家互相使绊子、搞内耗，屁用没有。","details":[]},{"text":"老子的系统减压术：","details":["虚其心（清空焦虑杂念）；","实其腹（让大家吃饱饭）；","弱其志（降低虚妄的欲望）；","强其骨（把底层身体和核心技能练扎实）。"]},{"text":"言哥心法：踏实把底层的饭碗和硬件搞硬，少给大脑喂那些膨胀的虚荣垃圾，整个系统自然稳定运行。","details":[]}]},{"id":4,"title":"深不见底的服务器，从来不需要弹窗炫耀","points":[{"text":"浅薄者的自嗨：稍微懂点皮毛的人，恨不得把锐气写在脸上，走两步都要刺人一下，生怕别人不知道他有才华。","details":[]},{"text":"老子的高维接口（和光同尘）：","details":["把扎人的刺收敛起来（挫其锐）；","把复杂的乱麻理顺（解其纷）；","融入普通人的光芒与尘土中（和其光，同其尘）。"]},{"text":"言哥心法：顶级的高手表面看起来极度低调，甚至像个普通老实人（湛兮似或存）。能把庞大算力藏在后台、润物细无声解决问题的人，才是真正的核心主控。","details":[]}]},{"id":5,"title":"天地可没空听你哭惨，收起你的受害者心态","points":[{"text":"戏精巨婴的破防：天天抱怨“命运不公”、“老天爷针对我”。老子一盆冷水泼醒你——宇宙物理定律压根不带个人情感，星系运转和草木枯荣完全按照规则跑，把你和路边的野草一视同仁（以万物为刍狗）！","details":[]},{"text":"风箱原理：天地就像个大风箱，中间是空的，越拉动风力越强。你越在那大喊大叫、四处诉苦（多言数穷），能量消耗得越快，死得越早。","details":[]},{"text":"言哥心法：别到处祥林嫂式抱怨。闭上嘴，守住内心的中轴线（守中）。尊重客观规律，按规则出牌，比四处求同情管用一万倍。","details":[]}]},{"id":6,"title":"无限续航的母体，从来不搞电量焦虑","points":[{"text":"耗电狂魔的末路：当代人动不动就喊“被掏空了”、“心力交瘁”，天天透支精神去赶场卷生卷死。","details":[]},{"text":"老子的永动机模型：山谷空旷深邃，所以能不断孕育生机（谷神不死）。玄牝（生生不息的母体）的大门永远敞开，它输出能量时绵绵不绝、极其轻柔（用之不勤），从来不搞竭泽而渔。","details":[]},{"text":"言哥心法：学会“低功耗长续航”。找到能让你持续汲取能量的底座，像细水长流一样做事，别动不动就把自己的电池干到0%。","details":[]}]},{
